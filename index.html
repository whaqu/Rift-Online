}
function duelHudUpdate(){
  const H=DU.hud;if(!H||!H.title||!H.rows[0]||!H.rows[0].children)return;
  const hp=n=>n===SES.name?Math.round(P.hp/S.maxHp*100):(NET.peers[n]?NET.peers[n].hp:0);
  const title=DU.ph==='count'?'결투 시작까지 '+Math.ceil(DU.pt):DU.ph==='end'?DU.res:DU.role==='spec'?'관전 중':'결투 · '+Math.max(0,Math.ceil(DUEL_TIME-DU.t))+'초';
  const v=[DU.a,DU.b].map(n=>[n,clamp(hp(n),0,100)]),key=title+JSON.stringify(v);if(H.last===key)return;H.last=key;
  H.title.textContent=title;H.btn.textContent=DU.role==='spec'?'관전 종료':'기권';
  v.forEach(([n,h],i)=>{const r=H.rows[i].children;r[0].textContent=n;r[1].firstElementChild.style.width=h+'%'});
}
function duelQuit(){
  if(!DU.on)return;
  if(DU.role==='spec')duelLeave('관전을 마쳤습니다');
  else if(DU.ph!=='end')duelLose('기권했습니다');
}

/* ---------- per frame ---------- */
function duelUpdate(dt){
  if(DU.pend&&Date.now()-DU.pend.at>25000)DU.pend=null;
  if(!DU.on)return;
  if(!NET.on){duelLeave('연결이 끊겨 결투장에서 나왔습니다');return}
  DU.t+=DU.ph==='count'?0:dt;
  const now=Date.now(),others=DU.role==='spec'?[DU.a,DU.b]:[DU.opp],live=others.every(n=>NET.peers[n]);
  if(live&&(DU.role==='fight'||others.some(n=>NET.peers[n].du&&NET.peers[n].du.id===DU.id)))DU.seen=now;
  if(DU.ph==='end'){DU.pt-=dt;if(DU.pt<=0)duelLeave(DU.res)}
  else if(!live||now-DU.seen>(DU.role==='spec'?4000:8000))duelLeave(DU.role==='spec'?'결투가 끝났습니다':'상대의 연결이 끊겨 결투가 취소되었습니다');
  else if(DU.ph==='count'){
    DU.pt-=dt;
    if(DU.pt<=0){
      DU.ph='fight';DU.t=0;UI.toast('결투 시작!',1400);sfx('level');
      const p=NET.peers[DU.opp],m=makeMobObj(-777,'slime',p.x||DU.x,p.z||DU.z,1,false,true);
      entG.remove(m.m.g);m.duel=true;m.spawning=false;m.dmg=0;m.r=.7;m.maxHp=m.hp=1e12;DU.prox=m;
    }
  }else if(DU.ph==='fight'){
    const p=NET.peers[DU.opp],m=DU.prox;
    if(m&&p){m.x=m.tx=p.x;m.z=m.tz=p.z;m.dead=false;m.hp=m.maxHp*Math.max(.01,p.hp/100);if(!MOBS.includes(m))MOBS.push(m)}
    DU.flush-=dt;if((DU.out>0||DU.fx)&&DU.flush<=0){DU.flush=.1;netSend('dh',Object.assign({id:DU.id,f:SES.name,t:DU.opp,d:Math.round(DU.out)},DU.fx));DU.out=0;DU.fx=null}
    if(DU.role==='fight')duelTickFx(dt);
    /* time over: the one with less HP left concedes (ties: the challenger) */
    if(DU.t>=DUEL_TIME&&p){const me=P.hp/S.maxHp*100;if(me<p.hp||(me===p.hp&&DU.a===SES.name))duelLose('시간 종료 · 패배')}
  }
  if(DU.on)duelHudUpdate();
}

/* ---------- job advancement ---------- */
function modText(m){
  const t=[];if(m.hp)t.push('체력 '+(m.hp>1?'+':'')+Math.round((m.hp-1)*100)+'%');if(m.atk)t.push('공격력 '+(m.atk>1?'+':'')+Math.round((m.atk-1)*100)+'%');if(m.aps)t.push('공속 +'+Math.round((m.aps-1)*100)+'%');
  if(m.spd)t.push('이속 +'+Math.round((m.spd-1)*100)+'%');if(m.crit)t.push('치명타 +'+Math.round(m.crit*100)+'%');if(m.armor)t.push('피해 감소 +'+Math.round(m.armor*100)+'%');if(m.vamp)t.push('흡혈 '+Math.round(m.vamp*100)+'%');
  if(m.burn)t.push('화상 Lv.'+m.burn);if(m.chain)t.push('연쇄 번개');if(m.pierce)t.push('관통 +'+m.pierce);if(m.regen)t.push('체력 재생');if(m.berserk)t.push('체력 50% 이하 공속 +40%');return t.join(' · ');
}

      +'<div style="margin-top:6px;font-size:12px">'+['q','e','r','f'].map(s=>{const k=s==='f'?ULT[pf.cls]:skillOf(s);return k&&k.desc?'<div><b class="gold">'+s.toUpperCase()+' '+k.name+'</b>'+(s==='f'&&pf.level<MAXLV?' <span class="dim">(Lv.'+MAXLV+' 해금)</span>':'')+' — '+k.desc+'</div>':''}).join('')+'</div></div>';

          +'<div class="row sp" style="margin-top:8px"><span class="gold '+(okG?'':'red')+'">'+fmtG(j.price)+'</span><button class="btn sm" data-a="adv" data-v="'+id+'" '+(okL&&okG?'':'disabled')+'>전직</button></div></div>'}

function nearNpc(){
  if(!P||P.dead)return null;let best=null,bd=3.6*3.6;

async function netInit(){

  if(SES.mode!=='online'){UI.setNet(false,'오프라인');return}
  UI.setNet(false,'접속 중…');

async function netConnect(){
  if(NET.joining||NET.on||GUARD.tripped)return;NET.joining=true;
  clearTimeout(NET.retryT);NET.retryT=null;
  try{
    if(!window.supabase)await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js');
    if(GUARD.tripped)return;
    if(!NET.sb)NET.sb=window.supabase.createClient(RW_CFG.url,RW_CFG.key,{realtime:{params:{eventsPerSecond:30}}});
    // try the previous channel first so a party finds each other again
    const order=[1,2,3,4,5,6];if(NET.shard)order.sort((a,b)=>(b===NET.shard)-(a===NET.shard));
    for(const i of order){const ok=await netJoin(i);if(ok)break}
    if(!NET.on)throw new Error('join');
    const again=NET.retry>0;NET.retry=0;UI.setNet(true,'온라인');syncPeers();UI.renderPeers();
    if(again){UI.toast('서버에 다시 연결되었습니다');netPartyResync()}
  }catch(e){NET.on=false;netRetry()}
  finally{NET.joining=false}
}
/* reconnect with back-off: 1, 2, 4, 8, then every 15 s */
function netRetry(){
  if(GUARD.tripped||NET.on||NET.retryT)return;
  const wait=Math.min(15,Math.pow(2,NET.retry))*1000;NET.retry++;
  UI.setNet(false,'연결 끊김 · 재접속 중…');
  NET.retryT=setTimeout(()=>{NET.retryT=null;netConnect()},wait);
}
function netLost(ch){
  if(GUARD.tripped||ch!==NET.ch)return;
  NET.on=false;NET.ch=null;NET.rejoin=NET.party?NET.party.id:null;
  try{NET.sb.removeChannel(ch)}catch(e){}
  for(const k in NET.peers)dropPeer(k);
  UI.renderPeers();netRetry();
}
/* after a reconnect the party may have changed while we were away: announce (leader) or ask (member), drop it if nobody answers */
function netPartyResync(){
  const id=NET.rejoin;NET.rejoin=null;if(!id||!NET.party||NET.party.id!==id)return;
  NET.partyGone={};NET.resync=id;let n=0;
  const step=()=>{
    if(NET.resync!==id||!NET.on||!NET.party||NET.party.id!==id)return;
    if(NET.party.leader===SES.name){if(!n)broadcastParty();checkParty();if(++n<6)setTimeout(step,1500);return}
    if(n++<4){netSend('pq',{n:SES.name,id});setTimeout(step,1500)}else{NET.resync=null;setParty(null);UI.toast('파티 연결이 해제되었습니다')}
  };
  step();
}
function onPQuery(d){if(d&&NET.party&&NET.party.id===d.id&&NET.party.leader===SES.name)broadcastParty()}
function netWake(){if(SES.mode==='online'&&NET.tried&&!NET.on&&!NET.joining){NET.retry=Math.max(1,NET.retry);netConnect()}}
if(window.addEventListener){window.addEventListener('online',netWake);window.addEventListener('focus',netWake)}
function netJoin(i){
  return new Promise(res=>{
    let done=false;const name='rw-field-'+i;
    const ch=NET.sb.channel(name,{config:{broadcast:{self:false},presence:{key:SES.name}}});
    const fin=v=>{if(done)return;done=true;if(!v&&NET.ch!==ch)try{NET.sb.removeChannel(ch)}catch(e){}res(v&&!GUARD.tripped)};
    ch.on('broadcast',{event:'p'},m=>onPos(m.payload)).on('broadcast',{event:'fx'},m=>onFx(m.payload)).on('broadcast',{event:'c'},m=>onChat(m.payload))
      .on('broadcast',{event:'pi'},m=>onPInvite(m.payload)).on('broadcast',{event:'pa'},m=>onPAccept(m.payload)).on('broadcast',{event:'ps'},m=>onPState(m.payload)).on('broadcast',{event:'pl'},m=>onPLeave(m.payload)).on('broadcast',{event:'pq'},m=>onPQuery(m.payload))
      .on('broadcast',{event:'ti'},m=>onTInvite(m.payload)).on('broadcast',{event:'es'},m=>onSnap(m.payload)).on('broadcast',{event:'ed'},m=>onHit(m.payload))
      .on('broadcast',{event:'ek'},m=>onKillCredit(m.payload)).on('broadcast',{event:'ev'},m=>onEnemyEv(m.payload)).on('broadcast',{event:'dg'},m=>onDgEv(m.payload)).on('broadcast',{event:'dq'},m=>onDuelAsk(m.payload)).on('broadcast',{event:'da'},m=>onDuelYes(m.payload)).on('broadcast',{event:'dx'},m=>onDuelNo(m.payload)).on('broadcast',{event:'dh'},m=>onDuelHit(m.payload)).on('broadcast',{event:'de'},m=>onDuelEnd(m.payload)).on('broadcast',{event:'dr'},m=>onDuelRecorded(m.payload)).on('broadcast',{event:'cb'},m=>onCb(m.payload)).on('broadcast',{event:'ch'},m=>onCh(m.payload))
      .on('presence',{event:'sync'},()=>{syncPeers();if(!done){let n=0;try{n=Object.keys(ch.presenceState()).length}catch(e){}
        if(n>SHARD_MAX&&i<6){fin(false)}else{NET.ch=ch;NET.on=true;NET.shard=i;fin(true)}}})
      .subscribe(st=>{
        if(st==='SUBSCRIBED'){try{ch.track(myInfo())}catch(e){}setTimeout(()=>{if(!done){NET.ch=ch;NET.on=true;NET.shard=i;fin(true)}},1800)}
        else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'||st==='CLOSED'){if(!done)fin(false);else netLost(ch)}
      });
    setTimeout(()=>fin(false),7000);

}
/* call after level / job / weapon changes: refresh presence and push a position packet right away */
function netPresence(){NET.lastPos=0;if(NET.on&&NET.ch)try{NET.ch.track(myInfo())}catch(e){}}

/* ---------- peers ---------- */
function syncPeers(){
  if(!NET.ch)return;let st={};try{st=NET.ch.presenceState()}catch(e){}
  const seen={};
  for(const k in st){
    if(k===SES.name)continue;const m=st[k]&&st[k][st[k].length-1];if(!m)continue;seen[k]=1;let p=NET.peers[k];
    if(!p)p=NET.peers[k]={name:k,x:0,z:0,tx:0,tz:0,f:0,tf:0,moving:false,model:null,label:null,got:false,hp:100,dead:false,anim:Math.random()*5,cls:'warrior',job:'warrior',lv:0};
    if(!p.live)applyPeerInfo(p,m);   // live packets are newer than presence
  }
  for(const k in NET.peers){if(!seen[k])dropPeer(k)}
  UI.renderPeers();checkParty();
}
const peerLabel=p=>(p.lv?'Lv.'+p.lv+' ':'')+p.name;
/* level / class / job / weapon of another player; returns true when something changed */
function applyPeerInfo(p,m){
  const c=CLASSES.includes(m.cls)?m.cls:'warrior',j=JOBS[m.job]?m.job:c,w=typeof m.w==='string'&&m.w.length<24?m.w:null,lv=clamp(Math.floor(+m.lv)||0,0,99)||p.lv;
  const look=c!==p.cls||j!==p.job||w!==p.w,changed=look||lv!==p.lv;
  if(look){p.cls=c;p.job=j;p.w=w;if(p.model){entG.remove(p.model.g);p.model=null}}
  p.lv=lv;if(p.label)p.label.el.textContent=peerLabel(p);
  return changed;
}
function dropPeer(k){const p=NET.peers[k];if(!p)return;dropGolems(p);if(p.model)entG.remove(p.model.g);if(p.label)p.label.remove();delete NET.peers[k]}
function onPos(d){
  if(!d||typeof d.n!=='string')return;const p=NET.peers[d.n];if(!p)return;

/* ---------------- developer tools guard ----------------
   `debugger` only stops while developer tools are open, so a long gap around it means they are.
   On the trip, rewards collected so far are sent one last time; after that nothing is saved or sent,
   and only a reload brings the game back. */
const GUARD_MS=100,GUARD_EVERY=1000;
let guardTimer=0;
// rewards not sent yet, frozen as text before the pause so later edits don't count
function guardSnap(){
  const arr=[];for(const k in KB){const p=k.split('|');arr.push({z:+p[0],ml:+p[1],e:p[2]==='1',g:p[3]==='1',n:KB[k]})}
  return JSON.stringify({k:arr,w:Math.min(30,GAT.pend.weed),d:Math.min(30,GAT.pend.wood)});
}
// must run before GUARD.tripped is set: each call passes the block while it starts
function guardLastSave(snap){
  if(!SES.token)return;
  const s=JSON.parse(snap),fail=()=>{const e=$('guardmsg');if(e)e.textContent='마지막 보상 일부는 저장하지 못했습니다.'};
  if(s.k.length)API.call('claim',s.k).catch(fail);
  if(s.w+s.d)API.call('gather',s.w,s.d).catch(fail);
}
function guardProbe(){
  if(GUARD.tripped)return;
  const snap=guardSnap();
  const t=performance.now();
  debugger;
  if(performance.now()-t>GUARD_MS)guardTrip(snap);
}
function guardTrip(snap){
  if(GUARD.tripped)return;
  try{guardLastSave(snap||guardSnap())}catch(e){}
  GUARD.tripped=true;
  clearInterval(guardTimer);
  const quiet=f=>{try{f()}catch(e){}};
  quiet(()=>{for(const k in KB)delete KB[k];KBn=0;GAT.pend.weed=GAT.pend.wood=0});   // already sent above
  quiet(()=>clearInterval(UI.tradeTimer));
  quiet(()=>NET.sb&&NET.sb.removeAllChannels());NET.on=false;NET.ch=null;   // leave the field so others are not stuck
  quiet(()=>{clearInterval(AU.tick);AU.ctx&&AU.ctx.suspend()});
  quiet(()=>{mouse.down=false;for(const k in keys)keys[k]=false;document.activeElement&&document.activeElement.blur()});
  const d=document.createElement('div');d.id='guard';
  d.innerHTML='<b>개발자 도구가 감지되었습니다</b><p>지금까지 모은 것은 저장하고, 게임을 멈췄습니다.<br>이후의 내용은 저장되지 않습니다.<br>개발자 도구를 닫은 뒤 새로고침해주세요.</p><p id="guardmsg"></p><button class="btn" id="guardgo">새로고침</button>';
  document.body.appendChild(d);
  quiet(()=>{$('guardgo').onclick=()=>location.reload()});
}
function guardStart(){if(guardTimer||GUARD.tripped)return;guardTimer=setInterval(guardProbe,GUARD_EVERY);guardProbe()}
