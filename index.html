<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14161c">
<title>리프트 온라인</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gothic+A1:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#10121a;--pn:#1c2030;--pn2:#262c3f;--bd:#383f57;--ac:#d9b05a;--ac2:#f0d283;--tx:#e8eaf0;--dim:#8f96ab;--red:#d9534f;--blu:#4a8fd9;--grn:#5fb878;--ft:'Gothic A1','Malgun Gothic','Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif;--fh:'Do Hyeon','Gothic A1','Malgun Gothic','Noto Sans CJK KR',sans-serif;
--pg:linear-gradient(180deg,#272d42 0%,#1a1e2d 100%);--gold:linear-gradient(180deg,#f3d98a 0%,#d4a843 52%,#a97a28 100%)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:var(--ft);font-size:14px;overscroll-behavior:none;touch-action:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:none}
body:not(.touch) #gl{filter:saturate(1.14) contrast(1.05)}
.hidden{display:none!important}
svg.ic{vertical-align:middle;flex:none}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#3d4560;border-radius:4px}::-webkit-scrollbar-track{background:transparent}
/* common frame */
.fr{position:relative;background:var(--pg);border:1px solid #3a4260;border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.08),inset 0 0 0 1px rgba(0,0,0,.4)}
.fr::before{content:'';position:absolute;inset:3px;border:1px solid rgba(217,176,90,.2);border-radius:7px;pointer-events:none}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.nl{position:absolute;left:0;top:0;font-size:12px;font-weight:700;padding:1px 8px;background:linear-gradient(180deg,rgba(12,14,22,.72),rgba(12,14,22,.55));border:1px solid rgba(255,255,255,.08);border-radius:9px;white-space:nowrap;text-shadow:0 1px 2px #000;will-change:transform}
.nl.st{color:var(--ac2);font-size:13px;border-color:rgba(217,176,90,.45)}
.nl.pl{color:#bcd7ff}
.ml{position:absolute;left:0;top:0;text-align:center;font-size:11px;font-weight:700;white-space:nowrap;text-shadow:-1px 0 #000,1px 0 #000,0 1px #000,0 -1px #000;will-change:transform;display:none}
.ml .mn{display:block;color:#eceff5;margin-bottom:2px}
.ml.hi .mn{color:#ff9b8b}.ml.lo .mn{color:#a2a9b4}.ml.el .mn{color:#ffd24a}
.ml .mb{display:block;width:54px;height:6px;background:#0a0b10;margin:0 auto;border-radius:3px;overflow:hidden;border:1px solid #000;box-shadow:0 0 0 1px rgba(255,255,255,.1)}
.ml .mb b{display:block;height:100%;width:100%;background:linear-gradient(180deg,#ff7a6a,#c0392b 60%,#8e2a20)}
.ml.el .mb{width:64px;box-shadow:0 0 0 1px rgba(255,210,74,.7)}
.dn{position:absolute;left:0;top:0;font-family:var(--fh);font-size:18px;color:#fff;letter-spacing:.02em;text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000,0 2px 5px rgba(0,0,0,.7);will-change:transform,opacity;pointer-events:none}
.dn.crit{color:#ffe27a;font-size:29px;text-shadow:-1.5px -1.5px 0 #5a2a00,1.5px -1.5px 0 #5a2a00,-1.5px 1.5px 0 #5a2a00,1.5px 1.5px 0 #5a2a00,0 0 14px #ff9a2a,0 0 4px #fff3b0}
.dn.hurt{color:#ff6e6e;font-size:23px}.dn.heal{color:#8af0ac}.dn.gold{color:#ffd24a;font-size:15px}.dn.info{color:#9bd6ff;font-size:17px}.dn.xp{color:#a9e6ff;font-size:14px}.dn.burn{color:#ffa45a;font-size:14px}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#hud>*{position:absolute}
#pinfo{left:12px;top:10px;width:272px;padding:8px 10px 8px 62px;min-height:66px}
#pinfo .lvb{position:absolute;left:-2px;top:-2px;width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 35% 28%,#454f78,#171b2c 72%);border:2px solid var(--ac);box-shadow:0 0 0 3px #14161f,0 0 14px rgba(217,176,90,.4),inset 0 2px 6px rgba(255,255,255,.15);display:grid;place-items:center;text-align:center;line-height:1}
#pinfo .lvb small{display:block;font-size:9px;color:var(--ac2);font-weight:700;letter-spacing:.12em}
#pinfo .lvb b{display:block;font-family:var(--fh);font-weight:400;font-size:24px;color:#fff;text-shadow:0 1px 3px #000;margin-top:-4px}
#pinfo .r1{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--fh);font-size:16px}
#pinfo .r1 small{color:var(--ac2);font-family:var(--ft);font-size:12px;font-weight:700}
.bar{position:relative;height:18px;background:#090a0f;border:1px solid #000;border-radius:9px;overflow:hidden;margin-top:4px;box-shadow:0 0 0 1px rgba(255,255,255,.1),inset 0 2px 4px rgba(0,0,0,.7)}
.bar i{position:absolute;left:0;top:0;bottom:0;display:block;border-radius:9px}
.bar::after{content:'';position:absolute;left:3px;right:3px;top:2px;height:5px;border-radius:5px;background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,0));pointer-events:none}
.bar b{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:700;text-shadow:0 1px 2px #000,0 0 3px #000;z-index:2}
#hpfill{background:linear-gradient(180deg,#f06a58,#c33a2c 55%,#8f241b);width:100%;transition:width .12s}#shfill{background:linear-gradient(180deg,rgba(170,215,255,.85),rgba(90,150,235,.75));width:0}
#xpbar{height:8px;margin-top:4px;border-radius:4px}#xpbar::after{display:none}
#xpfill{background:linear-gradient(180deg,#ffe9a0,#d9a93e 60%,#a9791f);width:0;border-radius:4px;transition:width .3s}
#xpbar::before{content:'';position:absolute;inset:0;z-index:3;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(10% - 1px),rgba(0,0,0,.55) calc(10% - 1px),rgba(0,0,0,.55) 10%);pointer-events:none}
#pinfo .r3{display:flex;justify-content:space-between;margin-top:5px;font-size:12px;color:var(--dim)}
#perkrow{pointer-events:auto;display:flex;gap:4px;margin-top:4px;flex-wrap:wrap;cursor:pointer;min-height:0}#perkrow:empty{display:none}
#perkrow .pk{font-size:10px;font-weight:700;padding:1px 5px;border-radius:7px;background:rgba(10,12,20,.6);border:1px solid rgba(255,255,255,.12);text-shadow:0 1px 2px #000;line-height:14px}
#perkrow .pkb{font-size:10px;font-weight:800;padding:1px 7px;border-radius:7px;background:linear-gradient(#f3d27a,#c79a3a);color:#2a1d05;border:0;animation:pkp .8s ease-in-out infinite;line-height:14px}
@keyframes pkp{0%,100%{opacity:1;box-shadow:0 0 12px 3px rgba(255,224,120,.95);filter:brightness(1.2)}50%{opacity:.35;box-shadow:none;filter:brightness(.8)}}
.pkc{padding:12px;border:1px solid var(--bd);border-radius:10px;background:#1b2030;margin-bottom:8px;display:flex;align-items:center;gap:12px}.pkc b{font-size:15px}.pkc .dim{font-size:12px}.pkc .btn{margin-left:auto}
#pinfo .gold{color:#ffd96a;font-weight:700;text-shadow:0 1px 2px #000}
#hud-tr{right:12px;top:10px;display:flex;flex-direction:column;align-items:flex-end;gap:7px}
#zone{padding:4px 16px 5px;font-family:var(--fh);font-size:16px;text-align:center;color:var(--ac2);letter-spacing:.04em}
#zone small{display:block;color:var(--dim);font-family:var(--ft);font-size:11px;letter-spacing:0}
#mini{width:132px;height:132px;border-radius:50%;border:3px solid #14161f;background:rgba(10,12,18,.75);box-shadow:0 0 0 2px var(--ac),0 6px 16px rgba(0,0,0,.55),inset 0 0 18px rgba(0,0,0,.6)}
#menu{display:flex;gap:6px;pointer-events:auto}
.mbtn{pointer-events:auto;cursor:pointer;width:40px;height:40px;border-radius:10px;background:var(--pg);border:1px solid #3a4260;color:var(--tx);display:grid;place-items:center;position:relative;box-shadow:0 3px 8px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.1);transition:transform .08s,border-color .15s,box-shadow .15s}
.mbtn:hover{border-color:var(--ac);box-shadow:0 0 10px rgba(217,176,90,.45),inset 0 1px 0 rgba(255,255,255,.12);transform:translateY(-1px)}
.mbtn small{position:absolute;right:3px;bottom:1px;font-size:9px;color:var(--dim);font-weight:700}
#netline{font-size:11px;color:var(--dim);background:rgba(14,16,24,.72);padding:2px 10px;border-radius:9px;border:1px solid rgba(255,255,255,.07)}
#netline i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#666;margin-right:5px}
#netline i.on{background:var(--grn);box-shadow:0 0 6px var(--grn)}
#partybox{left:12px;top:92px;display:flex;flex-direction:column;gap:5px;pointer-events:none}
.pm{width:176px;padding:4px 9px 5px;font-size:12px;border-radius:8px}
.pm::before{display:none}
.pm .b{height:6px;background:#090a0f;margin-top:3px;border-radius:3px;overflow:hidden;border:1px solid #000}.pm .b i{display:block;height:100%;background:linear-gradient(180deg,#7be0a0,#35a265)}
.pm.ld b:first-child::before{content:'°5 ';color:var(--ac2)}
#feed{left:12px;bottom:206px;display:flex;flex-direction:column;gap:3px;pointer-events:none;max-width:310px}
#feed div{font-size:12px;background:linear-gradient(90deg,rgba(12,14,22,.8),rgba(12,14,22,.35));padding:2px 10px;border-radius:3px;border-left:3px solid #888;animation:fin .25s}
@keyframes fin{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
#chat{left:12px;bottom:12px;width:340px;pointer-events:none}
#chatlog{max-height:120px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;font-size:12px;line-height:1.5;text-shadow:0 1px 2px #000}
#chatlog div{background:linear-gradient(90deg,rgba(12,14,22,.6),rgba(12,14,22,0));padding:0 8px}
#chatlog .n{color:#9fc8ff;font-weight:700}#chatlog .party .n{color:#7fe0a0}#chatlog .sys{color:var(--ac2)}
#chatin{pointer-events:auto;width:100%;margin-top:3px;background:rgba(12,14,22,.9);border:1px solid var(--bd);border-radius:6px;color:var(--tx);padding:6px 10px;font-family:var(--ft);font-size:13px;outline:none;-webkit-user-select:text;user-select:text;display:none}
#chatin.on{display:block;border-color:var(--ac);box-shadow:0 0 8px rgba(217,176,90,.3)}
#bar{left:50%;bottom:12px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:7px}
#quick,#skills{display:flex;gap:7px;pointer-events:auto}
.qs,.sk{position:relative;width:48px;height:48px;border-radius:10px;background:radial-gradient(circle at 50% 30%,#2e3550,#161a28 78%);border:2px solid #404862;display:grid;place-items:center;cursor:pointer;overflow:hidden;box-shadow:0 4px 10px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.12)}
.sk{width:60px;height:60px;border-radius:12px}#sk-f{border-color:#ff9a3a}
.qs .ct{position:absolute;right:4px;bottom:1px;font-size:12px;font-weight:700;text-shadow:-1px 0 #000,1px 0 #000,0 1px #000}
.qs .kk,.sk .kk{position:absolute;left:3px;top:2px;font-size:10px;font-weight:700;color:#cfd4e4;background:rgba(0,0,0,.55);border-radius:4px;padding:0 4px;line-height:14px;z-index:3}
.qs.off{opacity:.38}
.qs .cdm,.sk .cdm{position:absolute;inset:0;background:rgba(4,5,10,.7);transform-origin:bottom;transform:scaleY(0);z-index:2}
.sk .ic0{position:absolute;inset:0;display:grid;place-items:center;padding-bottom:8px}
.sk .cdt{position:absolute;inset:0;display:grid;place-items:center;font-size:20px;font-weight:700;text-shadow:0 1px 4px #000;z-index:4}
.sk.rdy{border-color:var(--ac);box-shadow:0 4px 10px rgba(0,0,0,.5),0 0 12px rgba(217,176,90,.35),inset 0 0 10px rgba(217,176,90,.18)}
.sk .nm{position:absolute;bottom:2px;left:0;right:0;text-align:center;font-size:9.5px;color:#c9cee0;white-space:nowrap;overflow:hidden;z-index:3;text-shadow:0 1px 2px #000}
#prompt{left:50%;bottom:158px;transform:translateX(-50%);background:var(--pg);border:1px solid var(--ac);border-radius:18px;padding:7px 20px;font-weight:700;opacity:0;transition:opacity .15s;pointer-events:none;box-shadow:0 0 14px rgba(217,176,90,.35),0 6px 16px rgba(0,0,0,.5)}
#prompt.show{opacity:1;pointer-events:auto;cursor:pointer}
#prompt kbd{background:linear-gradient(180deg,#fff,#c8ccd8);color:#111;border-radius:5px;padding:0 7px;margin-right:8px;font-family:var(--ft);font-weight:700;box-shadow:0 2px 0 #7a8094}
#vign{position:fixed;inset:0;pointer-events:none;z-index:8;background:radial-gradient(ellipse at center,transparent 55%,rgba(200,30,40,.55));opacity:0;transition:opacity .25s}
#vig2{position:fixed;inset:0;pointer-events:none;z-index:7;background:radial-gradient(ellipse at center,transparent 62%,rgba(4,5,12,.5))}
#dead{position:fixed;inset:0;z-index:20;background:radial-gradient(ellipse at center,rgba(40,0,4,.55),rgba(8,0,2,.85));display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;pointer-events:none}
#dead.on{display:flex}#dead h2{font-family:var(--fh);font-size:46px;font-weight:400;color:#f08a8a;letter-spacing:.12em;text-shadow:0 0 24px rgba(255,60,60,.5),0 3px 0 #300}#dead p{color:#b9a0a0}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:70;background:var(--pg);border:1px solid var(--ac);padding:8px 22px;border-radius:20px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;text-align:center;max-width:90vw;box-shadow:0 0 16px rgba(217,176,90,.3),0 8px 20px rgba(0,0,0,.5)}
#toast.show{opacity:1}
#invite{position:fixed;left:50%;top:110px;transform:translateX(-50%);z-index:70;background:var(--pg);border:1px solid var(--ac);padding:10px 18px;border-radius:12px;display:none;gap:10px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.55)}
#invite.on{display:flex}
/* windows */
#modalbg{position:fixed;inset:0;z-index:40;background:radial-gradient(ellipse at center,rgba(6,7,14,.45),rgba(4,5,10,.78));backdrop-filter:blur(2px);display:none;align-items:center;justify-content:center;touch-action:pan-y}
#modalbg.on{display:flex}
.win{position:relative;background:var(--pg);border:1px solid #3d4562;border-radius:12px;box-shadow:0 24px 70px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.09);width:min(720px,96vw);max-height:92vh;display:flex;flex-direction:column;overflow:hidden;animation:winin .16s ease-out}
@keyframes winin{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.win::before{content:'';position:absolute;inset:4px;border:1px solid rgba(217,176,90,.16);border-radius:9px;pointer-events:none}
.win>.hd{position:relative;display:flex;justify-content:space-between;align-items:center;padding:11px 16px;background:linear-gradient(180deg,#303756,#232943);font-family:var(--fh);font-size:20px;letter-spacing:.03em;color:var(--ac2)}
.win>.hd::after{content:'';position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,transparent,var(--ac) 30%,var(--ac) 70%,transparent)}
.win>.hd>span:first-child::before{content:'';display:inline-block;width:8px;height:8px;background:var(--ac);transform:rotate(45deg);margin-right:10px;vertical-align:middle;position:relative;top:-1px}
.win>.hd .x{cursor:pointer;width:30px;height:30px;display:grid;place-items:center;border-radius:50%;transition:background .15s}.win>.hd .x:hover{background:#454d6c}
.win>.bd{padding:14px 16px;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;-webkit-user-select:text;user-select:text}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tab{cursor:pointer;padding:6px 16px;border-radius:16px;background:#232940;border:1px solid var(--bd);font-weight:700;font-size:13px;color:#b5bbd0;transition:all .15s}.tab:hover{border-color:#5a6590}.tab.on{border-color:var(--ac);color:#2a1d06;background:var(--gold);box-shadow:0 0 10px rgba(217,176,90,.3)}
.btn{cursor:pointer;border:1px solid #7d5a1c;border-radius:7px;padding:8px 18px;font-family:var(--ft);font-weight:700;font-size:13px;color:#2a1d06;background:var(--gold);box-shadow:0 2px 0 #6b4a14,0 4px 8px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.55);text-shadow:0 1px 0 rgba(255,255,255,.35);transition:filter .12s,transform .06s}
.btn:hover{filter:brightness(1.1)}.btn:active{transform:translateY(2px);box-shadow:0 0 0 #6b4a14,inset 0 1px 0 rgba(255,255,255,.4)}
.btn.sec{background:linear-gradient(180deg,#3a4262,#283050);border-color:#4a5578;color:var(--tx);box-shadow:0 2px 0 #181c2c,0 4px 8px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.14);text-shadow:none}.btn.red{background:linear-gradient(180deg,#d06058,#9a322d);border-color:#6a1f1c;color:#fff;box-shadow:0 2px 0 #5a1a17,0 4px 8px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.3);text-shadow:none}
.btn.sm{padding:4px 12px;font-size:12px;border-radius:6px}.btn[disabled]{opacity:.4;cursor:not-allowed;filter:grayscale(.4)}
.row{display:flex;gap:8px;align-items:center}.row.sp{justify-content:space-between}.row.wrap{flex-wrap:wrap}
.grid{display:grid;gap:7px}
.card{background:linear-gradient(180deg,#2a3048,#222840);border:1px solid #3a4260;border-radius:8px;padding:10px 12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.item{display:flex;align-items:center;gap:11px;background:linear-gradient(90deg,#2b3149,#242a40);border:1px solid #3a4260;border-left:3px solid var(--tc,#3a4260);border-radius:8px;padding:6px 11px 6px 8px;cursor:pointer;transition:border-color .12s,background .12s}
.item:hover{border-color:#5d6890;border-left-color:var(--tc,#5d6890);background:linear-gradient(90deg,#323a56,#292f48)}.item.sel{position:relative;border-color:var(--ac);border-left-color:var(--tc,var(--ac));background:linear-gradient(90deg,#4a4130,#35301f);box-shadow:0 0 12px rgba(217,176,90,.45),inset 0 0 0 1px var(--ac)}.item.sel::after{content:'✓';position:absolute;top:4px;right:8px;color:var(--ac);font-weight:700;font-size:15px}.item.eq{box-shadow:inset 0 0 0 1px rgba(217,176,90,.35)}
.ico{width:42px;height:42px;border-radius:9px;display:grid;place-items:center;flex:none;background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--tc,#6b7390) 38%,#1a1e2e),#12151f 78%);border:1px solid color-mix(in srgb,var(--tc,#6b7390) 70%,#000);box-shadow:inset 0 0 10px color-mix(in srgb,var(--tc,#6b7390) 35%,transparent),0 2px 5px rgba(0,0,0,.4)}
.item .nm{font-weight:700}.item .sub{font-size:11.5px;color:var(--dim)}.item .rt{margin-left:auto;text-align:right;font-size:12px}
.gold{color:#ffd96a}.dim{color:var(--dim)}.red{color:#ff7a70}.grn{color:#86e8a8}
.ench{display:inline-block;font-size:11px;padding:0 6px;border-radius:9px;background:#313955;border:1px solid #4a5578;margin-right:3px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.list{display:flex;flex-direction:column;gap:6px;max-height:48vh;overflow:auto;touch-action:pan-y;padding-right:2px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}.kv span:nth-child(odd){color:var(--dim)}
hr{border:0;height:1px;background:linear-gradient(90deg,transparent,#454d6c,transparent);margin:10px 0}
input.tx,select.tx{background:#0d0f17;border:1px solid var(--bd);border-radius:7px;color:var(--tx);padding:9px 12px;font-family:var(--ft);font-size:14px;outline:none;width:100%;-webkit-user-select:text;user-select:text;box-shadow:inset 0 2px 5px rgba(0,0,0,.5);transition:border-color .15s,box-shadow .15s}
input.tx:focus{border-color:var(--ac);box-shadow:inset 0 2px 5px rgba(0,0,0,.5),0 0 10px rgba(217,176,90,.3)}
/* login */
.cover{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:16px}
.cover.hidden{display:none}
#loading{z-index:90;background:radial-gradient(ellipse at 50% 40%,#232a44,#0b0d15 75%)}
#start{z-index:55;background:radial-gradient(ellipse at center,rgba(7,9,15,.35),rgba(7,9,15,.82))}
.cover .eyebrow{font-size:12px;letter-spacing:.42em;color:var(--ac);font-weight:700}

const TAU=Math.PI*2;

const rnd=(a,b)=>a+Math.random()*(b-a);

function animHero(o,t,spd,atkP,dashing,swingDir){
  const run=Math.min(1,spd),sw=Math.sin(t*13)*.85*run;
  o.legL.rotation.x=sw;o.legR.rotation.x=-sw;
  o.body.position.y=Math.abs(Math.sin(t*13))*.13*run+Math.sin(t*2.4)*.025*(1-run);
  o.body.rotation.x=dashing?.55:run*.1;
  const sd=swingDir||1;
  if(o.ak==='m'){
    o.armL.rotation.x=-.5-sw*.35;o.armL.rotation.z=.05;
    if(atkP>=0){const k=easeOut(atkP);o.armR.rotation.x=lerp(-2.6,.4,k);o.armR.rotation.z=lerp(-.5*sd,.3*sd,k);o.torso.rotation.y=lerp(.7*sd,-.7*sd,k)}
    else{o.armR.rotation.x=-.3-sw*.5;o.armR.rotation.z=0;o.torso.rotation.y*=.85}
  }else if(o.ak==='c'){
    o.armL.rotation.x=-.4-sw*.4;o.armL.rotation.z=.1;
    if(atkP>=0){const k=Math.sin(atkP*Math.PI);o.armR.rotation.x=-1.0-k*.9;o.torso.rotation.y=-k*.3}
    else{o.armR.rotation.x=-.35-sw*.4;o.torso.rotation.y*=.85}
    if(o.orb){o.orb.rotation.y=t*2;const s=1+Math.sin(t*5)*.08;o.orbGlow.scale.set(1.9*s,1.9*s,1)}
    if(o.wisps)o.wisps.forEach((w,i)=>{const a=t*1.6+i*3.14;w.position.set(Math.cos(a)*.95,1.9+Math.sin(t*2.4+i)*.18,Math.sin(a)*.95)});
  }else{
    if(atkP>=0){const k=atkP;o.armL.rotation.x=-1.55;o.armR.rotation.x=lerp(-1.7,-.5,easeOut(k));o.armR.rotation.z=lerp(.5,.1,k);o.torso.rotation.y=-.35}
    else{o.armL.rotation.x=-.6-sw*.3;o.armR.rotation.x=-.2-sw*.5;o.armR.rotation.z=0;o.torso.rotation.y*=.85}
  }
}

/* body aura for the top weapon grades: 7 storm (lightning), 8 eternity (gyro rings + clock), 9 celestial (halo + wings) */
const AUKIND={7:'storm',8:'eternity',9:'celestial'};
const AUMAT={};
const aumat=(c,op)=>AUMAT[c+'_'+op]||(AUMAT[c+'_'+op]=new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:op,depthWrite:false,side:THREE.DoubleSide}));
let WINDTEX=null;
/* three crescent wind streaks: thin faded tail -> thick bright head */
function windTex(){
  if(WINDTEX)return WINDTEX;
  const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');
  if(x&&x.arc){
    x.lineCap='round';
    for(let k=0;k<3;k++)for(let i=0;i<34;i++){const u=i/33,a=k*TAU/3+u*1.75,r=90+u*22;
      for(const[col,w]of[['40,190,185',17],['235,255,255',7]]){x.strokeStyle='rgba('+col+','+(u*u*.9+.05).toFixed(2)+')';x.lineWidth=1+w*Math.sin(Math.min(1,u*.93)*Math.PI*.62);x.beginPath();x.arc(128,128,r,a,a+.075);x.stroke()}}
  }
  return WINDTEX=new THREE.CanvasTexture(c);
}
function auraBuild(kind){
  const g=new THREE.Group(),add=(geo,mat,x,y,z,p)=>mesh(geo,mat,x,y,z,p||g,false);
  const halo=(c,y,sz,op)=>{const s=glow(c,sz,op);s.position.set(0,y,0);g.add(s)};
  let anim;
  if(kind==='storm'){
    /* whirlwind: stacked spinning wind streaks widening upward, with leaves carried up around the body */
    const wm=new THREE.MeshBasicMaterial({map:windTex(),transparent:true,depthWrite:false,side:THREE.DoubleSide});
    const disc=new THREE.PlaneGeometry(1,1);
    const layers=[[.2,2.5],[.85,2.9],[1.55,3.3]].map(([y,d],i)=>{const w=new THREE.Group();w.position.y=y;g.add(w);const m=add(disc,wm,0,0,0,w);m.rotation.x=-Math.PI/2;m.scale.set(d,d,1);return w});
    const leafM=[aumat(0x8ff0c0,.95),aumat(0xeaffff,.95)],leaf=new THREE.OctahedronGeometry(.13,0);
    const leaves=[0,1,2,3,4,5,6,7].map(i=>{const m=add(leaf,leafM[i%2],0,0,0);m.scale.set(1.3,.18,.6);return m});
    anim=t=>{
      layers.forEach((w,i)=>{w.rotation.y=-t*(5.2-i*.9)-i*1.3;w.position.y=[.2,.85,1.55][i]+Math.sin(t*3+i*2)*.08});
      leaves.forEach((m,i)=>{const k=(t*.6+i/8)%1,a=t*4.2+i*2.4,r=.7+k*.9;m.position.set(Math.cos(a)*r,.15+k*2.1,Math.sin(a)*r);m.rotation.set(t*5+i,-a,t*3)});
    };
  }else if(kind==='eternity'){
    const pink=aumat(0xe45cff,.9),deep=aumat(0x7a2fd0,.85),pale=aumat(0xffd6ff,.95),bead=new THREE.OctahedronGeometry(.14,0);
    const rings=[0,1].map(i=>{const tilt=new THREE.Group();tilt.position.y=1.2;tilt.rotation.z=i?-.55:.55;g.add(tilt);const sp=new THREE.Group();tilt.add(sp);tilt.scale.setScalar(.72);
      add(new THREE.TorusGeometry(1.35+i*.2,.065,4,40),i?deep:pink,0,0,0,sp).rotation.x=Math.PI/2;
      add(bead,pale,1.35+i*.2,0,0,sp).scale.setScalar(1.5);add(bead,pale,-1.35-i*.2,0,0,sp).scale.setScalar(1.5);return sp});
    const clock=new THREE.Group();clock.position.set(0,1.85,-.75);clock.rotation.x=-.8;clock.scale.setScalar(.9);g.add(clock);
    add(new THREE.TorusGeometry(.92,.08,4,36),pink,0,0,0,clock);add(new THREE.TorusGeometry(.72,.015,4,32),deep,0,0,0,clock);
    const tick=new THREE.BoxGeometry(.08,.19,.04);
    for(let i=0;i<12;i++){const a=i/12*TAU;add(tick,pale,Math.sin(a)*.82,Math.cos(a)*.82,0,clock).rotation.z=-a}
    const hands=[.68,.46].map(l=>{const h=new THREE.Group();clock.add(h);add(new THREE.BoxGeometry(.09,l,.04),pale,0,l/2,0,h);return h});
    halo(0xb04cff,1.2,3.2,.45);
    anim=t=>{rings[0].rotation.y=t*1.5;rings[1].rotation.y=-t*1.1;hands[0].rotation.z=-t*2.4;hands[1].rotation.z=-t*.35;clock.position.y=1.85+Math.sin(t*1.3)*.07};
  }else{
    const gold=aumat(0xffc21a,1),white=aumat(0xfffbe8,.95),soft=aumat(0xffd24a,.95);
    const crown=new THREE.Group();crown.position.y=2.85;g.add(crown);
    add(new THREE.TorusGeometry(.6,.1,6,28),gold,0,0,0,crown).rotation.x=Math.PI/2;
    const ray=new THREE.ConeGeometry(.05,.24,4);
    for(let i=0;i<8;i++){const a=i/8*TAU,m=add(ray,white,Math.cos(a)*.84,0,Math.sin(a)*.84,crown);m.rotation.set(0,-a,-Math.PI/2)}
    const feather=new THREE.ConeGeometry(.13,1,4);
    const wings=[-1,1].map(sd=>{const w=new THREE.Group();w.position.set(sd*.2,1.7,-.5);w.rotation.x=-1.3;w.scale.setScalar(1.15);g.add(w);
      for(let i=0;i<6;i++){const a=1.25-i*.34,l=1.45-i*.1,f=add(feather,i%2?gold:soft,sd*Math.cos(a)*l/2,Math.sin(a)*l/2,-i*.012,w);f.scale.set(1.8,l,.22);f.rotation.z=sd*(a-Math.PI/2)}
      return w});
    const mote=new THREE.OctahedronGeometry(.13,0),motes=[];
    for(let i=0;i<7;i++)motes.push(add(mote,i%2?gold:white,0,0,0));
    halo(0xffb820,1.4,5,.6);
    anim=t=>{
      crown.rotation.y=t*.9;crown.position.y=2.85+Math.sin(t*2)*.06;
      wings.forEach((w,i)=>{w.rotation.y=(i?1:-1)*(.22+Math.sin(t*2.2)*.22)});
      motes.forEach((m,i)=>{const k=(t*.42+i/7)%1,a=i*2.4+t*.8;m.position.set(Math.cos(a)*(1-k*.4),.1+k*2.9,Math.sin(a)*(1-k*.4));m.scale.setScalar(Math.sin(k*Math.PI)+.15);m.rotation.y=t*3});
    };
  }
  anim(0);return{kind,g,anim};
}
function auraApply(o,t){
  const kind=AUKIND[t]||null;
  if(o.wau&&o.wau.kind===kind)return;
  if(o.wau){o.g.remove(o.wau.g);o.wau=null}
  if(kind&&o.g){o.wau=auraBuild(kind);o.g.add(o.wau.g)}
}

/* ---------------- balance mode (setting save.balance, default off): low-end PC option, target 60 fps ----------------
   The world is built exactly as before: same random sequence, same obstacles, same gather nodes.
   Balance mode only changes how it is drawn, in four steps (all run once after buildWorld):
   1. flowers are not created (their random numbers are still drawn, so the layout stays identical);
   2. static props (houses, gates, stalls, torches, fountain, rocks...) are merged per material and 40-unit cell;
      NPC models, glow sprites and the animated gems/emblem stay as they are;
   3. instanced decor is split into 20-unit chunks; gather nodes are re-pointed to the chunk holding their instance;
   4. every frame, a chunk or prop is drawn only if its box is inside the view frustum and within BAL.rd of the camera.
      Shadow casters just off-screen are still drawn, so shadows near the view do not pop.
   Post-processing (bloom, grade) is off and the shadow map is 1024 instead of 1536; pixel ratio is capped at 1. */
const BAL={rd:70,gd:42,nd:26,sn:2,keep:20,cell:24,dcell:10,mcell:40,macro:96,big:150,pad:.5};   // rd: far limit · gd: grass limit (blades shrink away) · nd: mob outlines hidden beyond · sn: shadow map refreshed every sn frames
/* adaptive quality: the game watches its own frame time and steps between 4 levels so a slow PC settles near 60 fps */
const BQ={lv:0,acc:0,n:0,upAt:0,downAt:0,f:0,hold:[0,0,0,0],
  L:[{pr:1,rd:70,gd:42,nd:26,sn:2},{pr:1,rd:58,gd:34,nd:22,sn:2},{pr:.85,rd:50,gd:30,nd:20,sn:3},{pr:.72,rd:42,gd:26,nd:16,sn:3}]};
function balApply(lv){
  BQ.lv=lv;const q=BQ.L[lv];BAL.rd=q.rd;BAL.gd=q.gd;BAL.nd=q.nd;BAL.sn=q.sn;
  GRASS_U.uFade.value.set(q.gd-10,q.gd);
  if(Math.abs(renderer.getPixelRatio()-q.pr)>.01){renderer.setPixelRatio(q.pr);try{resize()}catch(e){}}
}
function balAdapt(ms){
  if(!balOn()||G.mode!=='play'||document.hidden||ms>400)return;   // hitches (tab switch, loading) are not a quality signal
  BQ.acc+=Math.min(ms,100);if(++BQ.n<(ms>60?20:60))return;
  const avg=BQ.acc/BQ.n,now=performance.now();BQ.acc=0;BQ.n=0;
  if(avg>19.5&&BQ.lv<BQ.L.length-1){if(now-BQ.upAt<12000)BQ.hold[BQ.lv]=now+60000;BQ.downAt=now;balApply(BQ.lv+1)}   // slower than ~51 fps: lighten
  else if(avg<17.4&&BQ.lv>0&&now>BQ.hold[BQ.lv-1]&&now-BQ.downAt>10000){BQ.upAt=now;balApply(BQ.lv-1)}              // comfortably 60: try heavier again
}

function balOn(){return !!save.balance}
/* renderer-level settings that follow the balance flag (no reload needed) */
function applyGfxMode(){
  const on=balOn();
  renderer.setPixelRatio(on?BQ.L[BQ.lv].pr:Math.min(window.devicePixelRatio||1,IS_TOUCH?1.5:1.75));
  const want=on?1024:1536;
  if(sun.shadow.mapSize.x!==want){sun.shadow.mapSize.set(want,want);if(sun.shadow.map){sun.shadow.map.dispose();sun.shadow.map=null}}
  const ty=on?THREE.PCFShadowMap:THREE.PCFSoftShadowMap;       // hard-edged PCF is clearly cheaper on integrated GPUs
  if(renderer.shadowMap.type!==ty){renderer.shadowMap.type=ty;scene.traverse(o=>{if(o.material)[].concat(o.material).forEach(m=>{m.needsUpdate=true})})}
  renderer.shadowMap.autoUpdate=!on;                            // balance mode refreshes the shadow map every BAL.sn frames (see balCull)
  if(on)balApply(BQ.lv);else{BAL.rd=70;GRASS_U.uFade.value.set(1e5,1e5+1)}

/* called at the end of buildWorld */

  for(const n of WORLD.npcs)n.model.g.traverse(c=>{if(c.isMesh)c.castShadow=false});   // vendor NPCs keep their model, only the shadow pass skips them
  renderer.shadowMap.needsUpdate=true;

/* the ground is one 48k-vertex mesh; split its triangles into 60-unit tiles (same vertices, colours and triangles) so far tiles can be culled */
function balSplitGround(){
  const gm=worldG.children.find(o=>o.isMesh&&!o.isInstancedMesh&&o.geometry.index&&o.geometry.attributes.color&&o.geometry.attributes.position.count>40000);
  if(!gm)return;

  const size=(WORLD_R+14)*2;

/* ----- basic attack ----- */

    if(arc<TAU-.1){const a=Math.atan2(dx,dz);if(Math.abs(angDiff(f,a))>arc/2+Math.atan2(e.r,Math.max(dist,.1)))continue}
    dealMob(e,dmg,Object.assign({kx:dx/(dist||1),kz:dz/(dist||1),kb},opt||{}));n++;
  }

}

function tpSpot(x,z){

  entG.add(disc);entG.add(fill);entG.add(ring);sfx('tele');
  addFx(dur,k=>{const s=Math.max(.01,r*k);fill.scale.set(s,s,s);ring.material.opacity=.55+.4*Math.sin(k*28)},()=>{entG.remove(disc);entG.remove(fill);entG.remove(ring);disc.material.dispose();fill.material.dispose();ring.material.dispose();if(cb)cb()});

function boltFx(x1,z1,x2,z2,hex){

  for(let i=1;i<n;i++){const k=i/n;pts.push({x:lerp(x1,x2,k)+rnd(-.9,.9),z:lerp(z1,z2,k)+rnd(-.9,.9)})}pts.push({x:x2,z:z2});
  const ms=[];
  for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1],dx=b.x-a.x,dz=b.z-a.z,l=Math.hypot(dx,dz)||.1;const m=new THREE.Mesh(GEO.line,flatMat(hex||0xfff2a0,.95));m.position.set((a.x+b.x)/2,1.3,(a.z+b.z)/2);m.rotation.y=Math.atan2(dx,dz);m.scale.set(.16,.16,l);entG.add(m);ms.push(m)}
  addFx(.18,k=>{ms.forEach(m=>m.material.opacity=.95*(1-k))},()=>ms.forEach(m=>{entG.remove(m);m.material.dispose()}));

/* ---------------- damage to monsters ---------------- */
function freezeMob(m,t){if(m.duel){duelStunOut(t);return}if(m.ghost){netSendHit(m,0,{fz:t});return}m.freeze=Math.max(m.freeze||0,m.elite?t*.5:t)}
function burnMob(m,dps){if(m.duel){duelBurnOut(dps);return}if(m.ghost){netSendHit(m,0,{bn:dps});return}m.burnT=3;m.burnD=Math.max(m.burnD||0,dps)}
function dealMob(m,base,o){
  if(m.dead)return;o=o||{};
  const crit=o.crit!==undefined?o.crit:Math.random()<S.crit;
  const d=Math.max(1,Math.round(base*(crit?S.critDmg:1)*(.92+Math.random()*.16)));
  dmgNum(m.x,m.r*1.5+1.2,m.z,fmtN(d),crit?'crit':'');
  const mat=m.def&&m.def.mat||'flesh',heavy=!!o.big||base>S.atk*2.2,kxn=o.kx||0,kzn=o.kz||0,ic=crit?0xffd24a:0xfff4e0;
  if(crit){sfx('crit');sfx('hit_'+mat,.8);sfx('sparkle')}else sfx('hit_'+mat);
  if(heavy)sfx('bigHit',.8);
  burst(m.x,1.2,m.z,crit?12:4,crit?0xffd24a:0xffffff,5,.35,10);m.flash=.09;m.pop=1;
  impactFlash(m.x-(kxn?kxn/(Math.hypot(kxn,kzn)||1)*m.r*.6:0),1.3,m.z-(kzn?kzn/(Math.hypot(kxn,kzn)||1)*m.r*.6:0),ic,crit?3.4:heavy?3:2.1,crit?.2:.15);
  if(kxn||kzn){hitSparks(m.x,1.3,m.z,kxn,kzn,ic,crit?9:heavy?7:4,crit?11:8);camKick(kxn,kzn,crit?.2:heavy?.26:.07)}
  if(crit){shockRing(m.x,m.z,2.1,0xffd24a,.24);burst(m.x,1.5,m.z,6,0xfff3b0,9,.3,4,.2);cam.shake=Math.max(cam.shake,.28);hitStop(.04)}else cam.shake=Math.max(cam.shake,heavy?.2:.06);
  if(heavy)hitStop(.055);
  const kk={kx:o.kx||0,kz:o.kz||0,kb:o.noKb?0:(o.kb||0)};
  if(m.duel){duelHitOut(m,d);if(kk.kb)duelPushOut(kk.kx,kk.kz,kk.kb*.22);return}
  if(m.ghost){m.hp=Math.max(1,m.hp-d);netSendHit(m,d,kk)}
  else applyMobDmg(m,d,kk,SES.name);
  if(S.vamp&&!o.noProc){P.vampAcc+=d*S.vamp;if(P.vampAcc>=1){const v=Math.floor(P.vampAcc);P.vampAcc-=v;P.hp=Math.min(S.maxHp,P.hp+v)}}
  if(o.noProc)return;
  if(S.burnLv>0)burnMob(m,effAtk()*.25*S.burnLv);
  if(S.chainP>0&&Math.random()<S.chainP){
    let n=0,px=m.x,pz=m.z;const used=new Set([m]);
    for(const q of MOBS){if(n>=2)break;if(q.dead||q.spawning||used.has(q))continue;if(d2(q.x,q.z,m.x,m.z)<81){used.add(q);boltFx(px,pz,q.x,q.z);dealMob(q,base*.6,{noProc:true,noKb:true});px=q.x;pz=q.z;n++}}
  }
  if(S.explP>0&&Math.random()<S.explP)explodeAt(m.x,m.z,3.2,base*.5,0xff9a3a);
  if(P.hb)holyProc(m,base);
}

function spawnPB(o){

function orbBoom(b,primary){

    if(e===primary)dealMob(e,b.dmg,{kx:b.vx,kz:b.vz,kb:3});

function updatePB(dt){
  for(let i=PB.length-1;i>=0;i--){
    const b=PB[i];b.life-=dt;b.t+=dt;b.x+=b.vx*dt;b.z+=b.vz*dt;b.m.position.x=b.x;b.m.position.z=b.z;
    if(b.kind==='orb'){emit(b.x,1.3,b.z,rnd(-.5,.5),rnd(-.5,.5),rnd(-.5,.5),.35,b.col,0);b.m.scale.setScalar(1+Math.sin(b.t*30)*.1)}
    else if(Math.random()<.5)emit(b.x,1.3,b.z,0,0,0,.2,b.col,0);
    let dead=false;
    for(const e of MOBS){
      if(e.dead||e.spawning||b.hit.indexOf(e)>=0)continue;
      const rr=e.r+b.r;if(d2(e.x,e.z,b.x,b.z)<rr*rr){

        dealMob(e,b.dmg,{kx:b.vx,kz:b.vz,kb:3});if(b.freeze)freezeMob(e,b.freeze);if(b.el)elemHit(e,b.el,b.eatk);b.hit.push(e);b.pierce--;if(b.pierce<=0){dead=true;break}
      }

    if(dead){entG.remove(b.m);PB.splice(i,1)}

const KB={};let KBn=0,KBt=0,claiming=false;
function registerKill(m){
  /* elite-only dungeons: an elite counts as 3 normal kills, so rewards stay about what the old crowds gave */
  const eo=m.elite&&DG.on&&DGDEF[DG.id].elite,el=m.elite&&!eo,w=eo?3:1;
  const k=m.zid+'|'+m.ml+'|'+(el?1:0)+'|'+(m.golden?1:0);KB[k]=(KB[k]||0)+w;KBn+=w;KBt=Math.max(KBt,0);comboHit(m);
  if(m.golden){UI.feedText('황금 슬라임 처치! 골드가 쏟아집니다','#ffd24a');shockRing(m.x,m.z,5,0xffd24a,.6);for(let i=0;i<40;i++)emit(m.x,1,m.z,rnd(-7,7),rnd(5,13),rnd(-7,7),1.1,0xffd24a,22);sfx('level')}
  const gold=Math.floor((2+m.ml*1.6)*(el?5:1))*w,xp=(6+m.ml*4)*(el?6:1)*w;
  dmgNum(m.x,m.r*1.5+2.2,m.z,'+'+fmtN(xp)+' XP','xp');
  const n=Math.min(8,Math.ceil(gold/6));for(let i=0;i<n;i++)emit(m.x,1,m.z,rnd(-4,4),rnd(4,9),rnd(-4,4),.8,0xffd24a,22);
  if(KBn>=12)flushKills();
}
async function flushKills(){
  if(claiming||!KBn||!SES.token)return;
  const arr=[];for(const k in KB){const p=k.split('|');arr.push({z:+p[0],ml:+p[1],e:p[2]==='1',g:p[3]==='1',n:KB[k]})}
  for(const k in KB)delete KB[k];KBn=0;claiming=true;KBt=0;
  const before=SES.pf.level;
  try{
    const r=await API.call('claim',arr);
    if(r.gold)dmgNum(P.x,2.6,P.z,'+'+fmtN(r.gold)+' G','gold');
    for(const d of r.drops||[])UI.feed(d);
    if(SES.pf.level>before)onLevelUp();
    UI.refreshHud();UI.afterProfile&&UI.afterProfile();
  }catch(e){UI.toast(errKo(e.message))}
  claiming=false;
}
function onLevelUp(){
  derive();P.hp=S.maxHp;sfx('level');dmgNum(P.x,3.8,P.z,'LEVEL UP','info');shockRing(P.x,P.z,5,0xffe27a,.6);shockRing(P.x,P.z,9,0xfff3b0,.9);pillar(P.x,P.z,0xffe27a,12,.8);burst(P.x,1,P.z,40,0xffe27a,9,1,2);flashDisc(P.x,P.z,4,0xffe27a,.5);cam.shake=Math.max(cam.shake,.3);
  UI.feedText('레벨 '+SES.pf.level+' 달성','#ffe27a');netSys('lv',SES.pf.level);netPresence();
  UI.refreshHud();if(UI.refreshTouch)UI.refreshTouch();if(SES.pf.level===MAXLV)UI.toast('만렙 달성! 궁극기 해금: '+ULT[SES.pf.cls].name+' (F)');

/* ---------- authority helpers ---------- */

}

/* ---------- damage application (authority) ---------- */
function applyMobDmg(m,d,kk,by){
  if(m.dead||m.spawning)return;
  if(m.dg){const w=by||SES.name;DG.dmg[w]=(DG.dmg[w]||0)+Math.max(0,Math.min(d,m.hp))}
  m.hp-=d;m.flash=.09;m.aggro=by||null;
  if(kk&&(kk.kx||kk.kz)){const l=Math.hypot(kk.kx,kk.kz)||1;m.lx=kk.kx/l;m.lz=kk.kz/l}
  if(kk&&kk.kb){const l=Math.hypot(kk.kx,kk.kz)||1,res=m.elite?.3:1;m.kx+=kk.kx/l*kk.kb*res*1.6;m.kz+=kk.kz/l*kk.kb*res*1.6}
  if(m.hp<=0)killMob(m);
}
function killMob(m){
  if(m.dead)return;m.dead=true;retire(m,m.elite?.5:.28);
  sfxAt(m.elite?'die_big':(m.def.mat==='slime'||m.type==='bomber')?'pop':'die',m.x,m.z);if(m.elite)hitStop(.09);
  burst(m.x,1.2,m.z,m.elite?44:14,m.def.col,8,.7,8);burst(m.x,1.2,m.z,6,0xffffff,5,.4,6);flashDisc(m.x,m.z,m.r*1.6,m.def.col,.3);shockRing(m.x,m.z,m.r*2.4,m.def.col,.3);
  if(m.elite){shockRing(m.x,m.z,6,0xffd24a,.6);cam.shake=Math.max(cam.shake,.5);sfx('boom')}
  if(!P.dead||true){if(d2(m.x,m.z,P.x,P.z)<55*55)registerKill(m)}
  if(typeof netKill==='function')netKill(m);
}
function netApplyHit(h){ // member -> authority
  const m=MOBS.find(q=>q.id===h.id&&!q.ghost);if(!m||m.dead)return;
  if(h.d>0)applyMobDmg(m,h.d,{kx:h.kx||0,kz:h.kz||0,kb:h.kb||0},h.by);
  if(h.fz)m.freeze=Math.max(m.freeze,m.elite?h.fz*.5:h.fz);
  if(h.bn){m.burnT=3;m.burnD=Math.max(m.burnD,h.bn)}
}

/* ---------- AI ---------- */
function nearestT(m,T){let b=null,bd=1e9;for(const t of T){const d=d2(m.x,m.z,t.x,t.z)*(t.pull||1);if(d<bd){bd=d;b=t}}return b?{t:b,d:Math.sqrt(d2(m.x,m.z,b.x,b.z))}:null}
function stepM(m,dx,dz,sp,dt){m.x+=dx*sp*dt;m.z+=dz*sp*dt}
function faceM(m,dx,dz,dt,rate){m.face=lerpAng(m.face,Math.atan2(dx,dz),1-Math.exp(-dt*(rate||10)))}
function updateMobAuth(m,dt,T){
  m.age+=dt;m.hitCd-=dt;m.cd-=dt;if(m.flash>0)m.flash-=dt;
  if(m.golden&&m.age>42){removeMob(m,true);UI.feedText('황금 슬라임이 도망쳤습니다','#9aa0b8');return}
  if(m.spawning){m.sp-=dt;if(m.sp<=0)m.spawning=false}
  if(m.burnT>0){m.burnT-=dt;m.burnTick-=dt;if(m.burnTick<=0){m.burnTick=.5;m.hp-=m.burnD*.5;m.flash=.05;dmgNum(m.x,m.r*1.5+1.2,m.z,fmtN(m.burnD*.5),'burn');if(m.hp<=0){killMob(m);return}}
    if(Math.random()<dt*14)emit(m.x+rnd(-.4,.4),rnd(.5,1.8),m.z+rnd(-.4,.4),0,2,0,.5,0xff7a2a,0)}
  m.x+=m.kx*dt;m.z+=m.kz*dt;const kd=Math.pow(.0008,dt);m.kx*=kd;m.kz*=kd;
  let sp=1;

      m.wt-=dt;if(m.wt<=0){m.wt=rnd(1.5,3.5);const a=rnd(0,TAU);m.wx=Math.cos(a);m.wz=Math.sin(a);if(Math.random()<.4){m.wx=0;m.wz=0}}
      if(m.wx||m.wz){stepM(m,m.wx,m.wz,m.spd*.35,dt);faceM(m,m.wx,m.wz,dt,6);m.moving=true}
    }
  }
  if(!m.fly||m.dg)pushOut(m,m.r*.7);
  if(m.dg)return;
  const d=Math.hypot(m.x,m.z);if(d<20.5){const k=20.5/(d||1);m.x*=k;m.z*=k}
  if(d>WORLD_R-2){m.x*=(WORLD_R-2)/d;m.z*=(WORLD_R-2)/d}
}
function castPattern(m,c,t){
  const an=Math.atan2(t.x-m.x,t.z-m.z);
  if(c.kind==='fan'){for(const k of[-.3,0,.3])emitEvent({t:'b',x:m.x+Math.sin(an+k),z:m.z+Math.cos(an+k),a:an+k,s:11,d:m.dmg*.8,c:c.col,l:3})}
  else if(c.kind==='nova'){const n=10,o=m.age;for(let i=0;i<n;i++){const a=i/n*TAU+o;emitEvent({t:'b',x:m.x+Math.sin(a),z:m.z+Math.cos(a),a,s:8,d:m.dmg*.7,c:c.col,l:2.6})}}

  else if(c.kind==='rain'){for(let i=0;i<4;i++)emitEvent({t:'x',x:t.x+(i?rnd(-5,5):0),z:t.z+(i?rnd(-5,5):0),r:2.3,w:.9+i*.18,d:m.dmg,c:c.col})}
}
function aiMob(m,dt,nt,sp){
  const t=nt.t,d=nt.d,dx=(t.x-m.x)/(d||1),dz=(t.z-m.z)/(d||1);
  switch(m.type){
    case 'slime':{
      if(m.hop===undefined)m.hop=0;
      if(m.cd<=0){m.cd=rnd(1,1.5);m.hop=.38}
      if(m.hop>0){m.hop-=dt;if(m.golden){stepM(m,-dx,-dz,m.spd*2.2,dt);faceM(m,-dx,-dz,dt,14)}else{stepM(m,dx,dz,m.spd*2.7,dt);faceM(m,dx,dz,dt,14)}m.moving=true}
      break}
    case 'bat':{
      if(m.state==='chase'){const an=Math.atan2(dx,dz)+Math.sin(m.age*3.2+m.ph)*.85;stepM(m,Math.sin(an),Math.cos(an),m.spd,dt);faceM(m,Math.sin(an),Math.cos(an),dt,12);m.moving=true;
        if(m.cd<=0){m.state='dive';m.st=.75;m.cd=rnd(2.4,3.6)}}
      else if(m.state==='dive'){m.st-=dt;m.warn=m.st>.5;faceM(m,dx,dz,dt,16);stepM(m,dx,dz,m.spd*(m.st>.5?.2:2.1),dt);m.moving=true;if(m.st<=0){m.state='chase';m.warn=false}}
      else{m.st-=dt;stepM(m,-dx,-dz,m.spd*1.1,dt);m.moving=true;if(m.st<=0)m.state='chase'}
      break}
    case 'skel':{
      if(m.state==='chase'){faceM(m,dx,dz,dt);if(d>1.9){stepM(m,dx,dz,m.spd,dt);m.moving=true}else{m.state='wind';m.st=.55;m.warn=true}}
      else if(m.state==='wind'){m.st-=dt;faceM(m,dx,dz,dt,6);
        if(m.st<=0){m.warn=false;emitEvent({t:'s',x:m.x,z:m.z,f:m.face,r:2.7,a:1.7,d:m.dmg});m.state='rec';m.st=.8}}
      else{m.st-=dt;if(m.st<=0)m.state='chase'}
      break}
    case 'archer':{
      faceM(m,dx,dz,dt,12);
      if(m.state==='wind'){m.st-=dt;m.warn=true;
        if(m.st<=0){m.warn=false;const an=Math.atan2(t.x-m.x,t.z-m.z);emitEvent({t:'b',x:m.x+Math.sin(an),z:m.z+Math.cos(an),a:an,s:12.5,d:m.dmg,c:0xc9b6ff,l:3});m.state='move';m.cd=rnd(2,2.8)}}
      else{let mvv=0;if(d<8)mvv=-1;else if(d>13)mvv=1;
        if(mvv){stepM(m,dx*mvv,dz*mvv,m.spd,dt);m.moving=true}else{stepM(m,-dz*m.strafe,dx*m.strafe,m.spd*.55,dt);m.moving=true}
        if(m.cd<=0&&d<18){m.state='wind';m.st=.45}}
      break}
    case 'bomber':{
      if(m.state==='chase'){faceM(m,dx,dz,dt,14);stepM(m,dx,dz,m.spd,dt);m.moving=true;if(d<2.8){m.state='fuse';m.st=.85;m.warn=true;emitEvent({t:'x',x:m.x,z:m.z,r:4,w:.85,d:m.dmg,c:0xff5a2a})}}
      else{m.st-=dt;if(m.st<=0){removeMob(m,true);sfx('boom')}}
      break}
    case 'boar':case 'hound':case 'frostwolf':case 'jackal':{
      const c=m.def.ch;
      if(m.state==='chase'||m.state==='retreat'){faceM(m,dx,dz,dt,10);
        if(m.type!=='boar'&&d<7&&d>2.6){stepM(m,-dz*m.strafe*.8+dx*.3,dx*m.strafe*.8+dz*.3,m.spd*.8,dt);m.moving=true}
        else if(d>1.7){stepM(m,dx,dz,m.spd,dt);m.moving=true}
        if(m.cd<=0&&d>c.min&&d<c.max){m.state='tele';m.st=c.tel;m.warn=true;m.cdx=dx;m.cdz=dz;emitEvent({t:'v',x:m.x,z:m.z,n:m.def.snd})}
        else if(m.cd<=0&&d<=c.min)m.cd=.4}
      else if(m.state==='tele'){m.st-=dt;faceM(m,dx,dz,dt,14);m.cdx=dx;m.cdz=dz;if(m.st<=0){m.warn=false;m.state='rush';m.st=c.dur}}
      else if(m.state==='rush'){m.st-=dt;stepM(m,m.cdx,m.cdz,m.spd*c.sp,dt);faceM(m,m.cdx,m.cdz,dt,20);m.moving=true;if(m.st<=0){m.state='rec';m.st=c.rec;m.cd=rnd(c.cd[0],c.cd[1])}}
      else{m.st-=dt;if(m.st<=0)m.state='chase'}

/* contact damage — evaluated on every client for the local player */
function contactCheck(m){
  if(m.duel||!m.def.contact||m.hitCd>0||m.spawning||P.dead||P.stealth>0||P.hidden)return;
  if(m.type==='bat'&&m.ghost&&!m.warn&&false)return;
  if(d2(m.x,m.z,P.x,P.z)<(m.r+P.r)*(m.r+P.r)){if(hurtPlayer(m.dmg,m.x,m.z)){m.hitCd=.9;if(m.type==='bat'&&!m.ghost){m.state='retreat';m.st=.8}}}
}

/* ---------- visuals ---------- */
function tintMob(m){
  let key='',hex=null,int=0;
  if(m.flash>0){key='f';hex=0xffffff;int=.85}
  else if(m.freeze>0){key='i';hex=0x6ad0ff;int=.6}
  else if(m.warn){const on=Math.floor(m.age*14)%2===0;key=on?'w1':'w0';hex=on?0xff3030:null;int=.7}
  if(key===m.tintKey)return;m.tintKey=key;
  for(const q of m.mats){if(!q.emissive)continue;if(hex==null){q.emissive.setHex(q.userData.e0);q.emissiveIntensity=q.userData.i0}else{q.emissive.setHex(hex);q.emissiveIntensity=int}}
}
function animMob(m,dt){
  const o=m.m,t=m.age,mv=m.moving?1:0,g=o.g;
  g.position.x=m.x;g.position.z=m.z;g.rotation.y=m.face;
  let gs=m.scale;if(m.spawning)gs=m.scale*(1-m.sp/.35*.8);const pp=m.pop||0;if(pp>0)m.pop=Math.max(0,pp-dt*7);g.scale.set(gs*(1+pp*.14),gs*(1-pp*.12),gs*(1+pp*.14));

  switch(kind){
    case 'slime':{const k=m.hop>0?1:0;o.b.scale.set(1+Math.sin(t*6+m.ph)*.06+k*-.15,1+(k?.28:Math.sin(t*6+m.ph)*.08),1+Math.sin(t*6+m.ph)*.06+k*-.15);g.position.y=k?Math.sin(clamp(1-m.hop/.38,0,1)*Math.PI)*1.1:0;break}
    case 'skel':case 'archer':{const sw=Math.sin(t*10)*.7*(mv?1:.15);o.legL.rotation.x=sw;o.legR.rotation.x=-sw;
      if(kind==='skel'){o.armR.rotation.x=m.state==='wind'?-2.4:m.state==='rec'?.4:-.4+sw*.5;o.armL.rotation.x=-sw*.5}else{o.armL.rotation.x=-1.5;o.armR.rotation.x=m.state==='wind'?-1.8:-.6}
      o.b.position.y=Math.abs(sw)*.1;break}
    case 'bat':{const f=Math.sin(t*22+m.ph)*.8;o.wl.rotation.z=f;o.wr.rotation.z=-f;g.position.y=m.fly+Math.sin(t*4+m.ph)*.25;break}
    case 'bomber':{const sw=Math.sin(t*16)*.8;o.legL.rotation.x=sw;o.legR.rotation.x=-sw;o.b.position.y=Math.abs(sw)*.12;o.spark.scale.setScalar(.6+Math.random()*.5);
      if(m.warn){const s=1+(1-clamp(m.st/.85,0,1))*.35;o.b.scale.set(s,s,s)}break}
    case 'boar':case 'hound':case 'frostwolf':case 'jackal':{
      const sw=Math.sin(t*(m.state==='rush'?22:13))*.8*(mv?1:.1);
      o.legs[0].rotation.x=sw;o.legs[3].rotation.x=sw;o.legs[1].rotation.x=-sw;o.legs[2].rotation.x=-sw;
      o.tail.rotation.y=Math.sin(t*8+m.ph)*.4;o.head.rotation.x=m.warn?.35:Math.sin(t*3+m.ph)*.03;
      o.b.position.y=Math.abs(sw)*.08;o.b.scale.set(1,m.warn?.88:1,m.warn?1.06:1);break}
    case 'wraith':{g.position.y=m.fly+Math.sin(t*2+m.ph)*.35;o.armL.rotation.x=o.armR.rotation.x=m.warn?-2.2:-.3+Math.sin(t*3)*.15;o.tail.rotation.z=Math.sin(t*3)*.2;o.gl.material.opacity=.4+Math.sin(t*5)*.12;break}
    case 'spider':{for(const l of o.legs)l.g.rotation.y=Math.sin(t*(mv?18:3)+l.i*1.2+(l.s>0?0:Math.PI))*.35;o.b.position.y=.75+(mv?Math.abs(Math.sin(t*18))*.05:0);o.b.rotation.x=m.warn?-.3:0;break}
    case 'stormhawk':{const f=Math.sin(t*(m.warn?26:12)+m.ph)*.7;o.wl.rotation.z=f;o.wr.rotation.z=-f;g.position.y=m.fly+Math.sin(t*3+m.ph)*.3;o.b.rotation.x=mv?.2:0;break}
    case 'scorpion':{for(const l of o.legs)l.g.rotation.y=Math.sin(t*14+l.i*1.3+(l.s>0?0:Math.PI))*.4*(mv?1:.15);o.tail.rotation.x=m.warn?.9+Math.sin(t*30)*.04:Math.sin(t*2)*.12;o.pin[0].rotation.y=o.pin[1].rotation.y=Math.sin(t*3)*.08;break}
    case 'phantom':case 'yeti':case 'mummy':case 'sentinel':case 'icewitch':case 'seraph':{
      const sw=Math.sin(t*(kind==='mummy'?6:9))*.6*(mv?1:.12);
      o.legL.rotation.x=sw;o.legR.rotation.x=-sw;
      if(kind==='mummy')o.armL.rotation.x=o.armR.rotation.x=-1.3+(m.warn?-.9:0)+Math.sin(t*2)*.1;
      else if(kind==='yeti')o.armL.rotation.x=o.armR.rotation.x=m.warn?-2.8:-sw*.9;

      else{o.armR.rotation.x=m.warn?-2.5:-.4+sw*.5;o.armL.rotation.x=m.warn?-.9:-sw*.5}
      if(kind==='seraph'){g.position.y=m.fly+Math.sin(t*2+m.ph)*.3;o.wings.forEach((w,i)=>{w.rotation.z=(i?1:-1)*(.2+Math.sin(t*5)*.25)});if(o.halo)o.halo.rotation.z=t*2}
      if(kind==='phantom')g.visible=m.state!=='vanish';

    case 'golem':{const sw=Math.sin(t*5)*.45*(mv?1:.1);o.legL.rotation.x=sw;o.legR.rotation.x=-sw;
      if(m.warn){const k=1-clamp(m.st/1,0,1);o.armL.rotation.x=o.armR.rotation.x=lerp(-.3,-2.9,k)}

      else{o.armL.rotation.x=-sw*1.2;o.armR.rotation.x=sw*1.2}
      o.core.scale.setScalar(2.6*(1+Math.sin(t*4)*.12));o.b.position.y=Math.abs(sw)*.2;break}
  }

}

function updateMobs(dt){
  const auth=isAuth();
  if(auth){
    const A=allPos(),T=targets();
    if(DG.on)dgTick(dt,A);else if(!DU.on)updateSpawns(dt,A);
    for(const m of MOBS){if(m.dead||m.ghost)continue;updateMobAuth(m,dt,T)}
    // soft separation
    for(let i=0;i<MOBS.length;i++){const a=MOBS[i];if(a.dead||a.fly||a.ghost)continue;
      for(let j=i+1;j<MOBS.length;j++){const b=MOBS[j];if(b.dead||b.fly||b.ghost)continue;const dx=b.x-a.x,dz=b.z-a.z;if(Math.abs(dx)>3||Math.abs(dz)>3)continue;
        const rr=(a.r+b.r)*.85,dd=dx*dx+dz*dz;if(dd<rr*rr&&dd>1e-5){const d=Math.sqrt(dd),k=(rr-d)/d*.5;a.x-=dx*k;a.z-=dz*k;b.x+=dx*k;b.z+=dz*k}}}
  }else{
    for(const m of MOBS){if(!m.ghost||m.dead)continue;
      const k=1-Math.exp(-dt*9),ox=m.x,oz=m.z;m.x=lerp(m.x,m.tx,k);m.z=lerp(m.z,m.tz,k);m.age+=dt;m.hitCd-=dt;if(m.flash>0)m.flash-=dt;
      m.moving=Math.hypot(m.x-ox,m.z-oz)>.01;if(m.spawning){m.sp-=dt;if(m.sp<=0)m.spawning=false}
      if(m.type==='slime'){m.hop=m.moving?.2:0}}
  }
  for(const m of MOBS){if(m.dead)continue;contactCheck(m);tintMob(m);animMob(m,dt)}
  updateDying(dt);compactMobs();
  updateMobLabels();
}
function updateMobLabels(){
  const near=[];for(const m of MOBS){if(m.dead||m.spawning||m.duel)continue;const d=d2(m.x,m.z,P.x,P.z);if(d<20*20)near.push([d,m])}
  near.sort((a,b)=>a[0]-b[0]);
  const n=Math.min(10,near.length);
  while(mobLabels.length<10){const el=document.createElement('div');el.className='ml';el.innerHTML='<span class="mn"></span><i class="mb"><b></b></i>';labelsEl.appendChild(el);mobLabels.push({el,n:el.firstElementChild,b:null})}
  for(let i=0;i<mobLabels.length;i++){
    const L=mobLabels[i];
    if(i>=n){L.el.style.display='none';continue}
    const m=near[i][1],s=toScreen(m.x,(m.fly||0)+m.r*2.6+1.4,m.z);
    if(!s.vis){L.el.style.display='none';continue}
    L.el.style.display='block';const tf='translate('+(s.x|0)+'px,'+(s.y|0)+'px) translate(-50%,-100%)';if(L.tf!==tf){L.tf=tf;L.el.style.transform=tf}
    const txt='Lv.'+m.ml+' '+(m.elite?'정예 ':'')+(m.bn||m.def.n),diff=m.ml-SES.pf.level;
    if(L.last!==txt){L.last=txt;L.n.textContent=txt}
    const cls='ml'+(m.elite?' el':'')+(diff>=5?' hi':diff<=-6?' lo':'');if(L.cls!==cls){L.cls=cls;L.el.className=cls}
    const w=Math.max(0,m.hp/m.maxHp*100).toFixed(0)+'%';const bar=L.el.lastElementChild.firstElementChild;if(L.w!==w){L.w=w;bar.style.width=w}
  }
}

/* ---------- gathering by normal attacks ----------
   weeds: any normal attack cuts every weed it touches (pierces) -> instant material, regrow animation later
   trees: 3-5 normal-attack hits (shakes each time) -> falls -> sapling -> grows back
   mastery (server-stored): more chop power per hit, bonus yield chance */
const GAT={anim:[],weedAnim:[],pend:{weed:0,wood:0},busy:false,tf:0,wt:0,sw:0,_m:new THREE.Matrix4(),_a:new THREE.Matrix4(),_b:new THREE.Matrix4(),_z:new THREE.Matrix4().makeScale(0,0,0),_v:new THREE.Vector3()};

function gatBase(n){if(!n.mats){n.mats=[];for(const[m,i]of n.parts){const mm=new THREE.Matrix4();m.getMatrixAt(i,mm);n.mats.push(mm)}}}
function gatSet(n,mf){for(let q=0;q<n.parts.length;q++){const m=n.parts[q][0],i=n.parts[q][1];m.setMatrixAt(i,mf(q));m.instanceMatrix.needsUpdate=true}}

function gatAbout(n,q,X){const M=GAT._m;M.makeTranslation(n.x,0,n.z).multiply(X);GAT._a.makeTranslation(-n.x,0,-n.z);M.multiply(GAT._a).multiply(n.mats[q]);return M}

function nodeHit(n,dmg,f,fromX,fromZ){
  if(n.st)return false;
  if(n.k==='weed'){cutWeed(n);return true}
  gatBase(n);if(n.hp==null)n.hp=treeHp(n);n.hp-=dmg;
  n.sh={t:0,dur:.42,amp:.07+Math.random()*.03,ph:Math.random()*6.28,dx:n.x-fromX,dz:n.z-fromZ};GAT.anim.indexOf(n)<0&&GAT.anim.push(n);
  sfx('hit',.5);for(let i=0;i<7;i++)emit(n.x+rnd(-.6,.6),rnd(1.2,3.2)*Math.min(1.3,n.s),n.z+rnd(-.6,.6),rnd(-1.6,1.6),rnd(.2,1.6),rnd(-1.6,1.6),rnd(.5,.9),n.leaf||(zoneAt(n.x,n.z).id===2?0x55556a:zoneAt(n.x,n.z).id===7?0xeaf4ff:0x5aae4e),7);

    GAT.pend.wood++;dmgNum(n.x,3,n.z,'+'+MATS.wood.name,'gold');cam.shake=Math.max(cam.shake,.28)}

}

/* every nearby node inside the swing's cone (weeds pierce, each tree takes one hit) */
function gatherArc(f,range,arc,power){
  if(!P)return;const cx=Math.floor(P.x/8),cz=Math.floor(P.z/8),R=Math.ceil((range+3)/8),dmg=gatPower()*(power||1);let any=0;
  for(let i=-R;i<=R;i++)for(let j=-R;j<=R;j++){const a=WORLD.ngrid[(cx+i)+','+(cz+j)];if(!a)continue;
    for(const n of a){if(n.st)continue;const dx=n.x-P.x,dz=n.z-P.z,d=Math.hypot(dx,dz),rr=n.k==='weed'?0:.5+n.s*.5;
      if(d>range+.4+rr)continue;if(d>1.1&&Math.abs(angDiff(f,Math.atan2(dx,dz)))>arc/2+Math.atan2(rr+.3,Math.max(d,.5)))continue;
      if(nodeHit(n,dmg,f,P.x,P.z))any++}}

function gatherLine(dx,dz,len,power){
  if(!P)return;const f=Math.atan2(dx,dz),cx=Math.floor((P.x+dx*len/2)/8),cz=Math.floor((P.z+dz*len/2)/8),R=Math.ceil(len/16)+1,dmg=gatPower()*(power||1);let tree=null,td=1e9;
  for(let i=-R;i<=R;i++)for(let j=-R;j<=R;j++){const a=WORLD.ngrid[(cx+i)+','+(cz+j)];if(!a)continue;
    for(const n of a){if(n.st)continue;const rx=n.x-P.x,rz=n.z-P.z,al=rx*dx+rz*dz;if(al<-.3||al>len)continue;const lat=Math.abs(rx*dz-rz*dx),w=n.k==='weed'?1.1:.8+n.s*.5;if(lat>w)continue;
      if(n.k==='weed')nodeHit(n,dmg,f,P.x,P.z);else if(al<td){td=al;tree=n}}}

function tickGather(dt){

    if(n.st==='fall'){n.ft+=dt;const u=Math.min(1,n.ft/GT_FALL),th=Math.min(1.5,u*u*1.9);GAT._b.makeRotationAxis(GAT._v.set(n.fz,0,-n.fx),th);

    else if(n.sh){const s=n.sh;s.t+=dt;const u=s.t/s.dur;
      if(u>=1){n.sh=null;gatShow(n);done=true}
      else{const k=Math.exp(-4*u)*Math.sin(u*34+s.ph),l=Math.hypot(s.dx,s.dz)||1;GAT._b.makeRotationAxis(GAT._v.set(s.dz/l,0,-s.dx/l),k*s.amp*3.2);gatSet(n,q=>gatAbout(n,q,GAT._b))}}

    const c=def.judge;if(m.jt===undefined)m.jt=c.first;m.jt-=dt;

      const second=m.jn>0,w=second?c.w2:c.w;m.jn=second?0:m.p2?1:0;   /* phase 2: two in a row */
      m.jt=m.jn?w+.3:c.every[m.p2?1:0];m.cd=Math.max(m.cd,w+.8);m.mt=Math.max(m.mt||0,w+1.8);dgJudge(m,def,w)}
  }
  if(m.state==='chase'){
    faceM(m,dx,dz,dt,6);
    const kp=def&&def.keep,keep=kp||3.4;
    if(d>keep+1.5){stepM(m,dx,dz,m.spd,dt);m.moving=true}else if(kp&&d<keep-2){stepM(m,-dx,-dz,m.spd*.8,dt);m.moving=true}
    if(m.cd<=0){
      const pl=m.p2?def.p2.pat:def.pat,pat=pl[m.pi++%pl.length],tel=DG_TEL[pat];m.pat=pat;m.state='wind';m.warn=true;m.st=tel;m.cdx=dx;m.cdz=dz;
      emitEvent({t:'v',x:m.x,z:m.z,n:'growl'});
      const T=targets().filter(t=>!t.pull).slice(0,4);
      if(pat==='slam')emitEvent({t:'x',x:m.x,z:m.z,r:6.5,w:tel,d:m.dmg*1.5*en,c:def.ring});
      else if(pat==='barrage')for(const t of T)for(let i=0;i<3;i++)emitEvent({t:'x',x:t.x+(i?rnd(-5,5):0),z:t.z+(i?rnd(-5,5):0),r:2.8,w:tel+.4+i*.15,d:m.dmg*1.1*en,c:def.ring});
      else if(pat==='bolts')for(const t of T)for(let i=0;i<5;i++)emitEvent({t:'x',x:t.x+rnd(-7,7),z:t.z+rnd(-7,7),r:2.4,w:.9+i*.14,d:m.dmg*1.1*en,c:def.ring});
      else if(pat==='quake'){const n=Math.hypot(dx,dz)||1;for(let i=1;i<=5;i++)emitEvent({t:'x',x:m.x+dx/n*i*4,z:m.z+dz/n*i*4,r:3,w:.7+i*.18,d:m.dmg*1.2*en,c:def.ring})}
    }
  }else if(m.state==='wind'){
    m.st-=dt;faceM(m,dx,dz,dt,8);if(m.pat==='rush'){m.cdx=dx;m.cdz=dz}
    if(m.st<=0){
      m.warn=false;
      if(m.pat==='rush'){m.state='rush';m.st=.75}
      else{
        if(m.pat==='nova'){const n=enr?24:16,o=m.age;for(let i=0;i<n;i++){const a=i/n*TAU+o;emitEvent({t:'b',x:m.x+Math.sin(a),z:m.z+Math.cos(a),a,s:8.5,d:m.dmg*.7*en,c:def.ring,l:3})}}
        else if(m.pat==='summon'){let c=0;for(const q of MOBS)if(q.dg&&!q.dead&&q!==m)c++;const cap=def&&def.addCap||8;if(c<cap){const k=Math.min(enr?3:2,cap-c);for(let i=0;i<k;i++){const a=rnd(0,TAU),q=dgClampPt(m.x+Math.cos(a)*5,m.z+Math.sin(a)*5);dgSpawnAdd(pick(def.adds),q.x,q.z)}emitEvent({t:'f',x:m.x,z:m.z,c:def.ring,n:'whoosh'})}}
        m.state='rec';m.st=.9;m.cd=rnd(1.5,2.3)*cdm;
      }
    }
  }else if(m.state==='rush'){
    m.st-=dt;stepM(m,m.cdx,m.cdz,m.spd*4.6,dt);m.moving=true;faceM(m,m.cdx,m.cdz,dt,20);
    if(m.st<=0){m.state='rec';m.st=1.1;m.cd=rnd(1.5,2.3)*cdm}
  }else{m.st-=dt;if(m.st<=0)m.state='chase'}
}

/* ---------- entering / leaving ---------- */
function dgEnter(id){
  const def=DGDEF[id],A=dgBuildArena();
  if(GUIDE.id)guideStop();
  DG.on=true;DG.id=id;DG.zone=Object.assign({},ZONES[def.zid],{name:def.name,lo:def.need,hi:def.need+12});
  DG.ph='intro';DG.pt=3.5;DG.t=0;DG.wave=0;DG.sub=0;DG.p2=false;DG.dmg={};DG.deaths=0;DG.boss=null;DG.res=null;DG.begin=Date.now();DG.alive=0;DG.bh=100;DG.lastSt=0;
  DG.leader=NET.party?NET.party.leader:SES.name;
  DG.atmo=def.atmo;DG.shapes=null;
  A.gm.color.setHex(def.fl);A.wm.color.setHex(def.wl);A.pm.color.setHex(def.wl+0x101012);if(A.tm)A.tm.color.setHex(def.wl+0x08080a);A.rm.color.setHex(def.ring);
  dgTheme(A,id);for(const k in A.th)A.th[k].visible=(k===id);for(const gt of A.gates){gt.bar.material.color.setHex(def.ring);gt.g.visible=true}A.arrows.visible=false;
  A.g.visible=true;worldG.visible=false;
  if(THREE.PointLight&&!(typeof balOn==='function'&&balOn())){if(!DG.lamp){DG.lamp=new THREE.PointLight(0xffb878,1.5,36,1.5)}DG.lamp.position.set(P.x,6,P.z);scene.add(DG.lamp)}
  resetMobs();
  P.recall=0;P.x=DG.cx+rnd(-2,2);P.z=DG.cz+1;P.vx=P.vz=0;P.iframes=2;P.hp=S.maxHp;P.dead=false;cam.x=P.x;cam.z=P.z;
  const mini=$('mini');if(mini&&mini.style)mini.style.display='none';
  UI.zone=-1;DG.dm=null;dgHud(true);sfx('level');
  shockRing(P.x,P.z,5,def.ring,.6);
}
function dgLeave(msg){
  if(!DG.on)return;
  const id=DG.id;DG.on=false;DG.ph='idle';DG.boss=null;
  if(DG.arena)DG.arena.g.visible=false;worldG.visible=true;DG.atmo=null;if(DG.lamp&&DG.lamp.parent)scene.remove(DG.lamp);
  resetMobs();
  const pt=DGP.find(p=>p.dg===id);
  if(pt){const l=Math.hypot(pt.x,pt.z)||1;P.x=pt.x-pt.x/l*4.5;P.z=pt.z-pt.z/l*4.5}else{P.x=SPAWN.x;P.z=SPAWN.z}
  P.vx=P.vz=0;P.dead=false;P.hp=S.maxHp;P.iframes=1.5;UI.deadOn(false);cam.x=P.x;cam.z=P.z;
  const mini=$('mini');if(mini&&mini.style)mini.style.display='';
  UI.zone=-1;dgHud(false);
  if(NET.on&&NET.party&&isAuth()){NET.party.dgId=null;netSend('dg',{k:'out',id,msg:msg||''})}
  if(msg)UI.toast(msg,2600);
}
function dgFail(msg){
  if(!DG.on)return;
  if(NET.on&&NET.party&&isAuth()&&DG.ph!=='clear')netSend('dg',{k:'out',id:DG.id,msg:msg||''});
  DG.ph='fail';dgLeave(msg||'던전에서 퇴장했습니다');
}
function dgRespawn(){
  if(DG.ph!=='clear'){
    DG.deaths++;
    if(DG.deaths>DG.maxDeaths){P.dead=false;UI.deadOn(false);dgFail('부활 횟수를 모두 사용했습니다');return}
    UI.toast('부활했습니다 (남은 부활 '+(DG.maxDeaths-DG.deaths)+'회)',2000);
  }
  P.dead=false;P.x=DG.cx+rnd(-3,3);P.z=DG.cz+dgRespawnZ();P.vx=P.vz=0;P.hp=S.maxHp;P.iframes=2.5;UI.deadOn(false);cam.x=P.x;cam.z=P.z;
}

/* ---------- portal interaction ---------- */
async function openPortal(p){
  const def=DGDEF[p.dg];if(!def||DG.on)return;
  const party=dgInParty();
  if(!party&&SES.pf.level<def.need){UI.toast('Lv.'+def.need+' 이상부터 입장할 수 있습니다');return}
  if(party&&!isAuth()){
    if(NET.party.dgId!==p.dg){UI.toast('파티장이 먼저 입장해야 합니다');return}
    if(await UI.confirm(def.name+'에 합류할까요?'))dgJoin(p.dg);
    return;
  }
  const txt=def.name+'\n'+(party?'파티 입장: 레벨 제한 없음':'입장 Lv.'+def.need+' 이상 (파티는 제한 없음)')+' · 웨이브 '+def.waves.length*(def.per||1)+'회 + 보스 · 제한 10분\n피해 기여도 순위에 따라 보상이 달라집니다.\n(1위: 지역 룬 또는 지역 무기 · 2~5위: 골드/물약/룬 확률)'+(def.hit?'\n⚠ 극난이도: 성직자(버퍼) 없이는 클리어가 거의 불가능합니다.':'')+'\n사망은 3회까지 부활합니다.'+(party?'\n파티원에게 입장 알림이 전송됩니다.':'');
  if(!(await UI.confirm(txt)))return;
  dgStart(p.dg);
}
const dgInParty=()=>!!(NET.party&&NET.party.members.length>1);   /* parties ignore dungeon level limits */
async function dgStart(id){
  try{await API.call('dgBegin',id,dgInParty())}catch(e){UI.toast(errKo(e.message));return}
  flushKills();flushGather();
  dgEnter(id);
  if(NET.on&&NET.party&&NET.party.members.length>1&&isAuth()){NET.party.dgId=id;netSend('dg',{k:'in',id,from:SES.name,to:NET.party.members.filter(n=>n!==SES.name)})}
}
async function dgJoin(id){
  if(DG.on)return;
  try{await API.call('dgBegin',id,dgInParty())}catch(e){UI.toast(errKo(e.message));return}
  flushKills();flushGather();dgEnter(id);
}

/* ---------- authority: waves & boss ---------- */
function dgPlayers(){return allPos().filter(q=>q.x>600)}
function dgSpawnWave(){
  const def=DGDEF[DG.id],A=dgPlayers(),pc=Math.max(1,A.length),idx=DG.wave,n=Math.min(24,Math.round(def.waves[idx]*(1+.5*(pc-1))));
  sfx('boom');const zt=dgZT(idx),zb=dgZB(idx);
  for(let i=0;i<n;i++){
    let x=DG.cx,z=DG.cz+zb+6;
    for(let k=0;k<10;k++){x=DG.cx+rnd(-13,13);z=DG.cz+rnd(zb+4,zt-18);if(!blocked(x,z,1.2)&&A.every(q=>d2(x,z,q.x,q.z)>9*9))break}
    dgSpawnAdd(pick(def.mobs),x,z,!!def.elite||idx===def.waves.length-1&&DG.sub===(def.per||1)-1&&i===0&&pc>1);
  }
}
function dgSpawnBoss(){
  const def=DGDEF[DG.id],pc=Math.max(1,dgPlayers().length);
  DG.mkBk=DG.id;const m=makeMobObj(mobSeq++,'dgboss',DG.cx,DG.cz+DG_HALL_Z-4,def.ml,false,false,false);
  dgBossSetup(m,DG.id);m.maxHp=m.hp=def.hpFix?def.hpFix[0]+def.hpFix[1]:Math.round(mobHp(def.ml)*def.hpM*(1+.9*(pc-1)));   /* hpFix: [phase 1, phase 2], same for any party size */
  DG.boss=m;sfx('boom');cam.shake=Math.max(cam.shake,.8);
  shockRing(m.x,m.z,10,def.ring,.8);
}
function dgTick(dt,A){
  if(!DG.on||DG.ph==='clear'||DG.ph==='fail')return;
  const def=DGDEF[DG.id];DG.t+=dt;
  if(DG.t>600){dgFail('제한 시간이 초과되었습니다');return}
  let alive=0;for(const m of MOBS)if(m.dg&&!m.dead&&!m.ghost&&m.type!=='dgboss')alive++;DG.alive=alive;
  if(DG.ph==='intro'){DG.pt-=dt;if(DG.pt<=0){DG.ph='wave';dgSpawnWave()}}
  else if(DG.ph==='wave'){if(alive===0){if(DG.sub+1<(def.per||1)){DG.sub++;DG.ph='gap';DG.pt=2.5}else{DG.sub=0;DG.wave++;DG.ph='advance'}}}
  else if(DG.ph==='gap'){DG.pt-=dt;if(DG.pt<=0){DG.ph='wave';dgSpawnWave()}}
  else if(DG.ph==='advance'){
    const tz=dgRoomTrigger(DG.wave);
    if(dgPlayers().some(q=>q.z-DG.cz<tz)){if(DG.wave>=def.waves.length){DG.ph='boss';dgSpawnBoss()}else{DG.ph='wave';dgSpawnWave()}}
  }
  else if(DG.ph==='boss'){if(DG.boss&&DG.boss.dead)dgClear()}
  DG.lastSt+=dt;
  if(DG.lastSt>.5){DG.lastSt=0;if(NET.on&&NET.party&&NET.party.members.length>1){const b=DG.boss;netSend('dg',{k:'st',id:DG.id,ph:DG.ph,w:DG.wave,s:DG.sub,al:alive,t:Math.round(DG.t),bh:b&&!b.dead?Math.round(b.hp/b.maxHp*100):0,dm:Object.fromEntries(Object.entries(DG.dmg).sort((a,b)=>b[1]-a[1]).slice(0,4).map(x=>[x[0],Math.round(x[1])]))})}}
}
function dgStandings(){
  const names=new Set(Object.keys(DG.dmg));
  if(NET.party)for(const n of NET.party.members){const p=NET.peers[n];if(n===SES.name||(p&&p.got&&p.x>600))names.add(n)}
  names.add(SES.name);
  return[...names].map(n=>[n,Math.round(DG.dmg[n]||0)]).sort((a,b)=>b[1]-a[1]||(a[0]<b[0]?-1:1));
}
function dgClear(){
  DG.ph='clear';const st=dgStandings();
  if(NET.on&&NET.party&&NET.party.members.length>1)netSend('dg',{k:'end',id:DG.id,st});
  dgOnEnd(st);
}

/* ---------- results & rewards (every client in the dungeon) ---------- */
async function dgOnEnd(st){
  DG.ph='clear';DG.st=st;sfx('level');cam.shake=Math.max(cam.shake,.5);
  const idx=st.findIndex(s=>s[0]===SES.name),rank=Math.min(5,idx<0?st.length+1:idx+1),id=DG.id;
  // server needs the run to be at least 45 s old
  const wait=Math.max(0,46500-(Date.now()-DG.begin));if(wait>0)await new Promise(r=>setTimeout(r,wait));
  if(!DG.on||DG.id!==id)return;
  let rw=null,err=null;
  try{const r=await API.call('dgEnd',id,rank);rw=r.rewards}catch(e){err=e.message}
  DG.res={st,rank,rw,err};
  try{derive();UI.refreshHud()}catch(e){}
  dgResults();
}
function dgRwText(r){
  if(r.t==='gold')return '골드 +'+fmtN(r.n);
  if(r.t==='weapon')return '무기 · '+wName(r.base);
  if(r.t==='potion')return (POTIONS[r.base]?POTIONS[r.base].name:r.base)+' x'+r.n;
  if(r.t==='rune')return (RUNES[r.base]?RUNES[r.base].name:r.base)+(r.base==='all'?'':' '+(RUNE_G[r.g]||''))+' x'+r.n;
  return '';
}
function dgRwCard(r){
  let col='#ffd24a',ico=ic('star',col,26),nm='',sub='';
  if(r.t==='gold'){nm=fmtN(r.n)+' G';sub='골드'}
  else if(r.t==='weapon'){col=TIER_COL[wTier(r.base)-1];ico=ic(WICON[wCls(r.base)],col,26);nm=wName(r.base);sub='무기'}
  else if(r.t==='potion'){const p=POTIONS[r.base]||{};col=p.col||'#ff5a6a';ico=ic('potion',col,26);nm=(p.name||r.base)+' x'+r.n;sub='물약'}
  else if(r.t==='rune'){const q=RUNES[r.base]||{};col=q.col||'#fff';ico=ic('gem',col,26);nm=(q.name||r.base)+(r.base==='all'?'':' '+(RUNE_G[r.g]||''))+' x'+r.n;sub='룬'}
  return '<div class="rc" style="--cc:'+col+'">'+ico+'<div style="color:'+col+';font-weight:800;margin-top:4px">'+esc(nm)+'</div><small>'+sub+'</small></div>';
}
function dgResults(){
  const R=DG.res;if(!R||!DG.on)return;
  const tot=R.st.reduce((a,x)=>a+x[1],0)||1,top=R.st[0]?R.st[0][1]||1:1,mc=['#ffd24a','#cfd8e8','#d89a5a'][R.rank-1]||'#8aa0c0';
  UI.page('DUNGEON CLEAR — '+DGDEF[DG.id].name,()=>{
    let h='<div id="dgres" style="--mc:'+mc+'"><div class="rk"><b>'+R.rank+'</b><div>'+(R.rank===1?'기여도 1위! 최고의 활약':R.rank+'위 · 수고하셨습니다')+'</div></div>';
    h+=R.err?'<div class="card"><div class="red">'+esc(errKo(R.err))+'</div></div>':'<div class="rw">'+(R.rw||[]).map((r,i)=>dgRwCard(r).replace('class="rc"','class="rc" style="animation-delay:'+(i*.15)+'s;--cc:'+(r.t==='gold'?'#ffd24a':'#9fc8ff')+'"')).join('')+'</div>';
    h+='<div class="dim" style="margin:12px 0 4px;text-align:center;letter-spacing:1px">기여도 순위</div>'+R.st.map((x,i)=>'<div class="sr'+(x[0]===SES.name?' me':'')+'"><i style="width:'+Math.round(x[1]/top*100)+'%"></i><span>'+(i+1)+'. '+esc(x[0])+'</span><span>'+fmtN(x[1])+' · '+Math.round(x[1]/tot*100)+'%</span></div>').join('');
    h+='<div class="row" style="margin-top:12px;justify-content:center"><button class="btn" data-a="dgout">마을 입구로 나가기</button></div><div class="dim" style="text-align:center;margin-top:6px">30초 후 자동으로 나갑니다</div></div>';
    return h;
  });
  clearTimeout(DG.autoT);DG.autoT=setTimeout(()=>{if(DG.on&&DG.ph==='clear'){UI.close();dgLeave('던전을 나왔습니다')}},30000);
}
function dgOut(){clearTimeout(DG.autoT);UI.close();dgLeave('던전을 나왔습니다')}

/* ---------- party events ---------- */
async function onDgEv(d){
  if(!d||!NET.party)return;
  if(d.k==='in'){
    if(NET.party.leader!==d.from||!DGDEF[d.id])return;NET.party.dgId=d.id;
    if(!Array.isArray(d.to)||!d.to.includes(SES.name)||DG.on)return;
    if(await UI.confirm('파티장이 '+DGDEF[d.id].name+'에 입장했습니다.\n함께 입장할까요?'))dgJoin(d.id);
  }else if(d.k==='st'){
    if(!DG.on||isAuth()||DG.id!==d.id)return;DG.ph=d.ph;DG.wave=d.w;DG.sub=d.s|0;DG.alive=d.al;DG.t=d.t;DG.bh=d.bh;if(d.dm&&typeof d.dm==='object')DG.dm=d.dm;
  }else if(d.k==='end'){
    if(!DG.on||isAuth()||DG.id!==d.id||DG.ph==='clear'||!Array.isArray(d.st))return;dgOnEnd(d.st.slice(0,8).map(s=>[String(s[0]),+s[1]||0]));
  }else if(d.k==='out'){
    NET.party.dgId=null;
    if(DG.on&&DG.ph!=='clear'&&!isAuth())dgFail(d.msg||'파티장이 던전을 떠났습니다');
  }
}

/* ---------- dungeon guide: pick on the town map -> arrow on the ground + chip with distance; ends on re-pick, X, or arrival ---------- */
const GUIDE={id:null,el:null,arrow:null,t:0};
const guideTarget=()=>GUIDE.id?DGP.find(p=>p.dg===GUIDE.id):null;
function guideStop(msg){
  GUIDE.id=null;if(GUIDE.el)GUIDE.el.style.display='none';if(GUIDE.arrow)GUIDE.arrow.visible=false;
  if(msg)UI.toast(msg,2200);
}
function guideToggle(id){
  if(!DGDEF[id])return;
  if(GUIDE.id===id){guideStop('길 안내를 취소했습니다');return}
  if(!GUIDE.el){
    const st=document.createElement('style');
    st.textContent='#guide{position:fixed;left:50%;top:112px;transform:translateX(-50%);z-index:21;display:none;align-items:center;gap:10px;padding:5px 6px 5px 14px;border-radius:18px;background:rgba(12,14,26,.88);border:1px solid #ffd24a;color:#fff;font-size:13px;font-weight:700;white-space:nowrap}#guide button{width:24px;height:24px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:13px;cursor:pointer;padding:0}';
    document.head.appendChild(st);
    const e=document.createElement('div');e.id='guide';e.innerHTML='<span></span><button title="안내 취소">✕</button>';document.body.appendChild(e);
    e.querySelector('button').onclick=()=>guideStop('길 안내를 취소했습니다');GUIDE.el=e;
  }
  if(!GUIDE.arrow){
    const g=new THREE.Group(),m=new THREE.MeshBasicMaterial({color:0xffd24a,transparent:true,opacity:.85,depthWrite:false,depthTest:false});
    for(let k=0;k<3;k++){const c=new THREE.Mesh(new THREE.ConeGeometry(.55,.9,3),m);c.rotation.x=Math.PI/2;c.position.set(0,0,2.4+k*1.1);c.scale.set(1,1,.2);g.add(c)}
    scene.add(g);GUIDE.arrow=g;
  }
  GUIDE.id=id;GUIDE.t=1;GUIDE.el.style.display='flex';
  UI.toast(DGDEF[id].name+' 길 안내를 시작합니다',2200);guideUpdate(0);
}
function guideUpdate(dt){
  if(!GUIDE.id||!P)return;
  const p=guideTarget();if(!p||DG.on){guideStop();return}
  const d=Math.hypot(p.x-P.x,p.z-P.z);
  if(d<9){guideStop(DGDEF[GUIDE.id].name+' 입구에 도착했습니다');return}
  const a=GUIDE.arrow;a.visible=!P.dead;a.position.set(P.x,.25,P.z);a.rotation.y=Math.atan2(p.x-P.x,p.z-P.z);
  GUIDE.t+=dt;if(GUIDE.t<.2)return;GUIDE.t=0;
  GUIDE.el.querySelector('span').textContent='▶ '+DGDEF[GUIDE.id].name+' 안내 중 · '+Math.round(d)+'m';
}

    for(let i=0;i<48;i++){const a=i/48*TAU;x.strokeStyle='#6e6048';x.lineWidth=3;x.beginPath();x.moveTo(256+Math.cos(a)*144,256+Math.sin(a)*144);x.lineTo(256+Math.cos(a)*178,256+Math.sin(a)*178);x.stroke()}

function duelArena(){
  if(DU.arena)return DU.arena;
  const g=grp(DU.x,0,DU.z,scene),R=DU.R;
  const stone=M(0xb8ae98,{roughness:.95}),stone2=M(0x948a74,{roughness:.95}),dark=M(0x6c6456),grass=M(0x6f9a45,{roughness:1}),rock=M(0x7a7266,{roughness:1}),shade=M(0x39404a);
  const cyl=(rt,rb,h,n,m,x,y,z,p)=>{const o=mesh(new THREE.CylinderGeometry(rt,rb,h,n),m,x,y,z,p||g,false);o.receiveShadow=true;return o};
  /* the arena itself floats: grass shelf on a rock root */
  cyl(R+12,R+11,.6,24,grass,0,-.85,0);cyl(R+11,3,15,10,rock,0,-8.6,0);
  const floor=mesh(new THREE.CircleGeometry(R+.4,8),new THREE.MeshStandardMaterial({map:duelFloorTex(),roughness:.95}),0,.02,0,g,false);
  floor.rotation.x=-Math.PI/2;floor.rotation.z=Math.PI/8;floor.receiveShadow=true;
  /* stepped stands on the eight sides, with two entrances (left/right) */
  for(let s=0;s<8;s++){
    const an=s/8*TAU,side=grp(0,0,0,g);side.rotation.y=an;
    const low=Math.abs(an)<.1,gate=Math.abs(an-Math.PI/2)<.1||Math.abs(an-Math.PI*1.5)<.1,tiers=low?2:4;   // an=0 faces the camera: keep it low
    for(let t=0;t<tiers;t++){
      const d=R+.6+t*1.25,w=2*d*Math.tan(Math.PI/8)+.1,h=.4+t*.45,m=t%2?stone2:stone;
      if(gate){for(const k of[-1,1])BX(w*.36,h,1.25,m,k*w*.32,h/2-.1,d,side)}else BX(w,h,1.25,m,0,h/2-.1,d,side);
    }
  }
  /* two-storey arched colonnades left and right */
  const arcade=(x0,z0,ry,n)=>{const w=grp(x0,0,z0,g);w.rotation.y=ry;
    for(let f=0;f<2;f++){const y=f*3.7;
      BX(n*2.5+.6,.45,1.5,stone2,0,y+3.45,0,w);BX(n*2.5,3.2,.4,shade,0,y+1.6,-.55,w);
      for(let i=0;i<=n;i++){const x=(i-n/2)*2.5;BX(.55,3.3,1.2,stone,x,y+1.6,0,w);cyl(.2,.22,2.6,8,stone2,x,y+1.45,.72,w)}
      for(let i=0;i<n;i++){const x=(i-n/2+.5)*2.5;mesh(new THREE.TorusGeometry(.95,.24,5,12,Math.PI),stone,x,y+2.2,.3,w,false)}
    }
    BX(n*2.5+1,.35,1.8,stone,0,7.55,0,w);
  };
  arcade(-(R+6.4),-4,Math.PI/2,5);arcade(R+6.4,-4,-Math.PI/2,5);arcade(0,-(R+7),0,5);
  /* two tall pillars at the back */
  for(const sx of[-1,1]){const x=sx*8.5,z=-(R+6.5);BX(1.5,.7,1.5,dark,x,.35,z,g);cyl(.45,.55,8,10,stone,x,4.6,z);BX(1.3,.5,1.3,stone2,x,8.8,z,g);SP(.35,EM(0xffd27a,1),x,9.4,z,g,8,6)}
  /* floating isles, rock spires and clouds around (below the arena, so the high camera sees them) */
  for(const[x,z,y,r]of[[-9,-34,-7,4.5],[17,-31,-11,3],[-34,6,-12,3.5],[33,14,-9,4],[2,-48,-6,6],[-26,-24,-16,2.5],[27,-12,-15,2]]){
    cyl(r,r*.9,.5,9,grass,x,y,z);cyl(r*.9,.2,r*2.2,7,rock,x,y-r*1.1-.2,z);
    if(r>3.4){BX(r*.8,r*.45,r*.5,stone,x,y+r*.22,z,g);CN(r*.35,r*.5,dark,x,y+r*.7,z,g,4)}
  }
  for(let i=0;i<26;i++){const a=i*2.4,r=R+17+(i*7)%22,s=glow(0xffffff,9+(i%4)*3,.5);s.position.set(Math.cos(a)*r,-9-(i%3)*3,Math.sin(a)*r);g.add(s)}
  g.visible=false;DU.arena={g};return DU.arena;
}

/* ---------- messages ---------- */
function duelRequest(name){
  if(!NET.on)return;const p=NET.peers[name];
  if(!duFree()){UI.toast(NET.party?'파티 중에는 결투할 수 없습니다':'지금은 결투를 신청할 수 없습니다');return}
  if(!p||p.du){UI.toast('상대가 결투를 받을 수 없습니다');return}
  DU.pend={to:name,id:Math.random().toString(36).slice(2,10)+Date.now().toString(36),at:Date.now()};
  netSend('dq',{f:SES.name,t:name,id:DU.pend.id});UI.toast(name+'님에게 결투를 신청했습니다');
}
const duelNo=(to,why)=>netSend('dx',{f:SES.name,t:to,why});
function onDuelAsk(d){
  if(!d||d.t!==SES.name||typeof d.f!=='string'||typeof d.id!=='string'||!NET.peers[d.f])return;
  if(!duFree()||UI.trade){duelNo(d.f,'상대가 지금은 결투할 수 없습니다');return}
  DU.ask={from:d.f,id:d.id,at:Date.now()};UI.duelInvite(d.f);
}
function duelAccept(){
  const a=DU.ask;DU.ask=null;if(!a)return;
  if(!duFree()||!NET.peers[a.from]){UI.toast('결투를 시작할 수 없습니다');duelNo(a.from,'상대가 결투를 시작할 수 없습니다');return}
  netSend('da',{f:SES.name,t:a.from,id:a.id});duelStart(a.id,a.from,SES.name);
}
function duelDecline(){const a=DU.ask;DU.ask=null;if(a)duelNo(a.from,SES.name+'님이 결투를 거절했습니다')}
function onDuelYes(d){
  const q=DU.pend;if(!d||d.t!==SES.name||!q||d.id!==q.id||d.f!==q.to||Date.now()-q.at>25000)return;
  DU.pend=null;
  if(!duFree()){netSend('de',{id:q.id,cancel:1,f:SES.name});return}

}
function onDuelNo(d){if(d&&d.t===SES.name&&DU.pend&&DU.pend.to===d.f){DU.pend=null;UI.toast(String(d.why||'결투가 거절되었습니다').slice(0,60))}}

/* ---------- enter / leave ---------- */
function duelEnter(){
  if(GUIDE.id)guideStop();
  const A=duelArena();A.g.visible=true;worldG.visible=false;skReset();resetMobs();
  for(const p of DGP)if(p.label.el)p.label.el.style.display='none';
  const mini=$('mini');if(mini&&mini.style)mini.style.display='none';
  UI.zone=-1;duelHud(true);sfx('level');
}
function duelStart(id,a,b){
  DU.on=true;DU.role='fight';DU.id=id;DU.a=a;DU.b=b;DU.opp=a===SES.name?b:a;DU.ph='count';DU.pt=3;DU.t=0;DU.out=0;DU.prox=null;DU.res=null;DU.seen=Date.now();
  DU.back={x:P.x,z:P.z};UI.close();duelEnter();duelClearFx();
  P.recall=0;P.x=DU.x+(a===SES.name?-6:6);P.z=DU.z;P.vx=P.vz=0;P.face=a===SES.name?Math.PI/2:-Math.PI/2;P.hp=S.maxHp;P.shield=0;P.iframes=0;cam.x=P.x;cam.z=P.z;
  for(const k of['q','e','r','f'])P.cd[k]=0;P.dashCd=0;

function duelSpectate(name){
  const p=NET.peers[name];if(!p||!p.du){UI.toast('결투가 이미 끝났습니다');return}
  if(!duFree()){UI.toast(NET.party?'파티 중에는 관전할 수 없습니다':'지금은 관전할 수 없습니다');return}

function duelLeave(msg){
  if(!DU.on)return;

  DU.on=false;duelClearFx();DU.ph='idle';DU.prox=null;DU.role=null;DU.res=null;

/* the fight is decided; stay a moment, then return */
function duelFinish(winner,msg){
  if(!DU.on||DU.ph==='end')return;
  DU.ph='end';duelClearFx();DU.pt=3.5;DU.res=msg||(winner+'님의 승리!');

/* I lost: tell the others and let the server record it (winner +300 duel points) */
function duelLose(why){
  if(!DU.on||DU.role!=='fight'||DU.ph==='end')return;
  const id=DU.id,opp=DU.opp,counted=DU.ph==='fight';
  netSend('de',{id,w:opp,l:SES.name,counted:counted?1:0});
  duelFinish(opp,counted?(why||'패배했습니다'):'결투를 취소했습니다');
  if(counted)API.call('duelLose',opp,id).then(()=>netSend('dr',{id,t:opp})).catch(()=>UI.toast('전적을 저장하지 못했습니다',2600));
}
function onDuelEnd(d){
  if(!d||!DU.on||d.id!==DU.id||DU.ph==='end')return;
  if(d.cancel){duelLeave('결투가 취소되었습니다');return}
  if(DU.role==='fight'){
    if(d.l!==DU.opp)return;
    duelFinish(SES.name,d.counted?'승리! 결투 포인트 +'+DUEL_POINT:'상대가 결투를 취소했습니다');
  }else if(d.w===DU.a||d.w===DU.b)duelFinish(d.w);
}
/* the server has saved the result: reload my record and points */
function onDuelRecorded(d){
  if(!d||d.t!==SES.name)return;
  API.resume(SES.name,SES.token).then(p=>{if(p&&p.items){const r=p.duel;if(r)UI.toast('전적 '+r.w+'승 '+r.l+'패 · 결투 포인트 '+fmtG(r.pt),3200)}}).catch(()=>{});
}

/* ---------- damage ---------- */
function duelHitOut(m,d){
  if(DU.ph!=='fight')return;
  DU.out+=d;
  if(S.vamp){P.vampAcc+=d*DUEL_K*S.vamp;if(P.vampAcc>=1){const v=Math.floor(P.vampAcc);P.vampAcc-=v;P.hp=Math.min(S.maxHp,P.hp+v)}}
}
function onDuelHit(d){
  if(!d||!DU.on||DU.role!=='fight'||DU.ph!=='fight'||d.id!==DU.id||d.t!==SES.name||d.f!==DU.opp)return;
  if(P.dead||P.iframes>0||P.dashT>0||P.hidden)return;
  duelFxIn(d);
  const raw=Math.min(Math.max(0,+d.d||0)*DUEL_K,S.maxHp*.3);
  if(raw>0){burst(P.x,1.2,P.z,6,0xff5a6a,5,.3,8);duelHurt(raw)}
}

/* ---------- crowd control: stun, burn, knockback, pull and throw all reach the opponent ---------- */
const duelFxOut=()=>DU.fx||(DU.fx={});
function duelStunOut(t){if(DU.ph==='fight'){const f=duelFxOut();f.fz=Math.max(f.fz||0,t)}}
function duelBurnOut(dps){if(DU.ph==='fight'){const f=duelFxOut();f.bn=Math.max(f.bn||0,Math.round(dps))}}
/* displacement: keep only the strongest push of this tick (skills that push every frame must not add up) */
function duelPushOut(dx,dz,dist){
  const l=Math.hypot(dx,dz);if(DU.ph!=='fight'||l<.01||!(dist>.05))return;
  const f=duelFxOut(),o=f.mv;if(!o||Math.hypot(o[0],o[1])<dist)f.mv=[+(dx/l*dist).toFixed(2),+(dz/l*dist).toFixed(2)];
}
function duelMoveOut(x,z){if(DU.ph==='fight')duelFxOut().to=[+x.toFixed(2),+z.toFixed(2)]}   // carried or thrown to a spot
function duelFxIn(d){
  if(+d.bn>0){DU.burnT=3;DU.burnD=Math.max(DU.burnD||0,Math.min(+d.bn,S.maxHp*2))}
  /* stun is halved and capped, then there is a short immunity so that ice hits cannot lock someone forever */
  if(+d.fz>0&&!(P.stunT>0)&&!(P.stunImm>0)){P.stunT=Math.min(1.5,d.fz*.6);P.stunImm=P.stunT+1.5;P.vx=P.vz=0;dmgNum(P.x,3.6,P.z,'기절!','info')}
  const V=a=>Array.isArray(a)&&isFinite(a[0])&&isFinite(a[1]);
  let dx=0,dz=0;
  if(V(d.to)){const e={x:+d.to[0],z:+d.to[1]};duelClampXZ(e);dx=e.x-P.x;dz=e.z-P.z}
  else if(V(d.mv)){dx=+d.mv[0];dz=+d.mv[1];const l=Math.hypot(dx,dz);if(l>9){dx*=9/l;dz*=9/l}}
  if(dx||dz){DU.kn={vx:dx/.18,vz:dz/.18,t:.18};if(P.recall>0)cancelRecall('')}
}
function duelHurt(raw){
  let dmg=Math.max(1,Math.round(raw*(1-S.armor)*(P.hb?(hbOn('ar')?.72:hbOn('my')?.85:1):1)*(P.qGuard>0?.4:1)*(P.golemGuard>0?.7:1)*(P.dkGuard>0?.6:1)));
  if(P.shield>0){const ab=Math.min(P.shield,dmg);P.shield-=ab;dmg-=ab}
  if(dmg>0){P.hp-=dmg;dmgNum(P.x,3,P.z,'-'+dmg,'hurt');sfx('hurt');vignette(.6);cam.shake=Math.max(cam.shake,.25)}
  if(P.hp<=0){P.hp=1;duelLose()}
}
function duelTickFx(dt){
  if(P.stunImm>0)P.stunImm-=dt;
  if(P.stunT>0){P.stunT-=dt;if(Math.random()<dt*14)emit(P.x+rnd(-.6,.6),rnd(1.6,2.8),P.z+rnd(-.6,.6),0,.5,0,.4,0xffe27a,0)}
  if(DU.kn){const k=DU.kn,s=Math.min(dt,k.t);P.x+=k.vx*s;P.z+=k.vz*s;pushOut(P,P.r);k.t-=dt;if(k.t<=0)DU.kn=null}
  if(DU.burnT>0){DU.burnT-=dt;DU.burnC=(DU.burnC||0)-dt;if(DU.burnC<=0){DU.burnC=.5;burst(P.x,1.2,P.z,6,0xff7a2a,3,.4,-2);duelHurt(Math.min(DU.burnD*.5*DUEL_K,S.maxHp*.04))}if(DU.burnT<=0)DU.burnD=0}
}
function duelClearFx(){DU.fx=null;DU.kn=null;DU.burnT=0;DU.burnD=0;DU.burnC=0;DU.out=0;if(P){P.stunT=0;P.stunImm=0}}

/* ---------- HUD ---------- */

    const st=document.createElement('style');st.textContent='#duel{position:fixed;left:50%;top:44px;transform:translateX(-50%);z-index:21;width:min(300px,64vw);padding:4px 10px;border-radius:12px;background:rgba(12,14,26,.86);border:1px solid #ffd24a;color:#fff;font-size:13px;text-align:center;display:none}#duel .r{display:flex;gap:8px;align-items:center;margin-top:2px;font-size:12px}#duel .r b{width:68px;text-align:left;overflow:hidden;white-space:nowrap}#duel .r i{flex:1;height:10px;background:#2a1c24;border-radius:5px;overflow:hidden}#duel .r i s{display:block;height:100%;background:#ff5a6a}#duel button{margin-top:3px;padding:2px 14px;border-radius:12px;border:1px solid #8890a8;background:#222842;color:#fff}';
    document.head.appendChild(st);
    const e=document.createElement('div');e.id='duel';e.innerHTML='<div></div><div class="r"><b></b><i><s></s></i></div><div class="r"><b></b><i><s></s></i></div><button></button>';document.body.appendChild(e);
    const k=e.children;DU.hud={e,title:k[0],rows:[k[1],k[2]],btn:k[3]};
    if(DU.hud.btn)DU.hud.btn.onclick=()=>duelQuit();
  }
