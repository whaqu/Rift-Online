<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Rift Wardens 어드민</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#12151f;color:#e4e6ec;font:14px/1.5 system-ui,'Malgun Gothic',sans-serif}
main{max-width:860px;margin:0 auto;padding:24px 16px}
h1{font-size:20px;margin:0 0 16px}
.hidden{display:none!important}
input{padding:9px 11px;border-radius:7px;border:1px solid #4a5578;background:#1b2030;color:inherit;font:inherit}
button{padding:8px 14px;border-radius:7px;border:1px solid #4a5578;background:#2c3452;color:inherit;font:inherit;cursor:pointer}
button.danger{background:#8a2f36;border-color:#b2474f}
button:disabled{opacity:.5;cursor:default}
#login{display:grid;gap:8px;max-width:300px}
#bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
#q{flex:1;min-width:140px}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;white-space:nowrap}
th,td{padding:9px 8px;border-bottom:1px solid #2c3452;text-align:left}
td.act{text-align:right}td.act button{margin-left:6px;padding:5px 11px}
tr.del td:not(.act){opacity:.5}
#msg{min-height:22px;margin:10px 0;color:#ffd27a}
.dim{color:#8b93aa;font-size:12px}
</style>
</head>
<body>
<main>
<h1>Rift Wardens 어드민</h1>
<form id="login">
  <input id="name" placeholder="관리자 계정 이름" autocomplete="username" required maxlength="10">
  <input id="pass" type="password" placeholder="비밀번호" autocomplete="current-password" required maxlength="40">
  <button id="go">로그인</button>
</form>
<section id="panel" class="hidden">
  <form id="bar">
    <input id="q" placeholder="계정 이름 검색" maxlength="10">
    <button>검색</button>
    <button type="button" id="out">로그아웃</button>
  </form>
  <div class="wrap"><table>
    <thead><tr><th>이름</th><th>직업</th><th>레벨</th><th>골드</th><th>처치</th><th>가입일</th><th></th></tr></thead>
    <tbody id="rows"></tbody>
  </table></div>
  <p class="dim">삭제한 계정은 로그인할 수 없으며 복구할 수 있습니다. 영구 삭제는 되돌릴 수 없습니다. 최근 가입순 100개까지 표시합니다.</p>
</section>
<div id="msg" role="status"></div>
</main>
<script>
// 권한 검사는 서버(rw_admin_*)가 한다. 이 파일의 키는 게임과 같은 공개(anon) 키다.
const URL_='https://vrdegvpgbmfdkkylkyic.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZyZGVndnBnYm1mZGtreWxreWljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU1OTc2NjEsImV4cCI6MjExMTE3MzY2MX0.hAkPkneofLolnsampMNNX_S1iEyWTZPT5aLOV6PMYnQ';
const ERR={BAD_LOGIN:'이름 또는 비밀번호가 틀렸거나 관리자 계정이 아닙니다.',LOCKED:'로그인 시도가 너무 많습니다. 5분 뒤 다시 시도해주세요.',BAD_AUTH:'관리자 세션이 만료되었습니다. 다시 로그인해주세요.',BAD_TARGET:'대상 계정의 상태가 바뀌었습니다. 다시 검색해주세요.',TARGET_ADMIN:'관리자 계정은 삭제할 수 없습니다.',NOT_DELETED:'먼저 삭제한 계정만 영구 삭제할 수 있습니다.',NET:'서버에 연결할 수 없습니다.'};
const JOB={warrior:'전사',mage:'마법사',archer:'궁수',rogue:'도적',cleric:'성직자',lancer:'창기사',monk:'권사',gunner:'총잡이',summoner:'소환사',darknight:'암흑기사'};
const $=id=>document.getElementById(id);
let me='',token='',busy=false;
const say=t=>{$('msg').textContent=t||''};
const fail=e=>{say(ERR[e.message]||'요청에 실패했습니다. ('+e.message+')');if(e.message==='BAD_AUTH')showLogin()};

async function rpc(fn,args){
  let r;
  try{r=await fetch(URL_+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(args)})}
  catch(e){throw new Error('NET')}
  const text=await r.text();let j=null;try{j=JSON.parse(text)}catch(e){}
  if(!r.ok)throw new Error((j&&j.message)||'NET');
  return j;
}
function showLogin(){token='';$('panel').classList.add('hidden');$('login').classList.remove('hidden');$('rows').replaceChildren()}

async function load(){
  const list=await rpc('rw_admin_list',{p_name:me,p_token:token,p_q:$('q').value.trim()});
  $('rows').replaceChildren(...list.map(row));
  if(!list.length)say('계정이 없습니다.');
}
function row(a){
  const tr=document.createElement('tr');if(a.deleted)tr.className='del';
  for(const v of[a.name+(a.deleted?' [삭제됨]':''),JOB[a.cls]||a.cls,a.level,Number(a.gold).toLocaleString(),Number(a.kills).toLocaleString(),String(a.created).slice(0,10)]){
    const td=document.createElement('td');td.textContent=v;tr.appendChild(td);
  }
  const td=document.createElement('td');td.className='act';tr.appendChild(td);
  const btn=(label,action,danger)=>{const b=document.createElement('button');b.textContent=label;b.dataset.action=action;if(danger)b.className='danger';b.onclick=()=>act(a.name,action);td.appendChild(b)};
  if(a.admin)td.textContent='관리자';
  else if(a.deleted){btn('복구','restore');btn('영구 삭제','purge',true)}
  else btn('삭제','delete',true);
  return tr;
}
async function act(target,action){
  if(busy)return;
  if(action==='delete'&&!confirm(target+' 계정을 삭제할까요?\n로그인이 차단되고 경매 등록이 취소됩니다. 나중에 복구할 수 있습니다.'))return;
  if(action==='purge'&&prompt(target+' 계정을 영구 삭제합니다. 캐릭터와 아이템이 모두 사라지며 되돌릴 수 없습니다.\n계속하려면 계정 이름을 입력하세요.')!==target)return;
  busy=true;say('');
  try{
    await rpc('rw_admin_account',{p_name:me,p_token:token,p_target:target,p_action:action});
    await load();say(target+({delete:' 계정을 삭제했습니다.',restore:' 계정을 복구했습니다.',purge:' 계정을 영구 삭제했습니다.'})[action]);
  }catch(e){fail(e)}
  busy=false;
}
$('login').onsubmit=async e=>{
  e.preventDefault();say('');$('go').disabled=true;
  try{
    const name=$('name').value.trim(),r=await rpc('rw_admin_login',{p_name:name,p_pass:$('pass').value});
    if(r.error)throw new Error(r.error);
    me=name;token=r.token;$('pass').value='';
    $('login').classList.add('hidden');$('panel').classList.remove('hidden');
    await load();
  }catch(err){fail(err)}
  $('go').disabled=false;
};
$('bar').onsubmit=e=>{e.preventDefault();say('');load().catch(fail)};
$('out').onclick=()=>{rpc('rw_admin_logout',{p_name:me,p_token:token}).catch(()=>{});showLogin();say('로그아웃했습니다.')};
</script>
</body>
</html>
