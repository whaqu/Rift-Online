<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14161c">
<title>리프트 온라인</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gothic+A1:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#10121a;--pn:#1c2030;--pn2:#262c3f;--bd:#383f57;--ac:#d9b05a;--ac2:#f0d283;--tx:#e8eaf0;--dim:#8f96ab;--red:#d9534f;--blu:#4a8fd9;--grn:#5fb878;--ft:'Gothic A1','Malgun Gothic','Apple SD Gothic Neo','Noto Sans CJK KR',sans-serif;--fh:'Do Hyeon','Gothic A1','Malgun Gothic','Noto Sans CJK KR',sans-serif;
--pg:linear-gradient(180deg,#272d42 0%,#1a1e2d 100%);--gold:linear-gradient(180deg,#f3d98a 0%,#d4a843 52%,#a97a28 100%)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:var(--ft);font-size:14px;overscroll-behavior:none;touch-action:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:none}
body:not(.touch) #gl{filter:saturate(1.14) contrast(1.05)}
.hidden{display:none!important}
svg.ic{vertical-align:middle;flex:none}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#3d4560;border-radius:4px}::-webkit-scrollbar-track{background:transparent}
/* common frame */
.fr{position:relative;background:var(--pg);border:1px solid #3a4260;border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.08),inset 0 0 0 1px rgba(0,0,0,.4)}
.fr::before{content:'';position:absolute;inset:3px;border:1px solid rgba(217,176,90,.2);border-radius:7px;pointer-events:none}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.nl{position:absolute;left:0;top:0;font-size:12px;font-weight:700;padding:1px 8px;background:linear-gradient(180deg,rgba(12,14,22,.72),rgba(12,14,22,.55));border:1px solid rgba(255,255,255,.08);border-radius:9px;white-space:nowrap;text-shadow:0 1px 2px #000;will-change:transform}
.nl.st{color:var(--ac2);font-size:13px;border-color:rgba(217,176,90,.45)}
.nl.pl{color:#bcd7ff}
.ml{position:absolute;left:0;top:0;text-align:center;font-size:11px;font-weight:700;white-space:nowrap;text-shadow:-1px 0 #000,1px 0 #000,0 1px #000,0 -1px #000;will-change:transform;display:none}
.ml .mn{display:block;color:#eceff5;margin-bottom:2px}
.ml.hi .mn{color:#ff9b8b}.ml.lo .mn{color:#a2a9b4}.ml.el .mn{color:#ffd24a}
.ml .mb{display:block;width:54px;height:6px;background:#0a0b10;margin:0 auto;border-radius:3px;overflow:hidden;border:1px solid #000;box-shadow:0 0 0 1px rgba(255,255,255,.1)}
.ml .mb b{display:block;height:100%;width:100%;background:linear-gradient(180deg,#ff7a6a,#c0392b 60%,#8e2a20)}
.ml.el .mb{width:64px;box-shadow:0 0 0 1px rgba(255,210,74,.7)}
.dn{position:absolute;left:0;top:0;font-family:var(--fh);font-size:18px;color:#fff;letter-spacing:.02em;text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000,0 2px 5px rgba(0,0,0,.7);will-change:transform,opacity;pointer-events:none}
.dn.crit{color:#ffe27a;font-size:29px;text-shadow:-1.5px -1.5px 0 #5a2a00,1.5px -1.5px 0 #5a2a00,-1.5px 1.5px 0 #5a2a00,1.5px 1.5px 0 #5a2a00,0 0 14px #ff9a2a,0 0 4px #fff3b0}
.dn.hurt{color:#ff6e6e;font-size:23px}.dn.heal{color:#8af0ac}.dn.gold{color:#ffd24a;font-size:15px}.dn.info{color:#9bd6ff;font-size:17px}.dn.xp{color:#a9e6ff;font-size:14px}.dn.burn{color:#ffa45a;font-size:14px}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#hud>*{position:absolute}
#pinfo{left:12px;top:10px;width:272px;padding:8px 10px 8px 62px;min-height:66px}
#pinfo .lvb{position:absolute;left:-2px;top:-2px;width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 35% 28%,#454f78,#171b2c 72%);border:2px solid var(--ac);box-shadow:0 0 0 3px #14161f,0 0 14px rgba(217,176,90,.4),inset 0 2px 6px rgba(255,255,255,.15);display:grid;place-items:center;text-align:center;line-height:1}
#pinfo .lvb small{display:block;font-size:9px;color:var(--ac2);font-weight:700;letter-spacing:.12em}
#pinfo .lvb b{display:block;font-family:var(--fh);font-weight:400;font-size:24px;color:#fff;text-shadow:0 1px 3px #000;margin-top:-4px}
#pinfo .r1{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--fh);font-size:16px}
#pinfo .r1 small{color:var(--ac2);font-family:var(--ft);font-size:12px;font-weight:700}
.bar{position:relative;height:18px;background:#090a0f;border:1px solid #000;border-radius:9px;overflow:hidden;margin-top:4px;box-shadow:0 0 0 1px rgba(255,255,255,.1),inset 0 2px 4px rgba(0,0,0,.7)}
.bar i{position:absolute;left:0;top:0;bottom:0;display:block;border-radius:9px}
.bar::after{content:'';position:absolute;left:3px;right:3px;top:2px;height:5px;border-radius:5px;background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,0));pointer-events:none}
.bar b{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:700;text-shadow:0 1px 2px #000,0 0 3px #000;z-index:2}
#hpfill{background:linear-gradient(180deg,#f06a58,#c33a2c 55%,#8f241b);width:100%;transition:width .12s}#shfill{background:linear-gradient(180deg,rgba(170,215,255,.85),rgba(90,150,235,.75));width:0}
#xpbar{height:8px;margin-top:4px;border-radius:4px}#xpbar::after{display:none}
#xpfill{background:linear-gradient(180deg,#ffe9a0,#d9a93e 60%,#a9791f);width:0;border-radius:4px;transition:width .3s}
#xpbar::before{content:'';position:absolute;inset:0;z-index:3;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(10% - 1px),rgba(0,0,0,.55) calc(10% - 1px),rgba(0,0,0,.55) 10%);pointer-events:none}
#pinfo .r3{display:flex;justify-content:space-between;margin-top:5px;font-size:12px;color:var(--dim)}
#perkrow{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap;cursor:pointer;min-height:0}#perkrow:empty{display:none}
#perkrow .pk{font-size:10px;font-weight:700;padding:1px 5px;border-radius:7px;background:rgba(10,12,20,.6);border:1px solid rgba(255,255,255,.12);text-shadow:0 1px 2px #000;line-height:14px}
#perkrow .pkb{font-size:10px;font-weight:800;padding:1px 7px;border-radius:7px;background:linear-gradient(#f3d27a,#c79a3a);color:#2a1d05;border:0;animation:pkp 1s ease-in-out infinite;line-height:14px}
@keyframes pkp{50%{transform:scale(1.08);box-shadow:0 0 8px rgba(255,214,110,.8)}}
.pkc{padding:12px;border:1px solid var(--bd);border-radius:10px;background:#1b2030;margin-bottom:8px;display:flex;align-items:center;gap:12px}.pkc b{font-size:15px}.pkc .dim{font-size:12px}.pkc .btn{margin-left:auto}
#pinfo .gold{color:#ffd96a;font-weight:700;text-shadow:0 1px 2px #000}
#hud-tr{right:12px;top:10px;display:flex;flex-direction:column;align-items:flex-end;gap:7px}
#zone{padding:4px 16px 5px;font-family:var(--fh);font-size:16px;text-align:center;color:var(--ac2);letter-spacing:.04em}
#zone small{display:block;color:var(--dim);font-family:var(--ft);font-size:11px;letter-spacing:0}
#mini{width:132px;height:132px;border-radius:50%;border:3px solid #14161f;background:rgba(10,12,18,.75);box-shadow:0 0 0 2px var(--ac),0 6px 16px rgba(0,0,0,.55),inset 0 0 18px rgba(0,0,0,.6)}
#menu{display:flex;gap:6px;pointer-events:auto}
.mbtn{pointer-events:auto;cursor:pointer;width:40px;height:40px;border-radius:10px;background:var(--pg);border:1px solid #3a4260;color:var(--tx);display:grid;place-items:center;position:relative;box-shadow:0 3px 8px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.1);transition:transform .08s,border-color .15s,box-shadow .15s}
.mbtn:hover{border-color:var(--ac);box-shadow:0 0 10px rgba(217,176,90,.45),inset 0 1px 0 rgba(255,255,255,.12);transform:translateY(-1px)}
.mbtn small{position:absolute;right:3px;bottom:1px;font-size:9px;color:var(--dim);font-weight:700}
#netline{font-size:11px;color:var(--dim);background:rgba(14,16,24,.72);padding:2px 10px;border-radius:9px;border:1px solid rgba(255,255,255,.07)}
#netline i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#666;margin-right:5px}
#netline i.on{background:var(--grn);box-shadow:0 0 6px var(--grn)}
#partybox{left:12px;top:92px;display:flex;flex-direction:column;gap:5px;pointer-events:none}
.pm{width:176px;padding:4px 9px 5px;font-size:12px;border-radius:8px}
.pm::before{display:none}
.pm .b{height:6px;background:#090a0f;margin-top:3px;border-radius:3px;overflow:hidden;border:1px solid #000}.pm .b i{display:block;height:100%;background:linear-gradient(180deg,#7be0a0,#35a265)}
.pm.ld b:first-child::before{content:'°5 ';color:var(--ac2)}
#feed{left:12px;bottom:206px;display:flex;flex-direction:column;gap:3px;pointer-events:none;max-width:310px}
#feed div{font-size:12px;background:linear-gradient(90deg,rgba(12,14,22,.8),rgba(12,14,22,.35));padding:2px 10px;border-radius:3px;border-left:3px solid #888;animation:fin .25s}
@keyframes fin{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
#chat{left:12px;bottom:12px;width:340px;pointer-events:none}
#chatlog{max-height:120px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;font-size:12px;line-height:1.5;text-shadow:0 1px 2px #000}
#chatlog div{background:linear-gradient(90deg,rgba(12,14,22,.6),rgba(12,14,22,0));padding:0 8px}
#chatlog .n{color:#9fc8ff;font-weight:700}#chatlog .party .n{color:#7fe0a0}#chatlog .sys{color:var(--ac2)}
#chatin{pointer-events:auto;width:100%;margin-top:3px;background:rgba(12,14,22,.9);border:1px solid var(--bd);border-radius:6px;color:var(--tx);padding:6px 10px;font-family:var(--ft);font-size:13px;outline:none;-webkit-user-select:text;user-select:text;display:none}
#chatin.on{display:block;border-color:var(--ac);box-shadow:0 0 8px rgba(217,176,90,.3)}
#bar{left:50%;bottom:12px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:7px}
#quick,#skills{display:flex;gap:7px;pointer-events:auto}
.qs,.sk{position:relative;width:48px;height:48px;border-radius:10px;background:radial-gradient(circle at 50% 30%,#2e3550,#161a28 78%);border:2px solid #404862;display:grid;place-items:center;cursor:pointer;overflow:hidden;box-shadow:0 4px 10px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.12)}
.sk{width:60px;height:60px;border-radius:12px}
.qs .ct{position:absolute;right:4px;bottom:1px;font-size:12px;font-weight:700;text-shadow:-1px 0 #000,1px 0 #000,0 1px #000}
.qs .kk,.sk .kk{position:absolute;left:3px;top:2px;font-size:10px;font-weight:700;color:#cfd4e4;background:rgba(0,0,0,.55);border-radius:4px;padding:0 4px;line-height:14px;z-index:3}
.qs.off{opacity:.38}
.qs .cdm,.sk .cdm{position:absolute;inset:0;background:rgba(4,5,10,.7);transform-origin:bottom;transform:scaleY(0);z-index:2}
.sk .ic0{position:absolute;inset:0;display:grid;place-items:center;padding-bottom:8px}
.sk .cdt{position:absolute;inset:0;display:grid;place-items:center;font-size:20px;font-weight:700;text-shadow:0 1px 4px #000;z-index:4}
.sk.rdy{border-color:var(--ac);box-shadow:0 4px 10px rgba(0,0,0,.5),0 0 12px rgba(217,176,90,.35),inset 0 0 10px rgba(217,176,90,.18)}
.sk .nm{position:absolute;bottom:2px;left:0;right:0;text-align:center;font-size:9.5px;color:#c9cee0;white-space:nowrap;overflow:hidden;z-index:3;text-shadow:0 1px 2px #000}
#prompt{left:50%;bottom:158px;transform:translateX(-50%);background:var(--pg);border:1px solid var(--ac);border-radius:18px;padding:7px 20px;font-weight:700;opacity:0;transition:opacity .15s;pointer-events:none;box-shadow:0 0 14px rgba(217,176,90,.35),0 6px 16px rgba(0,0,0,.5)}
#prompt.show{opacity:1;pointer-events:auto;cursor:pointer}
#prompt kbd{background:linear-gradient(180deg,#fff,#c8ccd8);color:#111;border-radius:5px;padding:0 7px;margin-right:8px;font-family:var(--ft);font-weight:700;box-shadow:0 2px 0 #7a8094}
#vign{position:fixed;inset:0;pointer-events:none;z-index:8;background:radial-gradient(ellipse at center,transparent 55%,rgba(200,30,40,.55));opacity:0;transition:opacity .25s}
#vig2{position:fixed;inset:0;pointer-events:none;z-index:7;background:radial-gradient(ellipse at center,transparent 62%,rgba(4,5,12,.5))}
#dead{position:fixed;inset:0;z-index:20;background:radial-gradient(ellipse at center,rgba(40,0,4,.55),rgba(8,0,2,.85));display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;pointer-events:none}
#dead.on{display:flex}#dead h2{font-family:var(--fh);font-size:46px;font-weight:400;color:#f08a8a;letter-spacing:.12em;text-shadow:0 0 24px rgba(255,60,60,.5),0 3px 0 #300}#dead p{color:#b9a0a0}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:70;background:var(--pg);border:1px solid var(--ac);padding:8px 22px;border-radius:20px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;text-align:center;max-width:90vw;box-shadow:0 0 16px rgba(217,176,90,.3),0 8px 20px rgba(0,0,0,.5)}
#toast.show{opacity:1}
#invite{position:fixed;left:50%;top:110px;transform:translateX(-50%);z-index:70;background:var(--pg);border:1px solid var(--ac);padding:10px 18px;border-radius:12px;display:none;gap:10px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.55)}
#invite.on{display:flex}
/* windows */
#modalbg{position:fixed;inset:0;z-index:40;background:radial-gradient(ellipse at center,rgba(6,7,14,.45),rgba(4,5,10,.78));backdrop-filter:blur(2px);display:none;align-items:center;justify-content:center;touch-action:pan-y}
#modalbg.on{display:flex}
.win{position:relative;background:var(--pg);border:1px solid #3d4562;border-radius:12px;box-shadow:0 24px 70px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.09);width:min(720px,96vw);max-height:92vh;display:flex;flex-direction:column;overflow:hidden;animation:winin .16s ease-out}
@keyframes winin{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.win::before{content:'';position:absolute;inset:4px;border:1px solid rgba(217,176,90,.16);border-radius:9px;pointer-events:none}
.win>.hd{position:relative;display:flex;justify-content:space-between;align-items:center;padding:11px 16px;background:linear-gradient(180deg,#303756,#232943);font-family:var(--fh);font-size:20px;letter-spacing:.03em;color:var(--ac2)}
.win>.hd::after{content:'';position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,transparent,var(--ac) 30%,var(--ac) 70%,transparent)}
.win>.hd>span:first-child::before{content:'';display:inline-block;width:8px;height:8px;background:var(--ac);transform:rotate(45deg);margin-right:10px;vertical-align:middle;position:relative;top:-1px}
.win>.hd .x{cursor:pointer;width:30px;height:30px;display:grid;place-items:center;border-radius:50%;transition:background .15s}.win>.hd .x:hover{background:#454d6c}
.win>.bd{padding:14px 16px;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;-webkit-user-select:text;user-select:text}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tab{cursor:pointer;padding:6px 16px;border-radius:16px;background:#232940;border:1px solid var(--bd);font-weight:700;font-size:13px;color:#b5bbd0;transition:all .15s}.tab:hover{border-color:#5a6590}.tab.on{border-color:var(--ac);color:#2a1d06;background:var(--gold);box-shadow:0 0 10px rgba(217,176,90,.3)}
.btn{cursor:pointer;border:1px solid #7d5a1c;border-radius:7px;padding:8px 18px;font-family:var(--ft);font-weight:700;font-size:13px;color:#2a1d06;background:var(--gold);box-shadow:0 2px 0 #6b4a14,0 4px 8px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.55);text-shadow:0 1px 0 rgba(255,255,255,.35);transition:filter .12s,transform .06s}
.btn:hover{filter:brightness(1.1)}.btn:active{transform:translateY(2px);box-shadow:0 0 0 #6b4a14,inset 0 1px 0 rgba(255,255,255,.4)}
.btn.sec{background:linear-gradient(180deg,#3a4262,#283050);border-color:#4a5578;color:var(--tx);box-shadow:0 2px 0 #181c2c,0 4px 8px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.14);text-shadow:none}.btn.red{background:linear-gradient(180deg,#d06058,#9a322d);border-color:#6a1f1c;color:#fff;box-shadow:0 2px 0 #5a1a17,0 4px 8px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.3);text-shadow:none}
.btn.sm{padding:4px 12px;font-size:12px;border-radius:6px}.btn[disabled]{opacity:.4;cursor:not-allowed;filter:grayscale(.4)}
.row{display:flex;gap:8px;align-items:center}.row.sp{justify-content:space-between}.row.wrap{flex-wrap:wrap}
.grid{display:grid;gap:7px}
.card{background:linear-gradient(180deg,#2a3048,#222840);border:1px solid #3a4260;border-radius:8px;padding:10px 12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.item{display:flex;align-items:center;gap:11px;background:linear-gradient(90deg,#2b3149,#242a40);border:1px solid #3a4260;border-left:3px solid var(--tc,#3a4260);border-radius:8px;padding:6px 11px 6px 8px;cursor:pointer;transition:border-color .12s,background .12s}
.item:hover{border-color:#5d6890;border-left-color:var(--tc,#5d6890);background:linear-gradient(90deg,#323a56,#292f48)}.item.sel{border-color:var(--ac);border-left-color:var(--tc,var(--ac));box-shadow:0 0 10px rgba(217,176,90,.22)}.item.eq{box-shadow:inset 0 0 0 1px rgba(217,176,90,.35)}
.ico{width:42px;height:42px;border-radius:9px;display:grid;place-items:center;flex:none;background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--tc,#6b7390) 38%,#1a1e2e),#12151f 78%);border:1px solid color-mix(in srgb,var(--tc,#6b7390) 70%,#000);box-shadow:inset 0 0 10px color-mix(in srgb,var(--tc,#6b7390) 35%,transparent),0 2px 5px rgba(0,0,0,.4)}
.item .nm{font-weight:700}.item .sub{font-size:11.5px;color:var(--dim)}.item .rt{margin-left:auto;text-align:right;font-size:12px}
.gold{color:#ffd96a}.dim{color:var(--dim)}.red{color:#ff7a70}.grn{color:#86e8a8}
.ench{display:inline-block;font-size:11px;padding:0 6px;border-radius:9px;background:#313955;border:1px solid #4a5578;margin-right:3px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.list{display:flex;flex-direction:column;gap:6px;max-height:48vh;overflow:auto;touch-action:pan-y;padding-right:2px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}.kv span:nth-child(odd){color:var(--dim)}
hr{border:0;height:1px;background:linear-gradient(90deg,transparent,#454d6c,transparent);margin:10px 0}
input.tx,select.tx{background:#0d0f17;border:1px solid var(--bd);border-radius:7px;color:var(--tx);padding:9px 12px;font-family:var(--ft);font-size:14px;outline:none;width:100%;-webkit-user-select:text;user-select:text;box-shadow:inset 0 2px 5px rgba(0,0,0,.5);transition:border-color .15s,box-shadow .15s}
input.tx:focus{border-color:var(--ac);box-shadow:inset 0 2px 5px rgba(0,0,0,.5),0 0 10px rgba(217,176,90,.3)}
/* login */
#login{position:fixed;inset:0;z-index:50;background:linear-gradient(100deg,rgba(7,9,15,.92) 0%,rgba(7,9,15,.7) 34%,rgba(7,9,15,.12) 62%,rgba(7,9,15,0) 100%);display:flex;align-items:flex-start;justify-content:flex-start;padding:12px 12px 12px max(4vw,16px);overflow:auto;touch-action:pan-y}
#login .box{position:relative;margin:auto 0;width:min(430px,94vw);background:linear-gradient(180deg,rgba(32,38,58,.82),rgba(18,21,33,.88));backdrop-filter:blur(10px);border:1px solid #3d4562;border-radius:14px;padding:26px 26px 22px;box-shadow:0 24px 70px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.1)}
#login .box::before{content:'';position:absolute;inset:5px;border:1px solid rgba(217,176,90,.22);border-radius:10px;pointer-events:none}

<script>
'use strict';
/* =====================================================================
   core: math, audio, three setup, particles, fx, labels, input
   ===================================================================== */
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a);
const rndi=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const d2=(ax,az,bx,bz)=>{const dx=ax-bx,dz=az-bz;return dx*dx+dz*dz};
const angDiff=(a,b)=>{let d=(b-a)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d};
const lerpAng=(a,b,t)=>a+angDiff(a,b)*t;
const easeOut=t=>1-(1-t)*(1-t);
const $=id=>document.getElementById(id);
const fmtTime=s=>{s=Math.max(0,Math.floor(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const fmtN=n=>Math.floor(n).toLocaleString('ko-KR');

/* ---------------- settings ---------------- */
const SET_KEY='rw_settings_v1';
const IS_TOUCH=(typeof matchMedia==='function')?(matchMedia('(pointer:coarse)').matches||(('ontouchstart' in window)&&!matchMedia('(any-pointer:fine)').matches)):('ontouchstart' in window);
const save={fx:true,treeQ:IS_TOUCH?0:1,vol:.7,shadows:!IS_TOUCH,auto:IS_TOUCH,outline:!IS_TOUCH,lastName:''};
function loadSave(){try{const s=JSON.parse(localStorage.getItem(SET_KEY)||'null');if(s)Object.assign(save,s)}catch(e){}}
function writeSave(){try{localStorage.setItem(SET_KEY,JSON.stringify(save))}catch(e){}}

/* ---------------- audio (all synthesized) ---------------- */
const AU={ctx:null,mg:null,sg:null,mus:null,mode:null,tick:null,step:0,vm:1,pj:1,zid:0,amb:null};
function auInit(){
  if(AU.ctx){if(AU.ctx.state==='suspended')AU.ctx.resume();return}
  try{
    const C=window.AudioContext||window.webkitAudioContext;AU.ctx=new C();
    AU.mg=AU.ctx.createGain();AU.mg.gain.value=save.vol;AU.mg.connect(AU.ctx.destination);
    AU.sg=AU.ctx.createGain();AU.sg.gain.value=.85;AU.sg.connect(AU.mg);
    AU.mus=AU.ctx.createGain();AU.mus.gain.value=.32;AU.mus.connect(AU.mg);
    AU.ag=AU.ctx.createGain();AU.ag.gain.value=1;AU.ag.connect(AU.mg);
    const n=AU.ctx.sampleRate*1.5,b=AU.ctx.createBuffer(1,n,AU.ctx.sampleRate),d=b.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=Math.random()*2-1;AU.nb=b;
    ambStart();
    if(AU.mode)musicMode(AU.mode);
  }catch(e){AU.ctx=null}
}
function setVol(v){save.vol=v;if(AU.mg)AU.mg.gain.value=v;writeSave()}
function tone(f,d,type,v,slide,delay,dest){
  if(!AU.ctx)return;const t=AU.ctx.currentTime+(delay||0);
  const o=AU.ctx.createOscillator(),g=AU.ctx.createGain();o.type=type||'sine';
  f*=AU.pj;v=(v||.2)*AU.vm;
  o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(25,f+slide),t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,v),t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(dest||AU.sg);o.start(t);o.stop(t+d+.05);
}
function noise(d,v,fq,delay,type){
  if(!AU.ctx||!AU.nb)return;const t=AU.ctx.currentTime+(delay||0);
  v*=AU.vm;const s=AU.ctx.createBufferSource();s.buffer=AU.nb;s.playbackRate.value=.85+Math.random()*.3;const f=AU.ctx.createBiquadFilter();f.type=type||'lowpass';f.frequency.value=(fq||1500)*AU.pj;
  const g=AU.ctx.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  s.connect(f);f.connect(g);g.connect(AU.sg);s.start(t);s.stop(t+d+.05);
}
const SFX={
  click:()=>tone(660,.07,'square',.06),
  slash:()=>{noise(.14,.22,2600,0,'bandpass');tone(300,.12,'sawtooth',.05,-180)},
  hit:()=>{noise(.07,.2,900);tone(160,.08,'square',.09,-60)},
  crit:()=>{noise(.1,.25,1400);tone(520,.12,'square',.1,200);tone(780,.1,'triangle',.08,0,.02)},
  shot:()=>{tone(880,.1,'triangle',.07,-500)},
  magic:()=>{tone(520,.2,'sine',.1,380);tone(1040,.14,'triangle',.05,-300,.02)},
  boom:()=>{noise(.5,.45,500);tone(90,.4,'sawtooth',.16,-50)},
  dash:()=>{noise(.18,.2,3200,0,'highpass')},
  pickup:()=>tone(1200+Math.random()*300,.08,'sine',.06),
  coin:()=>{tone(1480,.07,'square',.05);tone(1980,.1,'square',.05,0,.05)},
  level:()=>{[523,659,784,1046].forEach((f,i)=>tone(f,.25,'triangle',.12,0,i*.08))},
  hurt:()=>{noise(.2,.35,600);tone(130,.2,'sawtooth',.14,-70)},
  card:()=>{[440,554,659].forEach((f,i)=>tone(f,.2,'triangle',.1,0,i*.05))},
  win:()=>{[523,659,784,1046,1318].forEach((f,i)=>tone(f,.5,'triangle',.14,0,i*.14))},
  lose:()=>{[392,330,262,196].forEach((f,i)=>tone(f,.6,'sawtooth',.1,0,i*.2))},
  roar:()=>{noise(1.1,.5,300);tone(70,1.1,'sawtooth',.22,30)},
  tele:()=>tone(240,.2,'sine',.05,160),
  spawn:()=>tone(180,.25,'sine',.06,300),
  ice:()=>{tone(1400,.3,'triangle',.08,-900);noise(.25,.14,4000,0,'highpass')},
  portal:()=>{[262,330,392,523].forEach((f,i)=>tone(f,.9,'sine',.07,0,i*.12))},
  emote:()=>tone(900,.12,'sine',.08,300),
  hit_flesh:()=>{noise(.09,.22,700);tone(120,.09,'square',.1,-50);tone(70,.12,'sine',.12)},
  hit_bone:()=>{noise(.05,.2,3000,0,'highpass');tone(820,.07,'square',.07,-300);tone(220,.08,'triangle',.08)},
  hit_stone:()=>{noise(.12,.3,420);tone(90,.18,'sine',.18,-30);tone(1500,.04,'square',.03)},
  hit_ice:()=>{tone(1700,.12,'triangle',.07,-700);noise(.08,.15,5000,0,'highpass');tone(300,.08,'square',.05)},
  hit_metal:()=>{tone(1300,.14,'square',.05,-100);tone(1950,.2,'sine',.05);noise(.04,.2,4000,0,'highpass')},
  hit_ghost:()=>{tone(520,.2,'sine',.08,-260);noise(.1,.1,2200,0,'bandpass')},
  hit_slime:()=>{tone(240,.14,'sine',.14,220);tone(160,.1,'sine',.1,120,.03)},
  hit_chitin:()=>{noise(.06,.25,2200,0,'bandpass');tone(480,.07,'sawtooth',.06,-200)},
  hit_cloth:()=>{noise(.1,.2,500);tone(100,.1,'sine',.1)},
  hit_holy:()=>{tone(880,.15,'triangle',.07);tone(1320,.2,'sine',.05,0,.03)},
  bigHit:()=>{noise(.16,.3,800);tone(100,.22,'sawtooth',.14,-60);tone(60,.28,'sine',.2)},
  sparkle:()=>{tone(1568,.18,'triangle',.05,0,.03);tone(2093,.14,'sine',.03,0,.07)},
  die:()=>{noise(.18,.22,900);tone(260,.2,'triangle',.1,-200)},
  die_big:()=>{noise(.45,.4,500);tone(110,.5,'sawtooth',.16,-70);tone(55,.6,'sine',.2);tone(1046,.4,'triangle',.07,0,.15);tone(1568,.4,'triangle',.05,0,.22)},
  pop:()=>{tone(520,.1,'sine',.1,-320);noise(.06,.12,1500)},
  growl:()=>{noise(.4,.2,260);tone(95,.4,'sawtooth',.12,-30)},
  snarl:()=>{tone(140,.25,'sawtooth',.1,-60);noise(.2,.2,700,0,'bandpass')},
  howl:()=>{tone(380,.9,'sine',.1,260);tone(570,.9,'sine',.05,390,.05)},
  screech:()=>{tone(1900,.35,'sawtooth',.07,-900);noise(.25,.12,3500,0,'highpass')},
  hiss:()=>{noise(.5,.18,5000,0,'highpass')},
  moan:()=>{tone(150,.8,'sawtooth',.09,-40);noise(.6,.1,400)},
  chime:()=>{[1046,1318,1568].forEach((f,i)=>tone(f,.45,'sine',.06,0,i*.07))},
  clank:()=>{tone(1100,.12,'square',.05,-200);tone(180,.18,'sawtooth',.1,-80);noise(.06,.2,3000,0,'highpass')},

const OL_MAT=new THREE.MeshBasicMaterial({color:0x080a14,side:THREE.BackSide});
function addOutline(root,maxN,t){
  if(!save.outline)return root;

    const mt=m.material;if(!mt||mt.blending===THREE.AdditiveBlending)return;

    list.push({m,b,sx,sy,sz,v:sx*sy*sz*Math.abs(m.scale.x*m.scale.y*m.scale.z)});
  });
  list.sort((a,c)=>c.v-a.v);

  for(const e of list.slice(0,maxN)){
    const o=new THREE.Mesh(e.m.geometry,OL_MAT),kx=k(e.sx),ky=k(e.sy),kz=k(e.sz);
    o.scale.set(kx,ky,kz);

}

function animHero(o,t,spd,atkP,dashing,swingDir){
  const run=Math.min(1,spd),sw=Math.sin(t*13)*.85*run;

  o.body.position.y=Math.abs(Math.sin(t*13))*.13*run+Math.sin(t*2.4)*.025*(1-run);
  o.body.rotation.x=dashing?.55:run*.1;

  }else{
    if(atkP>=0){const k=atkP;o.armL.rotation.x=-1.55;o.armR.rotation.x=lerp(-1.7,-.5,easeOut(k));o.armR.rotation.z=lerp(.5,.1,k);o.torso.rotation.y=-.35}
    else{o.armL.rotation.x=-.6-sw*.3;o.armR.rotation.x=-.2-sw*.5;o.armR.rotation.z=0;o.torso.rotation.y*=.85}
  }
}

  let r;

/* ---------------- player: stats, movement, attacks, skills ---------------- */
const G={mode:'boot',t:0,ts:1,last:performance.now()};

const effAtk=()=>S.atk*(P.buff&&P.buff.atk?P.buff.atk:1)*(P.pot.atk>0?1.3:1);

/* ----- targeting ----- */

  return best;
}
function aimDir(){
  if(IS_TOUCH||mv.on){const m=nearestMob(15);if(m){const dx=m.x-P.x,dz=m.z-P.z,l=Math.hypot(dx,dz)||1;return{x:dx/l,z:dz/l,m}}return{x:Math.sin(P.face),z:Math.cos(P.face),m:null}}
  const dx=mouse.gx-P.x,dz=mouse.gz-P.z,l=Math.hypot(dx,dz)||1;return{x:dx/l,z:dz/l,m:null};
}
function aimPoint(range){
  if(IS_TOUCH||mv.on){const m=nearestMob(range);if(m)return{x:m.x,z:m.z};return{x:P.x+Math.sin(P.face)*Math.min(range,7),z:P.z+Math.cos(P.face)*Math.min(range,7)}}
  let tx=mouse.gx,tz=mouse.gz;const dd=Math.hypot(tx-P.x,tz-P.z);if(dd>range){tx=P.x+(tx-P.x)/dd*range;tz=P.z+(tz-P.z)/dd*range}return{x:tx,z:tz};
}

/* ----- movement ----- */
function playerFacing(dt){

}
function movePlayer(dt){
  let ix=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),iz=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);

  P.x+=P.vx*dt;P.z+=P.vz*dt;pushOut(P,P.r);
  if(P.dashT<=0&&!P.dead){P.stepAcc=(P.stepAcc||0)+Math.hypot(P.vx,P.vz)*dt;if(P.stepAcc>2.2){P.stepAcc=0;footstep()}}

const STEPS=['step_stone','step_grass','step_grass','step_stone','step_stone','step_stone','step_stone','step_snow','step_sand','step_marble'];

/* ----- per-frame timers / regen ----- */
function tickPlayer(dt){

/* ----- basic attack ----- */

const GEO={orb:new THREE.SphereGeometry(.5,10,8),ebul:new THREE.SphereGeometry(.38,8,6),arrow:new THREE.BoxGeometry(.1,.1,1.5),head:new THREE.ConeGeometry(.2,.5,5),line:new THREE.BoxGeometry(1,1,1)};

function telegraph(x,z,r,dur,cb,hex){

  const mk=(op,geo)=>{const m=new THREE.Mesh(geo,flatMat(hex,op));m.rotation.x=-Math.PI/2;m.position.set(x,.1,z);return m};
  const disc=mk(.2,shared.discG),fill=mk(.32,shared.discG),ring=mk(.9,shared.ringG);disc.scale.set(r,r,r);ring.scale.set(r,r,r);fill.scale.set(.01,.01,.01);ring.position.y=.12;fill.position.y=.11;
  entG.add(disc);entG.add(fill);entG.add(ring);sfx('tele');
  addFx(dur,k=>{const s=Math.max(.01,r*k);fill.scale.set(s,s,s);ring.material.opacity=.55+.4*Math.sin(k*28)},()=>{entG.remove(disc);entG.remove(fill);entG.remove(ring);disc.material.dispose();fill.material.dispose();ring.material.dispose();if(cb)cb()});
}
function boltFx(x1,z1,x2,z2,hex){
  const pts=[{x:x1,z:z1}];const n=4;
  for(let i=1;i<n;i++){const k=i/n;pts.push({x:lerp(x1,x2,k)+rnd(-.9,.9),z:lerp(z1,z2,k)+rnd(-.9,.9)})}pts.push({x:x2,z:z2});
  const ms=[];
  for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1],dx=b.x-a.x,dz=b.z-a.z,l=Math.hypot(dx,dz)||.1;const m=new THREE.Mesh(GEO.line,flatMat(hex||0xfff2a0,.95));m.position.set((a.x+b.x)/2,1.3,(a.z+b.z)/2);m.rotation.y=Math.atan2(dx,dz);m.scale.set(.16,.16,l);entG.add(m);ms.push(m)}
  addFx(.18,k=>{ms.forEach(m=>m.material.opacity=.95*(1-k))},()=>ms.forEach(m=>{entG.remove(m);m.material.dispose()}));

/* ---------------- damage to monsters ---------------- */
function freezeMob(m,t){if(m.ghost){netSendHit(m,0,{fz:t});return}m.freeze=Math.max(m.freeze||0,m.elite?t*.5:t)}
function burnMob(m,dps){if(m.ghost){netSendHit(m,0,{bn:dps});return}m.burnT=3;m.burnD=Math.max(m.burnD||0,dps)}
function dealMob(m,base,o){
  if(m.dead)return;o=o||{};
  const crit=o.crit!==undefined?o.crit:Math.random()<S.crit;
  const d=Math.max(1,Math.round(base*(crit?S.critDmg:1)*(.92+Math.random()*.16)));
  dmgNum(m.x,m.r*1.5+1.2,m.z,fmtN(d),crit?'crit':'');
  const mat=m.def&&m.def.mat||'flesh',heavy=!!o.big||base>S.atk*2.2,kxn=o.kx||0,kzn=o.kz||0,ic=crit?0xffd24a:0xfff4e0;
  if(crit){sfx('crit');sfx('hit_'+mat,.8);sfx('sparkle')}else sfx('hit_'+mat);
  if(heavy)sfx('bigHit',.8);
  burst(m.x,1.2,m.z,crit?12:4,crit?0xffd24a:0xffffff,5,.35,10);m.flash=.09;m.pop=1;
  impactFlash(m.x-(kxn?kxn/(Math.hypot(kxn,kzn)||1)*m.r*.6:0),1.3,m.z-(kzn?kzn/(Math.hypot(kxn,kzn)||1)*m.r*.6:0),ic,crit?3.4:heavy?3:2.1,crit?.2:.15);
  if(kxn||kzn){hitSparks(m.x,1.3,m.z,kxn,kzn,ic,crit?9:heavy?7:4,crit?11:8);camKick(kxn,kzn,crit?.2:heavy?.26:.07)}
  if(crit){shockRing(m.x,m.z,2.1,0xffd24a,.24);burst(m.x,1.5,m.z,6,0xfff3b0,9,.3,4,.2);cam.shake=Math.max(cam.shake,.28);hitStop(.04)}else cam.shake=Math.max(cam.shake,heavy?.2:.06);
  if(heavy)hitStop(.055);
  const kk={kx:o.kx||0,kz:o.kz||0,kb:o.noKb?0:(o.kb||0)};
  if(m.ghost){m.hp=Math.max(1,m.hp-d);netSendHit(m,d,kk)}
  else applyMobDmg(m,d,kk,SES.name);
  if(S.vamp&&!o.noProc){P.vampAcc+=d*S.vamp;if(P.vampAcc>=1){const v=Math.floor(P.vampAcc);P.vampAcc-=v;P.hp=Math.min(S.maxHp,P.hp+v)}}
  if(o.noProc)return;
  if(S.burnLv>0)burnMob(m,effAtk()*.25*S.burnLv);
  if(S.chainP>0&&Math.random()<S.chainP){
    let n=0,px=m.x,pz=m.z;const used=new Set([m]);
    for(const q of MOBS){if(n>=2)break;if(q.dead||q.spawning||used.has(q))continue;if(d2(q.x,q.z,m.x,m.z)<81){used.add(q);boltFx(px,pz,q.x,q.z);dealMob(q,base*.6,{noProc:true,noKb:true});px=q.x;pz=q.z;n++}}
  }
  if(S.explP>0&&Math.random()<S.explP)explodeAt(m.x,m.z,3.2,base*.5,0xff9a3a);
}

/* ---------------- player projectiles ---------------- */
function spawnPB(o){
  const col=o.col||(o.kind==='orb'?0x5ee7ff:0x6bffb0);const g=grp(o.x,1.3,o.z);
  if(o.kind==='orb'){mesh(GEO.orb,EM(col,1.6),0,0,0,g,false);g.add(glowS(col,2.8,.85))}
  else{mesh(GEO.arrow,M(0xe8ffe0,{emissive:col,emissiveIntensity:.8}),0,0,0,g,false);mesh(GEO.head,EM(col,1),0,0,.8,g,false);g.add(glowS(col,1.6,.6))}
  g.rotation.y=Math.atan2(o.vx,o.vz);entG.add(g);o.m=g;o.hit=[];o.t=0;o.col=col;PB.push(o);

function orbBoom(b,primary){
  const rad=b.splash;
  for(const e of MOBS){if(e.dead||e.spawning)continue;const dx=e.x-b.x,dz=e.z-b.z,d=Math.hypot(dx,dz);
    if(e===primary)dealMob(e,b.dmg,{kx:b.vx,kz:b.vz,kb:3});
    else if(d<rad+e.r)dealMob(e,b.dmg*.7,{kx:dx,kz:dz,kb:5,noProc:true})}
  const bc=b.col||0x5ee7ff;shockRing(b.x,b.z,rad,bc,.3);flashDisc(b.x,b.z,rad*.8,bc,.25);burst(b.x,1.2,b.z,14,bc,7,.45,6);sfx('boom');
}
function updatePB(dt){
  for(let i=PB.length-1;i>=0;i--){
    const b=PB[i];b.life-=dt;b.t+=dt;b.x+=b.vx*dt;b.z+=b.vz*dt;b.m.position.x=b.x;b.m.position.z=b.z;
    if(b.kind==='orb'){emit(b.x,1.3,b.z,rnd(-.5,.5),rnd(-.5,.5),rnd(-.5,.5),.35,b.col,0);b.m.scale.setScalar(1+Math.sin(b.t*30)*.1)}
    else if(Math.random()<.5)emit(b.x,1.3,b.z,0,0,0,.2,b.col,0);
    let dead=false;
    for(const e of MOBS){
      if(e.dead||e.spawning||b.hit.indexOf(e)>=0)continue;
      const rr=e.r+b.r;if(d2(e.x,e.z,b.x,b.z)<rr*rr){
        if(b.kind==='orb'){orbBoom(b,e);dead=true;break}
        dealMob(e,b.dmg,{kx:b.vx,kz:b.vz,kb:3});if(b.freeze)freezeMob(e,b.freeze);if(b.el)elemHit(e,b.el,b.eatk);b.hit.push(e);b.pierce--;if(b.pierce<=0){dead=true;break}
      }
    }

    if(dead){entG.remove(b.m);PB.splice(i,1)}
  }

/* ---------- damage application (authority) ---------- */
function applyMobDmg(m,d,kk,by){
  if(m.dead||m.spawning)return;
  m.hp-=d;m.flash=.09;m.aggro=by||null;
  if(kk&&(kk.kx||kk.kz)){const l=Math.hypot(kk.kx,kk.kz)||1;m.lx=kk.kx/l;m.lz=kk.kz/l}
  if(kk&&kk.kb){const l=Math.hypot(kk.kx,kk.kz)||1,res=m.elite?.3:1;m.kx+=kk.kx/l*kk.kb*res*1.6;m.kz+=kk.kz/l*kk.kb*res*1.6}
  if(m.hp<=0)killMob(m);
}
function killMob(m){
  if(m.dead)return;m.dead=true;retire(m,m.elite?.5:.28);
  sfxAt(m.elite?'die_big':(m.def.mat==='slime'||m.type==='bomber')?'pop':'die',m.x,m.z);if(m.elite)hitStop(.09);
  burst(m.x,1.2,m.z,m.elite?44:14,m.def.col,8,.7,8);burst(m.x,1.2,m.z,6,0xffffff,5,.4,6);flashDisc(m.x,m.z,m.r*1.6,m.def.col,.3);shockRing(m.x,m.z,m.r*2.4,m.def.col,.3);
  if(m.elite){shockRing(m.x,m.z,6,0xffd24a,.6);cam.shake=Math.max(cam.shake,.5);sfx('boom')}
  if(!P.dead||true){if(d2(m.x,m.z,P.x,P.z)<55*55)registerKill(m)}
  if(typeof netKill==='function')netKill(m);
}
function netApplyHit(h){ // member -> authority
  const m=MOBS.find(q=>q.id===h.id&&!q.ghost);if(!m||m.dead)return;
  if(h.d>0)applyMobDmg(m,h.d,{kx:h.kx||0,kz:h.kz||0,kb:h.kb||0},h.by);
  if(h.fz)m.freeze=Math.max(m.freeze,m.elite?h.fz*.5:h.fz);
  if(h.bn){m.burnT=3;m.burnD=Math.max(m.burnD,h.bn)}
}

/* ---------- AI ---------- */
function nearestT(m,T){let b=null,bd=1e9;for(const t of T){const d=d2(m.x,m.z,t.x,t.z);if(d<bd){bd=d;b=t}}return b?{t:b,d:Math.sqrt(bd)}:null}
function stepM(m,dx,dz,sp,dt){m.x+=dx*sp*dt;m.z+=dz*sp*dt}
function faceM(m,dx,dz,dt,rate){m.face=lerpAng(m.face,Math.atan2(dx,dz),1-Math.exp(-dt*(rate||10)))}
function updateMobAuth(m,dt,T){
  m.age+=dt;m.hitCd-=dt;m.cd-=dt;if(m.flash>0)m.flash-=dt;
  if(m.golden&&m.age>42){removeMob(m,true);UI.feedText('황금 슬라임이 도망쳤습니다','#9aa0b8');return}
  if(m.spawning){m.sp-=dt;if(m.sp<=0)m.spawning=false}
  if(m.burnT>0){m.burnT-=dt;m.burnTick-=dt;if(m.burnTick<=0){m.burnTick=.5;m.hp-=m.burnD*.5;m.flash=.05;dmgNum(m.x,m.r*1.5+1.2,m.z,fmtN(m.burnD*.5),'burn');if(m.hp<=0){killMob(m);return}}
    if(Math.random()<dt*14)emit(m.x+rnd(-.4,.4),rnd(.5,1.8),m.z+rnd(-.4,.4),0,2,0,.5,0xff7a2a,0)}
  m.x+=m.kx*dt;m.z+=m.kz*dt;const kd=Math.pow(.0008,dt);m.kx*=kd;m.kz*=kd;
  let sp=1;
  if(m.freeze>0){m.freeze-=dt;sp=0;if(Math.random()<dt*12)emit(m.x+rnd(-.6,.6),rnd(.4,2),m.z+rnd(-.6,.6),0,.6,0,.5,0xbff2ff,0)}

    else{ // wander
      m.wt-=dt;if(m.wt<=0){m.wt=rnd(1.5,3.5);const a=rnd(0,TAU);m.wx=Math.cos(a);m.wz=Math.sin(a);if(Math.random()<.4){m.wx=0;m.wz=0}}
      if(m.wx||m.wz){stepM(m,m.wx,m.wz,m.spd*.35,dt);faceM(m,m.wx,m.wz,dt,6);m.moving=true}
    }
  }
  if(!m.fly)pushOut(m,m.r*.7);
  const d=Math.hypot(m.x,m.z);if(d<20.5){const k=20.5/(d||1);m.x*=k;m.z*=k}
  if(d>WORLD_R-2){m.x*=(WORLD_R-2)/d;m.z*=(WORLD_R-2)/d}
}
function castPattern(m,c,t){
  const an=Math.atan2(t.x-m.x,t.z-m.z);
  if(c.kind==='fan'){for(const k of[-.3,0,.3])emitEvent({t:'b',x:m.x+Math.sin(an+k),z:m.z+Math.cos(an+k),a:an+k,s:11,d:m.dmg*.8,c:c.col,l:3})}
  else if(c.kind==='nova'){const n=10,o=m.age;for(let i=0;i<n;i++){const a=i/n*TAU+o;emitEvent({t:'b',x:m.x+Math.sin(a),z:m.z+Math.cos(a),a,s:8,d:m.dmg*.7,c:c.col,l:2.6})}}
  else if(c.kind==='strike'){emitEvent({t:'x',x:t.x,z:t.z,r:2.6,w:.8,d:m.dmg*1.2,c:c.col});emitEvent({t:'x',x:t.x+rnd(-4,4),z:t.z+rnd(-4,4),r:2.4,w:1.1,d:m.dmg*1.1,c:c.col})}
  else if(c.kind==='rain'){for(let i=0;i<4;i++)emitEvent({t:'x',x:t.x+(i?rnd(-5,5):0),z:t.z+(i?rnd(-5,5):0),r:2.3,w:.9+i*.18,d:m.dmg,c:c.col})}
}
function aiMob(m,dt,nt,sp){
  const t=nt.t,d=nt.d,dx=(t.x-m.x)/(d||1),dz=(t.z-m.z)/(d||1);
  switch(m.type){
    case 'slime':{
      if(m.hop===undefined)m.hop=0;
      if(m.cd<=0){m.cd=rnd(1,1.5);m.hop=.38}
      if(m.hop>0){m.hop-=dt;if(m.golden){stepM(m,-dx,-dz,m.spd*2.2,dt);faceM(m,-dx,-dz,dt,14)}else{stepM(m,dx,dz,m.spd*2.7,dt);faceM(m,dx,dz,dt,14)}m.moving=true}
      break}
    case 'bat':{
      if(m.state==='chase'){const an=Math.atan2(dx,dz)+Math.sin(m.age*3.2+m.ph)*.85;stepM(m,Math.sin(an),Math.cos(an),m.spd,dt);faceM(m,Math.sin(an),Math.cos(an),dt,12);m.moving=true;
        if(m.cd<=0){m.state='dive';m.st=.75;m.cd=rnd(2.4,3.6)}}
      else if(m.state==='dive'){m.st-=dt;m.warn=m.st>.5;faceM(m,dx,dz,dt,16);stepM(m,dx,dz,m.spd*(m.st>.5?.2:2.1),dt);m.moving=true;if(m.st<=0){m.state='chase';m.warn=false}}
      else{m.st-=dt;stepM(m,-dx,-dz,m.spd*1.1,dt);m.moving=true;if(m.st<=0)m.state='chase'}
      break}
    case 'skel':{
      if(m.state==='chase'){faceM(m,dx,dz,dt);if(d>1.9){stepM(m,dx,dz,m.spd,dt);m.moving=true}else{m.state='wind';m.st=.55;m.warn=true}}
      else if(m.state==='wind'){m.st-=dt;faceM(m,dx,dz,dt,6);
        if(m.st<=0){m.warn=false;emitEvent({t:'s',x:m.x,z:m.z,f:m.face,r:2.7,a:1.7,d:m.dmg});m.state='rec';m.st=.8}}
      else{m.st-=dt;if(m.st<=0)m.state='chase'}
      break}
    case 'archer':{
      faceM(m,dx,dz,dt,12);
      if(m.state==='wind'){m.st-=dt;m.warn=true;
        if(m.st<=0){m.warn=false;const an=Math.atan2(t.x-m.x,t.z-m.z);emitEvent({t:'b',x:m.x+Math.sin(an),z:m.z+Math.cos(an),a:an,s:12.5,d:m.dmg,c:0xc9b6ff,l:3});m.state='move';m.cd=rnd(2,2.8)}}
      else{let mvv=0;if(d<8)mvv=-1;else if(d>13)mvv=1;
        if(mvv){stepM(m,dx*mvv,dz*mvv,m.spd,dt);m.moving=true}else{stepM(m,-dz*m.strafe,dx*m.strafe,m.spd*.55,dt);m.moving=true}
        if(m.cd<=0&&d<18){m.state='wind';m.st=.45}}
      break}
    case 'bomber':{
      if(m.state==='chase'){faceM(m,dx,dz,dt,14);stepM(m,dx,dz,m.spd,dt);m.moving=true;if(d<2.8){m.state='fuse';m.st=.85;m.warn=true;emitEvent({t:'x',x:m.x,z:m.z,r:4,w:.85,d:m.dmg,c:0xff5a2a})}}
      else{m.st-=dt;if(m.st<=0){removeMob(m,true);sfx('boom')}}
      break}
    case 'boar':case 'hound':case 'frostwolf':case 'jackal':{
      const c=m.def.ch;
      if(m.state==='chase'||m.state==='retreat'){faceM(m,dx,dz,dt,10);
        if(m.type!=='boar'&&d<7&&d>2.6){stepM(m,-dz*m.strafe*.8+dx*.3,dx*m.strafe*.8+dz*.3,m.spd*.8,dt);m.moving=true}
        else if(d>1.7){stepM(m,dx,dz,m.spd,dt);m.moving=true}
        if(m.cd<=0&&d>c.min&&d<c.max){m.state='tele';m.st=c.tel;m.warn=true;m.cdx=dx;m.cdz=dz;emitEvent({t:'v',x:m.x,z:m.z,n:m.def.snd})}
        else if(m.cd<=0&&d<=c.min)m.cd=.4}
      else if(m.state==='tele'){m.st-=dt;faceM(m,dx,dz,dt,14);m.cdx=dx;m.cdz=dz;if(m.st<=0){m.warn=false;m.state='rush';m.st=c.dur}}
      else if(m.state==='rush'){m.st-=dt;stepM(m,m.cdx,m.cdz,m.spd*c.sp,dt);faceM(m,m.cdx,m.cdz,dt,20);m.moving=true;if(m.st<=0){m.state='rec';m.st=c.rec;m.cd=rnd(c.cd[0],c.cd[1])}}

    case 'wraith':case 'stormhawk':case 'icewitch':case 'seraph':{

      if(m.state==='wind'){m.st-=dt;m.warn=true;if(m.st<=0){m.warn=false;castPattern(m,c,t);m.state='move';m.cd=rnd(c.cd[0],c.cd[1])}}
      else{let mvv=0;if(d<c.lo)mvv=-1;else if(d>c.hi)mvv=1;
        if(mvv)stepM(m,dx*mvv,dz*mvv,m.spd,dt);else stepM(m,-dz*m.strafe,dx*m.strafe,m.spd*.5,dt);m.moving=true;
        if(m.cd<=0&&d<c.hi+5){m.state='wind';m.st=c.wind;emitEvent({t:'v',x:m.x,z:m.z,n:m.def.snd})}}
      break}

function updateMobs(dt){
  const auth=isAuth();
  if(auth){
    const A=allPos(),T=targets();
    updateSpawns(dt,A);
    for(const m of MOBS){if(m.dead||m.ghost)continue;updateMobAuth(m,dt,T)}
    // soft separation
    for(let i=0;i<MOBS.length;i++){const a=MOBS[i];if(a.dead||a.fly||a.ghost)continue;
      for(let j=i+1;j<MOBS.length;j++){const b=MOBS[j];if(b.dead||b.fly||b.ghost)continue;const dx=b.x-a.x,dz=b.z-a.z;if(Math.abs(dx)>3||Math.abs(dz)>3)continue;
        const rr=(a.r+b.r)*.85,dd=dx*dx+dz*dz;if(dd<rr*rr&&dd>1e-5){const d=Math.sqrt(dd),k=(rr-d)/d*.5;a.x-=dx*k;a.z-=dz*k;b.x+=dx*k;b.z+=dz*k}}}
  }else{
    for(const m of MOBS){if(!m.ghost||m.dead)continue;
      const k=1-Math.exp(-dt*9),ox=m.x,oz=m.z;m.x=lerp(m.x,m.tx,k);m.z=lerp(m.z,m.tz,k);m.age+=dt;m.hitCd-=dt;if(m.flash>0)m.flash-=dt;
      m.moving=Math.hypot(m.x-ox,m.z-oz)>.01;if(m.spawning){m.sp-=dt;if(m.sp<=0)m.spawning=false}
      if(m.type==='slime'){m.hop=m.moving?.2:0}}
  }
  for(const m of MOBS){if(m.dead)continue;contactCheck(m);tintMob(m);animMob(m,dt)}
  updateDying(dt);compactMobs();
  updateMobLabels();
}
function updateMobLabels(){
  const near=[];for(const m of MOBS){if(m.dead||m.spawning)continue;const d=d2(m.x,m.z,P.x,P.z);if(d<20*20)near.push([d,m])}
  near.sort((a,b)=>a[0]-b[0]);
  const n=Math.min(10,near.length);
  while(mobLabels.length<10){const el=document.createElement('div');el.className='ml';el.innerHTML='<span class="mn"></span><i class="mb"><b></b></i>';labelsEl.appendChild(el);mobLabels.push({el,n:el.firstElementChild,b:null})}

/* ---------- gathering by normal attacks ----------

   trees: 3-5 normal-attack hits (shakes each time) -> falls -> sapling -> grows back
   mastery (server-stored): more chop power per hit, bonus yield chance */
const GAT={anim:[],weedAnim:[],pend:{weed:0,wood:0},busy:false,tf:0,wt:0,sw:0,_m:new THREE.Matrix4(),_a:new THREE.Matrix4(),_b:new THREE.Matrix4(),_z:new THREE.Matrix4().makeScale(0,0,0),_v:new THREE.Vector3()};

  n.sh={t:0,dur:.42,amp:.07+Math.random()*.03,ph:Math.random()*6.28,dx:n.x-fromX,dz:n.z-fromZ};GAT.anim.indexOf(n)<0&&GAT.anim.push(n);

/* ranged normal attacks: a strip in front; weeds pierce, only the nearest tree is struck */
function gatherLine(dx,dz,len,power){
  if(!P)return;const f=Math.atan2(dx,dz),cx=Math.floor((P.x+dx*len/2)/8),cz=Math.floor((P.z+dz*len/2)/8),R=Math.ceil(len/16)+1,dmg=gatPower()*(power||1);let tree=null,td=1e9;
  for(let i=-R;i<=R;i++)for(let j=-R;j<=R;j++){const a=WORLD.ngrid[(cx+i)+','+(cz+j)];if(!a)continue;
    for(const n of a){if(n.st)continue;const rx=n.x-P.x,rz=n.z-P.z,al=rx*dx+rz*dz;if(al<-.3||al>len)continue;const lat=Math.abs(rx*dz-rz*dx),w=n.k==='weed'?1.1:.8+n.s*.5;if(lat>w)continue;
      if(n.k==='weed')nodeHit(n,dmg,f,P.x,P.z);else if(al<td){td=al;tree=n}}}
  if(tree)nodeHit(tree,dmg,f,P.x,P.z);gatNotify();
}
function gatPower(){return gatSpeed(gatLvNow())}
function gatNotify(){if(GAT.sw>0){dmgNum(P.x,2.3,P.z,'+'+MATS.weed.name+(GAT.sw>1?' x'+GAT.sw:''),'gold');sfx('pickup',.35);GAT.sw=0}}
function tickGather(dt){
  if(!P)return;
  /* trees: shake / fall / sapling / grow (per frame; only a few meshes) */
  for(let i=GAT.anim.length-1;i>=0;i--){const n=GAT.anim[i];let done=false;
    if(n.st==='fall'){n.ft+=dt;const u=Math.min(1,n.ft/GT_FALL),th=Math.min(1.5,u*u*1.9);GAT._b.makeRotationAxis(GAT._v.set(n.fz,0,-n.fx),th);
      gatSet(n,q=>gatAbout(n,q,GAT._b));
      if(u>=1){n.st='wait';n.wt=GT_SAP_WAIT;gatHide(n);for(let k=0;k<10;k++)emit(n.x+rnd(-1,1),rnd(.2,1),n.z+rnd(-1,1),rnd(-1.2,1.2),rnd(.5,1.6),rnd(-1.2,1.2),rnd(.5,.9),0x8a7a5a,6)}}
    else if(n.st==='wait'){n.wt-=dt;if(n.wt<=0){n.st='sap';n.gt=0}}
    else if(n.st==='sap'){n.gt+=dt;const u=Math.min(1,n.gt/GT_GROW),e=u*u*(3-2*u),sc=.07+.93*e;GAT._b.makeScale(sc,sc,sc);gatSet(n,q=>gatAbout(n,q,GAT._b));if(n.ob)n.ob.r=n.or*Math.max(0,(e-.25)/.75);
      if(u>=1){n.st=null;n.hp=null;n.hp0=3+Math.floor(Math.random()*3);gatShow(n);if(n.ob)n.ob.r=n.or;done=true}}
    else if(n.sh){const s=n.sh;s.t+=dt;const u=s.t/s.dur;
      if(u>=1){n.sh=null;gatShow(n);done=true}
      else{const k=Math.exp(-4*u)*Math.sin(u*34+s.ph),l=Math.hypot(s.dx,s.dz)||1;GAT._b.makeRotationAxis(GAT._v.set(s.dz/l,0,-s.dx/l),k*s.amp*3.2);gatSet(n,q=>gatAbout(n,q,GAT._b))}}
    else done=true;
    if(done)GAT.anim.splice(i,1)}
  /* weeds: updated at ~12 Hz (their meshes hold thousands of instances) */
  GAT.wt+=dt;if(GAT.wt>=.083){const step=GAT.wt;GAT.wt=0;
    for(let i=GAT.weedAnim.length-1;i>=0;i--){const n=GAT.weedAnim[i];
      if(n.st==='gone'){n.ft+=step;const u=Math.min(1,n.ft/.14);GAT._b.makeScale(1+.2*u,Math.max(.001,1-u),1+.2*u);gatSet(n,q=>gatAbout(n,q,GAT._b));if(u>=1){gatHide(n);n.st='wait';n.wt-=n.ft}}
      else if(n.st==='wait'){n.wt-=step;if(n.wt<=0){n.st='sap';n.gt=0}}
      else if(n.st==='sap'){n.gt+=step;const u=Math.min(1,n.gt/GT_WEED_GROW),e=1-Math.pow(1-u,3),o=u>.7?Math.sin((u-.7)/.3*Math.PI)*.08:0,sc=Math.max(.02,e+o);
        GAT._b.makeScale(sc,sc,sc);gatSet(n,q=>gatAbout(n,q,GAT._b));if(u>=1){n.st=null;gatShow(n);GAT.weedAnim.splice(i,1)}}}}
  GAT.tf+=dt;if(GAT.tf>1.2){GAT.tf=0;flushGather()}
}
async function flushGather(){
  const w=GAT.pend.weed,d=GAT.pend.wood;if(GAT.busy||!(w+d)||!SES.token)return;
  if(typeof claiming!=='undefined'&&claiming)return;
  GAT.pend.weed=GAT.pend.wood=0;GAT.busy=true;const lv0=gatLvNow();
  try{
    const r=await API.call('gather',Math.min(30,w),Math.min(30,d));
    if(w>30)GAT.pend.weed+=w-30;if(d>30)GAT.pend.wood+=d-30;
    if(r&&r.up||gatLvNow()>lv0){const lv=gatLvNow();UI.toast('채집 숙련 Lv.'+lv+' 달성! 벌목 위력 +'+Math.round((gatSpeed(lv)-1)*100)+'% · 추가 획득 '+(gatDouble(lv)*100).toFixed(1)+'%');sfx('level')}
    if(r&&((r.weed|0)>Math.min(30,w)||(r.wood|0)>Math.min(30,d)))dmgNum(P.x,2.8,P.z,'추가 획득!','gold');
    UI.refreshHud();UI.afterProfile&&UI.afterProfile();if(UI.modal&&UI.rerender)UI.rerender();
  }catch(e){if(/NET/.test(e.message)){GAT.pend.weed+=w;GAT.pend.wood+=d}}
  GAT.busy=false;if(GAT.pend.weed+GAT.pend.wood>0)setTimeout(flushGather,0);
}

/* ---------- job advancement ---------- */
function modText(m){
  const t=[];if(m.hp)t.push('체력 '+(m.hp>1?'+':'')+Math.round((m.hp-1)*100)+'%');if(m.atk)t.push('공격력 '+(m.atk>1?'+':'')+Math.round((m.atk-1)*100)+'%');if(m.aps)t.push('공속 +'+Math.round((m.aps-1)*100)+'%');
  if(m.spd)t.push('이속 +'+Math.round((m.spd-1)*100)+'%');if(m.crit)t.push('치명타 +'+Math.round(m.crit*100)+'%');if(m.armor)t.push('피해 감소 +'+Math.round(m.armor*100)+'%');if(m.vamp)t.push('흡혈 '+Math.round(m.vamp*100)+'%');
  if(m.burn)t.push('화상 Lv.'+m.burn);if(m.chain)t.push('연쇄 번개');if(m.pierce)t.push('관통 +'+m.pierce);if(m.regen)t.push('체력 재생');if(m.berserk)t.push('체력 50% 이하 공속 +40%');return t.join(' · ');
}

function initTouch(){

  const joy=$('joy'),knob=$('knob');let jid=null,cx=0,cy=0;
  const R=58;
  const setStick=(x,y)=>{
    let dx=x-cx,dy=y-cy;const l=Math.hypot(dx,dy);if(l>R){dx=dx/l*R;dy=dy/l*R}
    knob.style.transform='translate('+dx+'px,'+dy+'px)';
    const m=Math.hypot(dx,dy)/R;if(m<.12){mv.x=mv.z=0;return}

  if(!d||!Array.isArray(d.members))return;
  if(d.members.includes(SES.name))setParty({id:d.id,leader:d.leader,members:d.members.slice(0,4)});
  else if(NET.party&&NET.party.id===d.id)setParty(null);
}
function setParty(p){
  const was=NET.party;NET.party=p;
  const changed=!was!==!p||(was&&p&&(was.leader!==p.leader));
  if(changed)resetMobs();
  UI.renderParty();
}
function partyLeave(){
  if(!NET.party)return;const p=NET.party;netSend('pl',{n:SES.name,id:p.id});setParty(null);UI.toast('파티를 떠났습니다');
}
function onPLeave(d){
  if(!d||!NET.party||NET.party.id!==d.id)return;
  const was=NET.party.leader;NET.party.members=NET.party.members.filter(n=>n!==d.n);
  if(NET.party.leader===d.n)NET.party.leader=NET.party.members[0];
  if(NET.party.members.length<=1){if(NET.party.members[0]===SES.name){setParty(null)}return}
  if(NET.party.leader!==was)resetMobs();
  if(NET.party.leader===SES.name)broadcastParty();
  UI.renderParty();
}
function checkParty(){ // presence-based cleanup (disconnects)
  if(!NET.party)return;const now=performance.now();let changed=false;
  for(const n of NET.party.members.slice()){
    if(n===SES.name)continue;
    if(!NET.peers[n]){const t=NET.partyGone[n]||(NET.partyGone[n]=now);if(now-t>6000){delete NET.partyGone[n];
      NET.party.members=NET.party.members.filter(x=>x!==n);if(NET.party.leader===n){NET.party.leader=NET.party.members[0];resetMobs()}changed=true}}
    else delete NET.partyGone[n];
  }
  if(changed){if(NET.party.members.length<=1)setParty(null);else{if(NET.party.leader===SES.name)broadcastParty();UI.renderParty()}}
}
function onTInvite(d){if(d&&d.t===SES.name)UI.tradeInvite(d.f,d.tid)}
function netTradeInvite(to,tid){netSend('ti',{f:SES.name,t:to,tid})}

/* ---------- enemy sync (party only) ---------- */
function onSnap(d){
  if(!d||!NET.party||isAuth()||d.n!==NET.party.leader||!Array.isArray(d.l))return;
  const seen=new Set();
  for(const it of d.l){
    const id=it[0],type=MTYPES[it[1]];if(!type)continue;seen.add(id);
    let m=MOBS.find(q=>q.id===id&&q.ghost);
    if(!m){m=makeMobObj(id,type,+it[2],+it[3],+it[6]||1,!!(it[7]&1),true)}
    m.tx=+it[2];m.tz=+it[3];m.face=+it[4]||0;m.hp=m.maxHp*(+it[5]/100);m.warn=!!(it[7]&2);
  }
  for(const m of MOBS){if(m.ghost&&!m.dead&&!seen.has(m.id)){removeMob(m,true)}}
}
function netSnapshot(){
  if(!NET.on||!NET.party||NET.party.members.length<2||!isAuth())return;
  const A=allPos(),l=[];
  for(const m of MOBS){if(m.dead||m.ghost||m.spawning)continue;let near=false;for(const q of A)if(d2(m.x,m.z,q.x,q.z)<75*75){near=true;break}if(!near)continue;
    l.push([m.id,MTYPES.indexOf(m.type),+m.x.toFixed(1),+m.z.toFixed(1),+m.face.toFixed(2),Math.max(1,Math.round(m.hp/m.maxHp*100)),m.ml,(m.elite?1:0)|(m.warn?2:0)]);if(l.length>=44)break}
  netSend('es',{n:SES.name,l});
}
function onHit(d){
  if(!d||!NET.party||!isAuth()||d.to!==SES.name||!Array.isArray(d.h))return;
  for(const h of d.h.slice(0,40))netApplyHit({id:h.id,d:Math.max(0,Math.min(1e6,+h.d||0)),kx:+h.kx||0,kz:+h.kz||0,kb:Math.min(20,+h.kb||0),fz:Math.min(5,+h.fz||0),bn:Math.min(1e5,+h.bn||0),by:d.by});
}
function onKillCredit(d){
  if(!d||!Array.isArray(d.to)||!d.to.includes(SES.name))return;
  registerKill({zid:clamp(d.z|0,1,4),ml:clamp(d.ml|0,1,42),elite:!!d.e,x:+d.x||P.x,z:+d.zz||P.z,r:1});
}
function onEnemyEv(d){if(!d||!d.ev||isAuth())return;const e=d.ev;if(!isFinite(+e.x)||!isFinite(+e.z))return;runEnemyEvent(e)}

/* ---------- per-frame ---------- */
function netUpdate(dt){
  const auth=isAuth();
  if(auth!==NET.lastAuth){NET.lastAuth=auth;resetMobs()}
  if(NET.on&&NET.ch){
    const now=performance.now();
    if(now-NET.lastPos>100){
      const moved=Math.abs(P.x-NET.lastX)>.02||Math.abs(P.z-NET.lastZ)>.02||Math.abs(P.face-NET.lastF)>.05;
      if(moved||now-NET.lastPos>1200){NET.lastPos=now;NET.lastX=P.x;NET.lastZ=P.z;NET.lastF=P.face;
        netSend('p',{n:SES.name,x:+P.x.toFixed(2),z:+P.z.toFixed(2),f:+P.face.toFixed(2),m:(P.ix||P.iz)?1:0,h:Math.round(P.hp/S.maxHp*100),d:P.dead?1:0})}
    }
    if(now-NET.lastSnap>120){NET.lastSnap=now;netSnapshot();netFlushHits()}
  }
  for(const k in NET.peers){
    const p=NET.peers[k];if(!p.got){if(p.model)p.model.g.visible=false;continue}
    if(!p.model){p.model=makeHeroFor(p.cls,p.job,CLS[p.cls].col);applyWeaponLook(p.model,p.w);entG.add(p.model.g)}
    if(!p.label)p.label=makeLabel(peerLabel(p),'pl');
    const kk=1-Math.exp(-dt*10);p.x=lerp(p.x,p.tx,kk);p.z=lerp(p.z,p.tz,kk);p.f=lerpAng(p.f,p.tf,kk);p.anim+=dt;
    p.model.g.visible=!p.dead;p.model.g.position.set(p.x,0,p.z);p.model.g.rotation.y=p.f;
    animHeroFor(p.model,p.anim,Math.hypot(p.tx-p.x,p.tz-p.z)>.15?1:0,-1,false,1);
    p.label.pos(p.x,3.3,p.z);
  }
}
function netClearModels(){for(const k in NET.peers){const p=NET.peers[k];if(p.model){entG.remove(p.model.g);p.model=null}if(p.label){p.label.remove();p.label=null}}}

/* ---------------- main ---------------- */
let loopOn=false;
window.onKeyPress=(k,e)=>{
  if(!P)return;
  if(k==='escape'){if(UI.modal)UI.close();else openSettings();return}
  if(UI.modal){if(k==='i'||k==='p'||k==='j')UI.close();return}
  if(k==='enter'){openChatInput();return}
  if(k==='i')return openInventory();
  if(k==='p')return openParty();
  if(k==='j')return openDaily();
  if((k==='e'||k==='f')&&nearNpc()){interact();return}
  if(k==='e')return trySkill('e');
  if(k==='q')return trySkill('q');
  if(k==='r')return trySkill('r');
  if(k===' ')return doDash();
  if(k>='1'&&k<='6')return usePotionKey(POTION_ORDER[+k-1]);
};
document.addEventListener&&document.addEventListener('click',e=>{try{auInit();const t=e.target&&e.target.closest&&e.target.closest('.btn,.tab,.item,.c');if(t&&!t.disabled)sfx('click')}catch(x){}});
document.addEventListener&&document.addEventListener('visibilitychange',()=>{if(document.hidden)flushKills()});

function enterGame(){
  loginEnd();
  $('login').classList.add('hidden');$('hud').classList.remove('hidden');
  buildHud();initTouch();
  newPlayer();UI.refreshHud();UI.zone=-1;
  cam.x=P.x;cam.z=P.z;

  UI.feedText(SES.mode==='online'?'접속했습니다':'오프라인 모드 (이 기기에만 저장)','#9fc8ff');
  if(first)UI.toast(IS_TOUCH?'상점에서 물약을 구입하고, 필드로 나가 몬스터를 사냥하세요':'상점(E)에서 물약을 구입하고, 마을 밖으로 나가 사냥하세요',4200);
  if(!IS_TOUCH)canvas.focus();
  dailyOnEnter();
  if(perkOf(SES.pf).pts>0)UI.toast('능력치 강화 포인트가 '+perkOf(SES.pf).pts+'개 있습니다 (왼쪽 위 프로필을 눌러 선택)',4200);
}


/* ---------------- login backdrop: live town + class line-up ---------------- */
const LOGIN={g:null,heroes:{},sel:'warrior',on:true,t:0};
function buildLoginScene(){
  if(LOGIN.g)scene.remove(LOGIN.g);
  const g=new THREE.Group();scene.add(g);LOGIN.g=g;LOGIN.heroes={};
  loginPick(LOGIN.sel||'warrior');
}
function getLoginHero(k){
  if(!LOGIN.heroes[k]){
    const h=makeHeroFor(k,null,CLS[k].col);h.g.position.set(0,0,11.4);h.g.visible=false;LOGIN.g.add(h.g);
    const gl=glow(CLS[k].col,5,.4);gl.position.set(0,.2,0);h.g.add(gl);h.sel=gl;h.sc=1.28;LOGIN.heroes[k]=h;
  }
  return LOGIN.heroes[k];
}
function loginPick(k){LOGIN.sel=k;if(LOGIN.g)getLoginHero(k)}
function loginScene(dt){
  if(!LOGIN.g||!LOGIN.on)return;
  LOGIN.t+=dt;const a=Math.sin(LOGIN.t*.18)*.4,cx=0,cz=11.5,dist=8,h=3;
  for(const k in LOGIN.heroes){const o=LOGIN.heroes[k],sel=k===LOGIN.sel;
    if(o.g.visible!==sel)o.g.visible=sel;if(!sel)continue;
    o.g.scale.set(o.sc,o.sc,o.sc);o.g.rotation.y=lerpAng(o.g.rotation.y,a*.8,dt*3);
    animHeroFor(o,LOGIN.t,0,Math.max(0,Math.sin(LOGIN.t*2.2)*.6)-.1,false,1);
  }
  cam.x=cx;cam.z=cz;updateCam(dt,cx,cz,true);
  camera.position.set(cx+Math.sin(a)*dist,h,cz+Math.cos(a)*dist);camera.lookAt(cx,1.5,cz);camera.updateMatrixWorld();
  const w=innerWidth,hh=innerHeight;
  if(w>=900&&camera.setViewOffset){camera.setViewOffset(w,hh,-w*.17,0,w,hh)}else if(camera.clearViewOffset)camera.clearViewOffset();
}
function loginEnd(){LOGIN.on=false;if(LOGIN.g)LOGIN.g.visible=false;if(camera.clearViewOffset)camera.clearViewOffset();camera.updateProjectionMatrix()}

let lastZoneAudio=-1;
function frame(dt){
  if(P&&G.mode==='play'){
    const modal=!!UI.modal;
    playerFacing(dt);
    if(P.dead||modal){P.ix=P.iz=0;P.vx*=.85;P.vz*=.85;P.x+=P.vx*dt;P.z+=P.vz*dt;pushOut(P,P.r)}else movePlayer(dt);
    tickPlayer(dt);tickGather(dt);
    if(!modal)tryAttackInput();
    updatePB(dt);updateEB(dt);updateMobs(dt);updatePlayerModel(dt);
    netUpdate(dt);
    const z=zoneAt(P.x,P.z);updateAtmo(dt,z.id);
    if(z.id!==lastZoneAudio){lastZoneAudio=z.id;musicMode(z.id?'field':'town');AU.mode=z.id?'field':'town';ambZone(z.id)}
    KBt+=dt;if(KBn&&KBt>4)flushKills();
    for(const n of WORLD.npcs){const p=n.model.g.position;n.label.pos(p.x,4.1,p.z);n.model.g.rotation.y=lerpAng(n.model.g.rotation.y,Math.atan2(P.x-p.x,P.z-p.z),dt*2);animHero(n.model,G.t,0,-1,false,1)}
    ambientFx(dt,z.id,cam.x,cam.z);
    for(const L of WORLD.lava){L.m.material.opacity=.45+Math.sin(G.t*2+L.x)*.12}
    UI.hudTick(dt);
    updateCam(dt,P.x,P.z,false);
  }else{
    try{loginScene(dt)}catch(e){LOGIN.on=false;if(LOGIN.g)LOGIN.g.visible=false;console.error('login',e)}
    if(!LOGIN.g||!LOGIN.on)updateCam(dt,0,8,true);updateAtmo(dt,0);ambientFx(dt,0,0,11);
    for(const n of WORLD.npcs)animHero(n.model,G.t,0,-1,false,1);
  }
  try{updateWorldFx(dt,G.t)}catch(e){}
  updateParticles(dt);updateFx(dt);updateDN(dt);
  if(!P||G.mode!=='play'){hideMobLabels();for(const n of WORLD.npcs)n.label.el.style.display='none'}
  renderFrame();
}
function loop(now){
  requestAnimationFrame(loop);
  let dt=Math.min(.05,(now-G.last)/1000);G.last=now;if(!(dt>0))return;
  G.t+=dt;let sdt=dt;if(G.hs>0){G.hs-=dt;sdt=dt*.05}   // hit-stop: sim crawls for a few frames on heavy hits
  frame(sdt);
}

async function boot(){
  loadSave();setVol(save.vol);
  scene.fog=new THREE.FogExp2(0x8fb4d8,.0052);
  sun.castShadow=!!save.shadows;renderer.shadowMap.enabled=!!save.shadows;
  buildWorld();try{buildLoginScene()}catch(e){console.error('login scene',e);LOGIN.g=null}initLogin();
  cam.x=0;cam.z=8;
  if(!loopOn&&typeof requestAnimationFrame==='function'){loopOn=true;requestAnimationFrame(loop)}
  const mode=await API.probe();
  $('lstat').textContent=mode==='online'?'서버 연결됨':'서버에 연결할 수 없어 오프라인 모드로 실행됩니다 (이 기기에만 저장)';
  $('lhelp').textContent=IS_TOUCH?'조이스틱으로 이동, 오른쪽 버튼으로 공격합니다.':'WASD 이동 · 마우스 공격 · Q/E/R 스킬 · Space 대시';
  try{
    const s=JSON.parse(localStorage.getItem('rw_sess')||'null');
    if(s&&s.mode===mode&&s.name&&s.token){await API.resume(s.name,s.token);enterGame()}
  }catch(e){try{localStorage.removeItem('rw_sess')}catch(e2){}}
}
if(window.__RW_TEST)window.__RW={TUNE,save,renderer,scene,camera,sun,hemi,mouse,keys,skillOf,SES,API,LocalAPI,get P(){return P},get S(){return S},MOBS,UI,NET,frame,enterGame,boot,initLogin,derive,dealMob,flushKills,registerKill,trySkill,doAttack,usePotionKey,openInventory,openShop,openSmith,openJob,openAuction,openParty,openSettings,interact,nearNpc,rebuild:()=>buildWorld(),WORLD,GAT,gatherArc,gatherLine,tickGather,flushGather,MATS,gatLvOf,hurtPlayer,respawn,KB,CLASSES,JOBS,JOB_KIDS,buildPlayerModel,newPlayer,nightK,huntInfo,updateAtmo,makeMobObj,makeHeroFor,animHeroFor,applyWeaponLook,WLOOK,myWeaponBase,openPerks,perkOf,MDEF,DYING,ZONES,WORLD_R,zoneAt,mobLevel,armorBonus,armorName,armorDef,armorHp,wName,wType,sellValue,enhCost,ASLOTS,ASET_KEYS,drawMini,buildWorld};
else boot();
